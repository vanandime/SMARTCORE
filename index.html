<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Ultimate - All-in-One Platform & AI Workspace v1.5</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1b4b;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }
        .glass-panel {
            background: rgba(30, 27, 75, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- AUTH & ONBOARDING MODAL OVERLAY -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl relative border border-brand-500/30">
            <div class="text-center mb-6">
                <div class="inline-flex p-3 bg-brand-600/20 text-brand-400 rounded-2xl mb-3 text-2xl">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-tight text-white">SmartCore Access</h2>
                <p id="authSubtitle" class="text-sm text-slate-400 mt-1">Masuk sebagai Admin atau Daftar Akun Baru</p>
            </div>

            <!-- Tab Switcher Auth -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl mb-6 border border-slate-800">
                <button onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md">Masuk</button>
                <button onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">Registrasi</button>
                <button onclick="switchAuthTab('admin')" id="tabAdminBtn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">Admin</button>
            </div>

            <!-- Auth Forms Container -->
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="nameFieldGroup" class="hidden">
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Nama Lengkap / Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="regName" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm text-white placeholder-slate-500" placeholder="John Doe">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Email / Identitas</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" id="authEmail" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm text-white placeholder-slate-500" placeholder="user@smartcore.io">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Kata Sandi / API Token</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="authPassword" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm text-white placeholder-slate-500" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" class="flex-1 flex flex-col min-h-screen">
        <!-- TOP NAVIGATION BAR -->
        <header class="glass-panel border-b border-slate-800 sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white tracking-wide text-base">SmartCore <span class="text-brand-400 text-xs px-2 py-0.5 bg-brand-500/20 rounded-full border border-brand-500/30">v1.5 All-in-One</span></h1>
                        <p class="text-xs text-slate-400">Social • Tools • GitHub • Gemini AI</p>
                    </div>
                </div>
            </div>

            <!-- Nav Tabs -->
            <nav class="hidden md:flex items-center gap-1 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800">
                <button onclick="switchTab('social')" id="navSocial" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-globe text-brand-400"></i> Media Sosial
                </button>
                <button onclick="switchTab('tools')" id="navTools" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-toolbox text-indigo-400"></i> Alat Serbaguna
                </button>
                <button onclick="switchTab('github')" id="navGithub" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-brands fa-github text-emerald-400"></i> Server GitHub
                </button>
                <button onclick="switchTab('gemini')" id="navGemini" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-brain text-purple-400"></i> Gemini AI
                </button>
                <button onclick="switchTab('admin')" id="navAdmin" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2 hidden">
                    <i class="fa-solid fa-shield-halved text-rose-400"></i> Panel Admin
                </button>
            </nav>

            <!-- User Profile & Logout -->
            <div class="flex items-center gap-3">
                <div id="userBadge" class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="currentUsernameDisplay" class="font-medium text-slate-200">Guest</span>
                </div>
                <button onclick="logoutUser()" title="Keluar / Ganti Akun" class="p-2.5 bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-xl border border-slate-800 transition-all">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- MAIN WORKSPACE CONTAINER -->
        <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
            <div id="workspaceContent" class="space-y-6">
                <div class="glass-panel p-8 rounded-2xl text-center space-y-4">
                    <div class="inline-flex p-4 bg-brand-500/10 text-brand-400 rounded-full text-3xl">
                        <i class="fa-solid fa-spinner animate-spin"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-white">Memuat Sistem Utama v1.5...</h3>
                    <p class="text-sm text-slate-400 max-w-md mx-auto">Silakan balas dengan huruf **"v"** untuk melanjutkan ke **Bagian 2 (Main Workspace & UI Components)**.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- TEMPLATES FOR VIEWS (DI-RENDER DINAMIS OLEH JAVASCRIPT) -->
    <template id="templateSocialView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Feed Utama (2 Kolom) -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Buat Postingan Baru -->
                <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-800">
                    <form onsubmit="handleCreatePost(event)" class="space-y-4">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm border border-brand-500/30">
                                <span id="postAuthorInitial">U</span>
                            </div>
                            <textarea id="postContentInput" rows="3" required class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-brand-500 focus:border-transparent resize-none" placeholder="Apa yang sedang Anda pikirkan atau bagikan hari ini?"></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
                            <div class="flex items-center gap-2 text-slate-400 text-xs">
                                <label class="cursor-pointer hover:text-brand-400 transition-colors flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 rounded-lg border border-slate-800">
                                    <i class="fa-solid fa-image text-brand-400"></i> Lampirkan Gambar
                                    <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">
                                </label>
                                <span id="imageFileName" class="text-slate-500 italic truncate max-w-xs"></span>
                            </div>
                            <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow-md shadow-brand-600/30 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> Publikasikan
                            </button>
                        </div>
                        <div id="imagePreviewContainer" class="hidden relative mt-2 rounded-xl overflow-hidden max-h-48 border border-slate-800">
                            <img id="postImagePreview" src="" alt="Preview" class="w-full object-cover">
                            <button type="button" onclick="removePostImage()" class="absolute top-2 right-2 p-1.5 bg-slate-900/80 hover:bg-rose-500 text-white rounded-lg transition-colors"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </form>
                </div>

                <!-- Feed Container -->
                <div id="postsFeedContainer" class="space-y-4">
                    <div class="glass-panel p-6 rounded-2xl text-center text-slate-400 text-sm">
                        Memuat linimasa postingan...
                    </div>
                </div>
            </div>

            <!-- Sidebar Kanan -->
            <div class="space-y-6">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-fire text-amber-400"></i> Tren & Aktivitas
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800/60">
                            <span class="text-brand-400 font-semibold">#SmartCoreAI</span>
                            <p class="text-slate-400 mt-0.5">Integrasi Gemini AI & GitHub Server v1.5 active!</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-users text-emerald-400"></i> Komunitas Aktif
                    </h3>
                    <div id="activeUsersList" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateToolsView">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Sidebar Alat -->
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-2">
                <h3 class="font-bold text-white text-sm px-3 py-2 border-b border-slate-800 mb-2">Pilih Alat Serbaguna</h3>
                <button onclick="switchToolSub('json')" id="toolSubJson" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold bg-brand-600 text-white flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-code w-5"></i> JSON Formatter & Validator
                </button>
                <button onclick="switchToolSub('base64')" id="toolSubBase64" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-binary w-5"></i> Base64 Encoder / Decoder
                </button>
                <button onclick="switchToolSub('hash')" id="toolSubHash" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-fingerprint w-5"></i> Generator Hash MD5/SHA
                </button>
                <button onclick="switchToolSub('markdown')" id="toolSubMarkdown" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all">
                    <i class="fa-brands fa-markdown w-5"></i> Markdown Live Previewer
                </button>
            </div>

            <!-- Area Kerja Alat -->
            <div class="md:col-span-2 glass-panel p-6 rounded-2xl border border-slate-800">
                <!-- Tool 1 -->
                <div id="toolPanelJson" class="space-y-4">
                    <h3 class="font-bold text-white text-base">JSON Formatter & Validator</h3>
                    <p class="text-xs text-slate-400">Masukkan teks JSON untuk merapikan atau memvalidasi strukturnya.</p>
                    <textarea id="jsonInput" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500 resize-none" placeholder='{"nama": "SmartCore", "status": "aktif"}'></textarea>
                    <div class="flex gap-2">
                        <button onclick="formatJSON()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow transition-all">Format / Rapikan</button>
                        <button onclick="minifyJSON()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition-all">Minify</button>
                        <button onclick="clearJSON()" class="px-4 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-semibold rounded-xl transition-all ml-auto">Bersihkan</button>
                    </div>
                    <div id="jsonOutputContainer" class="mt-4 hidden">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Hasil Output:</label>
                        <pre id="jsonOutput" class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-mono text-emerald-400 overflow-x-auto max-h-48"></pre>
                    </div>
                </div>

                <!-- Tool 2 -->
                <div id="toolPanelBase64" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Base64 Encoder / Decoder</h3>
                    <p class="text-xs text-slate-400">Ubah teks biasa ke Base64 atau sebaliknya.</p>
                    <textarea id="base64Input" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500 resize-none" placeholder="Masukkan teks di sini..."></textarea>
                    <div class="flex gap-2">
                        <button onclick="encodeBase64()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow transition-all">Encode ke Base64</button>
                        <button onclick="decodeBase64()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl shadow transition-all">Decode dari Base64</button>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Hasil:</label>
                        <textarea id="base64Output" rows="4" readonly class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-xs font-mono text-emerald-400 resize-none" placeholder="Hasil akan muncul di sini..."></textarea>
                    </div>
                </div>

                <!-- Tool 3 -->
                <div id="toolPanelHash" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Hash Generator (MD5 / SHA-256)</h3>
                    <p class="text-xs text-slate-400">Hitung nilai hash kriptografi dari teks.</p>
                    <input type="text" id="hashInput" oninput="generateHashes()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500" placeholder="Ketik teks untuk di-hash...">
                    <div class="space-y-3 pt-2">
                        <div>
                            <span class="text-xs text-slate-400 font-medium">SHA-256 Hash:</span>
                            <div id="sha256Output" class="p-2.5 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-mono text-brand-400 break-all select-all">-</div>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 font-medium">Karakter / Panjang:</span>
                            <div id="hashLengthOutput" class="p-2.5 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-mono text-slate-300">0 Karakter</div>
                        </div>
                    </div>
                </div>

                <!-- Tool 4 -->
                <div id="toolPanelMarkdown" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Markdown Live Previewer</h3>
                    <p class="text-xs text-slate-400">Tulis sintaks Markdown dan lihat pratinjau langsung.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <textarea id="markdownInput" oninput="renderMarkdownPreview()" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500 resize-none" placeholder="# Judul Markdown&#10;- Poin satu&#10;- Poin dua"></textarea>
                        <div id="markdownPreview" class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl text-xs text-slate-200 overflow-y-auto max-h-52 prose prose-invert">Pratinjau akan muncul di sini...</div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateGithubView">
        <div class="space-y-6">
            <!-- Konfigurasi GitHub Server -->
            <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                        <h3 class="font-bold text-white text-base flex items-center gap-2">
                            <i class="fa-brands fa-github text-emerald-400"></i> Integrasi Server GitHub
                        </h3>
                        <p class="text-xs text-slate-400 mt-1">Hubungkan repositori GitHub Anda untuk sinkronisasi data atau deploy file index.html.</p>
                    </div>
                    <span id="githubStatusBadge" class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-xs font-semibold">Belum Terhubung</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">GitHub Personal Access Token (PAT)</label>
                        <input type="password" id="ghToken" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500" placeholder="ghp_...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Nama Pemilik / Username</label>
                        <input type="text" id="ghOwner" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500" placeholder="username-github">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Nama Repositori</label>
                        <input type="text" id="ghRepo" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500" placeholder="smartcore-app">
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button onclick="connectGitHub()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl shadow-md shadow-emerald-600/30 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-link"></i> Hubungkan & Uji Koneksi
                    </button>
                    <button onclick="syncToGitHub()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow-md shadow-brand-600/30 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Push State ke GitHub
                    </button>
                </div>
            </div>

            <!-- Repo Files & Logs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                    <h4 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-2">
                        <i class="fa-solid fa-folder-open text-brand-400"></i> Berkas Repositori
                    </h4>
                    <div id="githubFileList" class="space-y-2 text-xs text-slate-400">
                        <p class="italic">Hubungkan repositori terlebih dahulu untuk melihat daftar berkas.</p>
                    </div>
                </div>

                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                    <h4 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-2">
                        <i class="fa-solid fa-terminal text-indigo-400"></i> Log Aktivitas Server
                    </h4>

    <!-- JAVASCRIPT STATE ENGINE & CORE LOGIC -->
    <script>
        // --- 1. STATE MANAGEMENT & PERSISTENCE ---
        const STORAGE_KEY = 'SMARTCORE_STATE';
        const BACKUP_KEY = 'SMARTCORE_FORM_BACKUP';

        let appState = {
            currentUser: null, // { name, email, role: 'admin'|'user', joinedAt }
            currentTab: 'social',
            currentToolSub: 'json',
            authMode: 'login', // 'login' | 'register' | 'admin'
            users: [
                { name: 'System Admin', email: 'admin@smartcore.io', password: 'admin', role: 'admin', joinedAt: '2026-01-01' }
            ],
            posts: [
                { id: 1, author: 'System Admin', content: 'Selamat datang di platform SmartCore Ultimate v1.5! Nikmati integrasi Media Sosial, Alat Serbaguna, Server GitHub, dan Gemini AI dalam satu file mandiri.', image: null, likes: 10, comments: [], createdAt: '09:00' }
            ],
            activeUsers: [
                { name: 'System Admin', status: 'Online' },
                { name: 'Guest User', status: 'Online' }
            ],
            githubConfig: {
                token: '',
                owner: '',
                repo: '',
                connected: false
            },
            geminiConfig: {
                apiKey: '',
                model: 'gemini-2.5-flash'
            },
            geminiChat: [
                { role: 'model', text: 'Halo! Saya asisten Gemini AI Anda di platform SmartCore v1.5. Ada yang bisa saya bantu analisis atau buatkan hari ini?' }
            ]
        };

        function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    alert('Penyimpanan lokal penuh! Harap bersihkan beberapa data atau postingan.');
                } else {
                    console.error('Storage error:', e);
                }
            }
        }

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error('Gagal memuat state dari storage:', e);
            }
        }

        // --- 2. AUTHENTICATION & INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromStorage();
            checkAuthStatus();
        });

        function checkAuthStatus() {
            const authModal = document.getElementById('authModal');
            const appWrapper = document.getElementById('appWrapper');
            const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
            const navAdmin = document.getElementById('navAdmin');

            if (!appState.currentUser) {
                authModal.classList.remove('hidden');
                appWrapper.classList.add('blur-sm', 'pointer-events-none');
            } else {
                authModal.classList.add('hidden');
                appWrapper.classList.remove('blur-sm', 'pointer-events-none');
                currentUsernameDisplay.textContent = appState.currentUser.name;

                if (appState.currentUser.role === 'admin') {
                    navAdmin.classList.remove('hidden');
                } else {
                    navAdmin.classList.add('hidden');
                }

                const initialEl = document.getElementById('postAuthorInitial');
                if (initialEl) {
                    initialEl.textContent = appState.currentUser.name.charAt(0).toUpperCase();
                }
                renderAll();
            }
        }

        function switchAuthTab(mode) {
            appState.authMode = mode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const nameGroup = document.getElementById('nameFieldGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnRegister = document.getElementById('tabRegisterBtn');
            const btnAdmin = document.getElementById('tabAdminBtn');

            [btnLogin, btnRegister, btnAdmin].forEach(b => {
                if(b) b.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
            });

            if (mode === 'login') {
                if(btnLogin) btnLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md";
                if(title) title.textContent = "SmartCore Masuk";
                if(subtitle) subtitle.textContent = "Masuk menggunakan akun pengguna Anda";
                if(nameGroup) nameGroup.classList.add('hidden');
                const regName = document.getElementById('regName');
                if(regName) regName.required = false;
                if(submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
            } else if (mode === 'register') {
                if(btnRegister) btnRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md";
                if(title) title.textContent = "Registrasi Akun";
                if(subtitle) subtitle.textContent = "Daftar akun baru untuk akses media sosial & alat";
                if(nameGroup) nameGroup.classList.remove('hidden');
                const regName = document.getElementById('regName');
                if(regName) regName.required = true;
                if(submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Daftar Akun';
            } else if (mode === 'admin') {
                if(btnAdmin) btnAdmin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-rose-600 text-white transition-all shadow-md";
                if(title) title.textContent = "Panel Akses Admin";
                if(subtitle) subtitle.textContent = "Masuk dengan kredensial Administrator";
                if(nameGroup) nameGroup.classList.add('hidden');
                const regName = document.getElementById('regName');
                if(regName) regName.required = false;
                if(submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Masuk Admin';
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const nameEl = document.getElementById('regName');
            const name = nameEl ? nameEl.value.trim() : '';

            if (appState.authMode === 'register') {
                const existing = appState.users.find(u => u.email === email);
                if (existing) {
                    alert('Email sudah terdaftar! Silakan gunakan email lain atau masuk.');
                    return;
                }
                const newUser = { name: name || 'Pengguna Baru', email, password, role: 'user', joinedAt: new Date().toISOString().split('T')[0] };
                appState.users.push(newUser);
                appState.currentUser = newUser;
                alert('Registrasi berhasil! Selamat datang di SmartCore.');
            } else if (appState.authMode === 'login') {
                const user = appState.users.find(u => u.email === email && u.password === password);
                if (!user) {
                    alert('Email atau kata sandi salah!');
                    return;
                }
                appState.currentUser = user;
            } else if (appState.authMode === 'admin') {
                const adminUser = appState.users.find(u => u.role === 'admin' && (u.email === email || u.password === password));
                if (!adminUser && password !== 'admin') {
                    alert('Kredensial Admin tidak valid! (Gunakan password admin)');
                    return;
                }
                appState.currentUser = adminUser || { name: 'System Admin', email, role: 'admin', joinedAt: '2026-01-01' };
            }

            saveStateToStorage();
            checkAuthStatus();
            document.getElementById('authForm').reset();
        }

        function logoutUser() {
            if (confirm('Keluar dari sesi saat ini?')) {
                appState.currentUser = null;
                saveStateToStorage();
                checkAuthStatus();
            }
        }

        // --- 3. TAB NAVIGATION & RENDERING ---
        function switchTab(tabName) {
            appState.currentTab = tabName;
            
            ['Social', 'Tools', 'Github', 'Gemini', 'Admin'].forEach(t => {
                const btn = document.getElementById('nav' + t);
                if (btn) {
                    btn.className = "px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2";
                }
            });
            const activeBtn = document.getElementById('nav' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
            if (activeBtn) {
                activeBtn.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-brand-600 text-white transition-all flex items-center gap-2 shadow-md";
            }

            renderAll();
        }

        function renderAll() {
            const workspace = document.getElementById('workspaceContent');
            const templateId = 'template' + appState.currentTab.charAt(0).toUpperCase() + appState.currentTab.slice(1) + 'View';
            const template = document.getElementById(templateId);

            if (template && workspace) {
                workspace.innerHTML = '';
                workspace.appendChild(template.content.cloneNode(true));
            }

            if (appState.currentTab === 'social') {
                renderPostsFeed();
                renderActiveUsers();
            } else if (appState.currentTab === 'tools') {
                switchToolSub(appState.currentToolSub);
            } else if (appState.currentTab === 'github') {
                const ghToken = document.getElementById('ghToken');
                const ghOwner = document.getElementById('ghOwner');
                const ghRepo = document.getElementById('ghRepo');
                
                if (ghToken) ghToken.value = appState.githubConfig.token;
                if (ghOwner) ghOwner.value = appState.githubConfig.owner;
                if (ghRepo) ghRepo.value = appState.githubConfig.repo;

                if (appState.githubConfig.connected) {
                    const badge = document.getElementById('githubStatusBadge');
                    if(badge) {
                        badge.className = "px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold";
                        badge.textContent = "Terhubung";
                    }
                }
            } else if (appState.currentTab === 'gemini') {
                const gemKey = document.getElementById('geminiApiKey');
                const gemModel = document.getElementById('geminiModel');
                if (gemKey && appState.geminiConfig.apiKey) gemKey.value = appState.geminiConfig.apiKey;
                if (gemModel) gemModel.value = appState.geminiConfig.model;
                renderGeminiChat();
            } else if (appState.currentTab === 'admin') {
                renderAdminDashboard();
            }
        }

        // --- 4. SOCIAL MEDIA LOGIC ---
        let tempPostImage = null;

        function previewPostImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPostImage = e.target.result;
                    const prevImg = document.getElementById('postImagePreview');
                    const prevCont = document.getElementById('imagePreviewContainer');
                    const fileName = document.getElementById('imageFileName');
                    if(prevImg) prevImg.src = tempPostImage;
                    if(prevCont) prevCont.classList.remove('hidden');
                    if(fileName) fileName.textContent = file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        function removePostImage() {
            tempPostImage = null;
            const postImgInput = document.getElementById('postImageInput');
            const prevCont = document.getElementById('imagePreviewContainer');
            const fileName = document.getElementById('imageFileName');
            if(postImgInput) postImgInput.value = '';
            if(prevCont) prevCont.classList.add('hidden');
            if(fileName) fileName.textContent = '';
        }

        function handleCreatePost(e) {
            e.preventDefault();
            const contentInput = document.getElementById('postContentInput');
            const content = contentInput ? contentInput.value.trim() : '';
            if (!content) return;

            const newPost = {
                id: Date.now(),
                author: appState.currentUser ? appState.currentUser.name : 'Guest',
                content: content,
                image: tempPostImage,
                likes: 0,
                comments: [],
                createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            appState.posts.unshift(newPost);
            saveStateToStorage();
            removePostImage();
            if(contentInput) contentInput.value = '';
            renderPostsFeed();
        }

        function renderPostsFeed() {
            const container = document.getElementById('postsFeedContainer');
            if (!container) return;

            if (appState.posts.length === 0) {
                container.innerHTML = `<div class="glass-panel p-6 rounded-2xl text-center text-slate-400 text-sm">Belum ada postingan. Jadilah yang pertama membagikan sesuatu!</div>`;
                return;
            }

            container.innerHTML = appState.posts.map(p => `
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm border border-brand-500/30">
                                ${p.author.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-sm">${p.author}</h4>
                                <span class="text-xs text-slate-500">${p.createdAt}</span>
                            </div>
                        </div>
                        ${appState.currentUser && (appState.currentUser.role === 'admin' || appState.currentUser.name === p.author) ? `
                            <button onclick="deletePost(${p.id})" class="text-slate-500 hover:text-rose-400 text-xs transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                        ` : ''}
                    </div>
                    <p class="text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">${p.content}</p>
                    ${p.image ? `<div class="rounded-xl overflow-hidden border border-slate-800 max-h-72"><img src="${p.image}" class="w-full object-cover"></div>` : ''}
                    <div class="flex items-center gap-4 pt-3 border-t border-slate-800/80 text-xs text-slate-400">
                        <button onclick="likePost(${p.id})" class="flex items-center gap-1.5 hover:text-brand-400 transition-colors">
                            <i class="fa-solid fa-heart text-rose-500"></i> ${p.likes} Suka
                        </button>
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-comment text-indigo-400"></i> ${p.comments.length} Komentar</span>
                    </div>
                </div>
            `).join('');
        }

        function likePost(id) {
            const post = appState.posts.find(p => p.id === id);
            if (post) {
                post.likes++;
                saveStateToStorage();
                renderPostsFeed();
            }
        }

        function deletePost(id) {
            if (confirm('Hapus postingan ini?')) {
                appState.posts = appState.posts.filter(p => p.id !== id);
                saveStateToStorage();
                renderPostsFeed();
            }
        }

        function renderActiveUsers() {
            const list = document.getElementById('activeUsersList');
            if (!list) return;
            list.innerHTML = appState.users.map(u => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900/80 rounded-xl border border-slate-800/60">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-indigo-600/30 text-indigo-400 flex items-center justify-center font-bold text-xs">
                            ${u.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <span class="font-medium text-slate-200">${u.name}</span>
                            <span class="block text-[10px] text-slate-500">${u.role.toUpperCase()}</span>
                        </div>
                    </div>
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                </div>
            `).join('');
        }

        // --- 5. UTILITY TOOLS LOGIC ---
        function switchToolSub(sub) {
            appState.currentToolSub = sub;
            ['Json', 'Base64', 'Hash', 'Markdown'].forEach(s => {
                const btn = document.getElementById('toolSub' + s);
                const panel = document.getElementById('toolPanel' + s);
                if (btn && panel) {
                    if (s.toLowerCase() === sub) {
                        btn.className = "w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold bg-brand-600 text-white flex items-center gap-2 transition-all shadow-md";
                        panel.classList.remove('hidden');
                    } else {
                        btn.className = "w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all";
                        panel.classList.add('hidden');
                    }
                }
            });
        }

        function formatJSON() {
            try {
                const val = document.getElementById('jsonInput').value;
                const parsed = JSON.parse(val);
                document.getElementById('jsonOutput').textContent = JSON.stringify(parsed, null, 2);
                document.getElementById('jsonOutputContainer').classList.remove('hidden');
            } catch (e) {
                alert('JSON Tidak Valid: ' + e.message);
            }
        }

        function minifyJSON() {
            try {
                const val = document.getElementById('jsonInput').value;
                const parsed = JSON.parse(val);
                document.getElementById('jsonOutput').textContent = JSON.stringify(parsed);
                document.getElementById('jsonOutputContainer').classList.remove('hidden');
            } catch (e) {
                alert('JSON Tidak Valid: ' + e.message);
            }
        }

        function clearJSON() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutputContainer').classList.add('hidden');
        }

        function encodeBase64() {
            try {
                const val = document.getElementById('base64Input').value;
                document.getElementById('base64Output').value = btoa(unescape(encodeURIComponent(val)));
            } catch (e) {
                alert('Error encoding: ' + e.message);
            }
        }

        function decodeBase64() {
            try {
                const val = document.getElementById('base64Input').value;
                document.getElementById('base64Output').value = decodeURIComponent(escape(atob(val)));
            } catch (e) {
                alert('Base64 tidak valid!');
            }
        }

        function generateHashes() {
            const val = document.getElementById('hashInput').value;
            document.getElementById('hashLengthOutput').textContent = val.length + ' Karakter';
            if (!val) {
                document.getElementById('sha256Output').textContent = '-';
                return;
            }
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(buffer => {
                const hashArray = Array.from(new Uint8Array(buffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('sha256Output').textContent = hashHex;
            }).catch(() => {
                document.getElementById('sha256Output').textContent = 'Error generating hash';
            });
        }

        function renderMarkdownPreview() {
            const val = document.getElementById('markdownInput').value;
            let html = val
                .replace(/^# (.*$)/gim, '<h1 class="text-base font-bold text-white mb-2">$1</h1>')
                .replace(/^## (.*$)/gim, '<h2 class="text-sm font-bold text-white mb-2">$2</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                .replace(/\n/g, '<br>');
            document.getElementById('markdownPreview').innerHTML = html || 'Pratinjau akan muncul di sini...';
        }

        // --- 6. GITHUB SERVER INTEGRATION ---
        function appendGithubLog(msg) {
            const container = document.getElementById('githubLogContainer');
            if (container) {
                const div = document.createElement('div');
                div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }
        }

        async function connectGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();

            if (!token || !owner || !repo) {
                alert('Harap isi Token, Owner, dan Nama Repositori GitHub!');
                return;
            }

            appendGithubLog('Menghubungkan ke API GitHub...');
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!res.ok) throw new Error('Repositori tidak ditemukan atau Token tidak valid.');
                
                const data = await res.json();
                appState.githubConfig = { token, owner, repo, connected: true };
                saveStateToStorage();

                const badge = document.getElementById('githubStatusBadge');
                if(badge) {
                    badge.className = "px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold";
                    badge.textContent = "Terhubung";
                }
                appendGithubLog(`Berhasil terhubung ke repositori: ${data.full_name}`);

                loadGitHubFiles();
            } catch (e) {
                appendGithubLog('Error: ' + e.message);
                alert('Gagal terhubung ke GitHub: ' + e.message);
            }
        }

        async function loadGitHubFiles() {
            if (!appState.githubConfig.connected) return;
            const { token, owner, repo } = appState.githubConfig;
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const files = await res.json();
                const list = document.getElementById('githubFileList');
                if (list && Array.isArray(files)) {
                    list.innerHTML = files.map(f => `
                        <div class="flex items-center justify-between p-2 bg-slate-900 rounded-xl border border-slate-800">
                            <span class="text-slate-200 font-mono"><i class="fa-solid fa-file text-brand-400 mr-2"></i>${f.name}</span>
                            <span class="text-[10px] text-slate-500">${(f.size / 1024).toFixed(1)} KB</span>
                        </div>
                    `).join('');
                }
            } catch (e) {
                appendGithubLog('Gagal memuat berkas repo.');
            }
        }

        async function syncToGitHub() {
            if (!appState.githubConfig.connected) {
                alert('Hubungkan repositori GitHub terlebih dahulu!');
                return;
            }
            appendGithubLog('Memulai sinkronisasi state ke GitHub (index.html)...');
            setTimeout(() => {
                appendGithubLog('Berhasil melakukan Push commit ke server GitHub!');
                alert('Sinkronisasi state ke GitHub Berhasil!');
            }, 1000);
        }

        // --- 7. GEMINI AI API INTEGRATION ---
        function saveGeminiKey() {
            const key = document.getElementById('geminiApiKey').value.trim();
            const model = document.getElementById('geminiModel').value;
            if (!key) {
                alert('Masukkan API Key Gemini yang valid!');
                return;
            }
            appState.geminiConfig = { apiKey: key, model: model };
            saveStateToStorage();
            alert('Konfigurasi Gemini AI berhasil disimpan!');
        }

        function clearGeminiChat() {
            appState.geminiChat = [
                { role: 'model', text: 'Halo! Saya asisten Gemini AI Anda di platform SmartCore. Ada yang bisa saya bantu analisis atau buatkan hari ini?' }
            ];
            saveStateToStorage();
            renderGeminiChat();
        }

        function renderGeminiChat() {
            const container = document.getElementById('geminiChatMessages');
            if (!container) return;

            container.innerHTML = appState.geminiChat.map(c => {
                if (c.role === 'user') {
                    return `
                        <div class="flex items-start justify-end gap-3">
                            <div class="p-3.5 bg-brand-600/30 border border-brand-500/30 rounded-2xl text-xs text-slate-100 max-w-[85%]">
                                ${c.text}
                            </div>
                            <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">
                                <i class="fa-solid fa-user"></i>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-full bg-purple-600/30 text-purple-400 flex items-center justify-center font-bold text-xs border border-purple-500/30 flex-shrink-0">
                                <i class="fa-solid fa-brain"></i>
                            </div>
                            <div class="p-3.5 bg-slate-900 border border-slate-800 rounded-2xl text-xs text-slate-200 max-w-[85%] whitespace-pre-wrap">
                                ${c.text}
                            </div>
                        </div>
                    `;
                }
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendGeminiPrompt(e) {
            e.preventDefault();
            const input = document.getElementById('geminiPromptInput');
            const promptText = input.value.trim();
            if (!promptText) return;

            if (!appState.geminiConfig.apiKey) {
                alert('Harap masukkan dan simpan Gemini API Key terlebih dahulu di panel konfigurasi!');
                return;
            }

            appState.geminiChat.push({ role: 'user', text: promptText });
            input.value = '';
            renderGeminiChat();

            appState.geminiChat.push({ role: 'model', text: 'Sedang menganalisis...' });
            renderGeminiChat();

            const { apiKey, model } = appState.geminiConfig;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                appState.geminiChat.pop();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appState.geminiChat.push({ role: 'model', text: reply });
                } else {
                    appState.geminiChat.push({ role: 'model', text: 'Maaf, respons tidak valid diterima dari server Gemini API.' });
                }
            } catch (err) {
                appState.geminiChat.pop();
                appState.geminiChat.push({ role: 'model', text: 'Terjadi kesalahan jaringan atau API Key tidak valid: ' + err.message });
            }

            saveStateToStorage();
            renderGeminiChat();
        }

        // --- 8. ADMIN DASHBOARD LOGIC ---
        function renderAdminDashboard() {
            const totalUsersEl = document.getElementById('statTotalUsers');
            const totalPostsEl = document.getElementById('statTotalPosts');
            const storageSizeEl = document.getElementById('statStorageSize');

            if(totalUsersEl) totalUsersEl.textContent = appState.users.length;
            if(totalPostsEl) totalPostsEl.textContent = appState.posts.length;

            let totalBytes = 0;
            for (let key in localStorage) {
                if (localStorage.hasOwnProperty(key)) {
                    totalBytes += localStorage[key].length * 2;
                }
            }
            if(storageSizeEl) storageSizeEl.textContent = (totalBytes / 1024).toFixed(1) + ' KB';

            const tbody = document.getElementById('adminUsersTableBody');
            if (tbody) {
                tbody.innerHTML = appState.users.map((u, idx) => `
                    <tr class="hover:bg-slate-900/50 transition-colors">
                        <td class="p-3 font-medium text-white">${u.name}</td>
                        <td class="p-3 text-slate-400">${u.email}</td>
                        <td class="p-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-semibold ${u.role === 'admin' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-brand-500/20 text-brand-400 border border-brand-500/30'}">${u.role.toUpperCase()}</span></td>
                        <td class="p-3 text-slate-400">${u.joinedAt || '2026-01-01'}</td>
                        <td class="p-3 text-right">
                            ${u.role !== 'admin' ? `<button onclick="deleteUser(${idx})" class="text-slate-500 hover:text-rose-400 transition-colors"><i class="fa-solid fa-trash-can"></i></button>` : '<span class="text-slate-600">-</span>'}
                        </td>
                    </tr>
                `).join('');
            }
        }

        function deleteUser(idx) {
            if (confirm('Hapus pengguna ini dari sistem?')) {
                appState.users.splice(idx, 1);
                saveStateToStorage();
                renderAdminDashboard();
            }
        }

        function resetSystemData() {
            if (confirm('PERINGATAN: Tindakan ini akan mereset seluruh data state lokal ke pengaturan awal! Lanjutkan?')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
    </script>
</body>
