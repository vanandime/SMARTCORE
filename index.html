<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Ultimate - Enterprise Ultra v6.5 Master</title>
    <!-- Favicon SVG Profesional -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.91 12.21 22 12 22C11.79 22 11.59 21.91 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.09 11.79 2 12 2C12.21 2 12.41 2.09 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z'/></svg>">
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: 'var(--brand-50, #eef2ff)',
                            500: 'var(--brand-500, #6366f1)',
                            600: 'var(--brand-600, #4f46e5)',
                            700: 'var(--brand-700, #4338ca)',
                            900: 'var(--brand-900, #312e81)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root { --brand-500: #6366f1; --brand-600: #4f46e5; --brand-700: #4338ca; }
        body[data-accent="emerald"] { --brand-500: #10b981; --brand-600: #059669; --brand-700: #047857; }
        body[data-accent="purple"] { --brand-500: #a855f7; --brand-600: #9333ea; --brand-700: #7e22ce; }
        body[data-accent="amber"] { --brand-500: #f59e0b; --brand-600: #d97706; --brand-700: #b45309; }

        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #060913; }
        ::-webkit-scrollbar-thumb { background: var(--brand-600); border-radius: 9999px; }
        
        .glass-panel { background: rgba(13, 18, 30, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(99, 102, 241, 0.18); }
        .glass-dock { background: rgba(9, 13, 22, 0.96); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.25); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .admin-only { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .seamless-transition { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-animate { animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.06); } }
        .sync-pulse { animation: pulseGlow 2s infinite; }
    </style>
</head>
<body id="appBody" data-accent="indigo" class="bg-[#060913] text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <!-- AUTH MODAL (TERPADU: MASUK, REGISTRASI, & ADMIN) -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden">
        <div class="glass-panel w-full max-w-sm p-7 rounded-3xl shadow-2xl border border-brand-500/30">
            <div class="text-center mb-5">
                <div class="inline-flex p-3 bg-gradient-to-tr from-brand-600 to-indigo-500 text-white rounded-2xl mb-2 text-xl shadow-lg">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2 id="authTitle" class="text-xl font-bold text-white">SmartCore v6.5</h2>
                <p id="authSubtitle" class="text-xs text-slate-400 mt-0.5">Sistem Autentikasi Terpadu</p>
            </div>
            
            <div class="flex bg-slate-900 p-1 rounded-xl mb-5 border border-slate-800 text-xs font-semibold">
                <button type="button" onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2 rounded-lg bg-brand-600 text-white transition-all">Masuk</button>
                <button type="button" onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all">Daftar</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3.5 text-xs">
                <div id="nameFieldGroup" class="hidden">
                    <label class="block text-slate-300 mb-1 font-medium">Nama Lengkap</label>
                    <input type="text" id="regName" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:ring-1 focus:ring-brand-500" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Email / Nama Akun</label>
                    <input type="text" id="authEmail" required class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:ring-1 focus:ring-brand-500" placeholder="user@smartcore.io atau admin">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-medium">Kata Sandi</label>
                    <input type="password" id="authPassword" required class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:ring-1 focus:ring-brand-500" placeholder="••••••••">
                </div>
                <div id="authStatusMsg" class="text-[11px] text-center font-medium pt-1"></div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow transition-all mt-2">Masuk Sistem</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" class="flex-1 flex flex-col min-h-screen pb-20">
        <!-- HEADER -->
        <header class="glass-panel border-b border-slate-800/80 sticky top-0 z-40 px-4 sm:px-6 py-2.5 flex items-center justify-between gap-3 shadow-md">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-sm shadow flex-shrink-0">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white text-xs sm:text-sm flex items-center gap-1.5">
                        SmartCore <span class="text-brand-500 text-[9px] px-2 py-0.5 bg-brand-500/15 rounded-full border border-brand-500/25">v6.5 Master</span>
                    </h1>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 w-52 text-xs">
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                <input type="text" id="quickCommandInput" oninput="handleQuickSearch(event)" class="bg-transparent border-none text-white placeholder-slate-500 focus:outline-none w-full" placeholder="Cari menu...">
            </div>

            <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 px-2.5 py-1 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                    <div id="headerUserAvatar" class="w-5 h-5 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-[9px] overflow-hidden">U</div>
                    <span id="currentUsernameDisplay" class="font-medium text-slate-200 truncate max-w-[80px]">Guest</span>
                </div>
                <button type="button" onclick="logoutUser()" title="Keluar" class="p-2 bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-xl border border-slate-800 transition-all text-xs">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- WORKSPACE -->
        <main class="flex-1 p-3 sm:p-6 max-w-7xl mx-auto w-full">
            <div id="workspaceContent" class="space-y-5 seamless-transition"></div>
        </main>

        <!-- DOCK NAVIGATION -->
        <div class="fixed bottom-2.5 inset-x-0 z-40 flex justify-center px-3 pointer-events-none">
            <nav class="glass-dock px-2 py-1.5 rounded-2xl flex items-center gap-1 pointer-events-auto border border-brand-500/25 shadow-xl overflow-x-auto max-w-full text-xs">
                <button onclick="switchTab('overview')" id="navOverview" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-chart-pie text-brand-500"></i><span class="hidden xl:inline">Overview</span></button>
                <button onclick="switchTab('social')" id="navSocial" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-globe text-indigo-400"></i><span class="hidden xl:inline">Sosial</span></button>
                <button onclick="switchTab('finance')" id="navFinance" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-wallet text-emerald-400"></i><span class="hidden xl:inline">Keuangan</span></button>
                <button onclick="switchTab('time')" id="navTime" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-clock text-amber-400"></i><span class="hidden xl:inline">Waktu</span></button>
                <button onclick="switchTab('notes')" id="navNotes" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-note-sticky text-yellow-400"></i><span class="hidden xl:inline">Catatan</span></button>
                <button onclick="switchTab('tools')" id="navTools" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-toolbox text-cyan-400"></i><span class="hidden xl:inline">Tools</span></button>
                <button onclick="switchTab('profile')" id="navProfile" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-user-gear text-pink-400"></i><span class="hidden xl:inline">Profil</span></button>
                <button onclick="switchTab('admin')" id="navAdmin" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-rose-600/30 flex items-center gap-1.5 transition-all admin-only"><i class="fa-solid fa-shield-halved text-rose-400"></i><span class="hidden xl:inline">Admin</span></button>
            </nav>
        </div>
    </div>

    <!-- TEMPLATES -->
    <template id="templateOverviewView">
        <div class="space-y-5">
            <div class="glass-panel p-6 rounded-3xl border border-slate-800 shadow-xl bg-gradient-to-r from-brand-900/20 via-slate-900/60 to-indigo-950/30 space-y-2">
                <span class="px-2.5 py-0.5 rounded-full bg-brand-500/15 text-brand-500 text-[10px] font-semibold border border-brand-500/25">Dashboard v6.5 Master</span>
                <h2 id="overviewWelcomeTitle" class="text-2xl font-bold text-white">Selamat Datang Kembali!</h2>
                <p class="text-xs text-slate-300">Sistem terpusat dengan fitur catatan, edit tugas/keuangan, dan Gist auto-sync.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-brand-600/20 text-brand-500 flex items-center justify-center text-lg border border-brand-500/25"><i class="fa-solid fa-wallet"></i></div>
                    <div><p class="text-[11px] text-slate-400">Saldo Keuangan</p><h4 id="overviewBalance" class="text-base font-bold text-white">Rp 0</h4></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-cyan-600/20 text-cyan-400 flex items-center justify-center text-lg border border-cyan-500/25"><i class="fa-solid fa-list-check"></i></div>
                    <div><p class="text-[11px] text-slate-400">Agenda Aktif</p><h4 id="overviewTaskCount" class="text-base font-bold text-white">0 Tugas</h4></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-yellow-600/20 text-yellow-400 flex items-center justify-center text-lg border border-yellow-500/25"><i class="fa-solid fa-note-sticky"></i></div>
                    <div><p class="text-[11px] text-slate-400">Total Catatan</p><h4 id="overviewNoteCount" class="text-base font-bold text-white">0 Catatan</h4></div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateSocialView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div class="lg:col-span-2 space-y-4">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800">
                    <form onsubmit="handleCreatePost(event)" class="space-y-3">
                        <div class="flex items-start gap-3">
                            <div id="postAuthorAvatarContainer" class="w-9 h-9 rounded-xl bg-brand-600/30 text-brand-500 flex items-center justify-center font-bold text-xs border border-brand-500/25 overflow-hidden">U</div>
                            <textarea id="postContentInput" rows="2" required class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-3 text-xs text-white focus:ring-1 focus:ring-brand-500 resize-none" placeholder="Bagikan momen..."></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-xs">
                            <label class="cursor-pointer hover:text-brand-500 transition-colors flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 rounded-lg border border-slate-800">
                                <i class="fa-solid fa-image text-brand-500"></i> Gambar
                                <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">
                            </label>
                            <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow"><i class="fa-solid fa-paper-plane mr-1.5"></i> Publikasikan</button>
                        </div>
                        <div id="imagePreviewContainer" class="hidden relative mt-2 rounded-xl overflow-hidden max-h-44 border border-slate-800">
                            <img id="postImagePreview" src="" class="w-full object-cover">
                            <button type="button" onclick="removePostImage()" class="absolute top-2 right-2 p-1.5 bg-slate-900 hover:bg-rose-500 text-white rounded-lg text-xs"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </form>
                </div>
                <div id="postsFeedContainer" class="space-y-3"></div>
            </div>
            <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3 h-fit">
                <h3 class="font-bold text-white text-xs border-b border-slate-800 pb-2 flex items-center gap-2"><i class="fa-solid fa-users text-emerald-400"></i> Pengguna Online</h3>
                <div id="activeUsersList" class="space-y-2 max-h-52 overflow-y-auto pr-1 text-xs"></div>
            </div>
        </div>
    </template>

    <!-- KEUANGAN (DENGAN MARKET & KRIPTO PINDAHAN) -->
    <template id="templateFinanceView">
        <div class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div><p class="text-slate-400">Saldo Bersih</p><h4 id="finTotalBalance" class="text-xl font-bold text-white mt-0.5">Rp 0</h4></div>
                    <div class="w-10 h-10 rounded-xl bg-brand-600/20 text-brand-500 flex items-center justify-center text-lg border border-brand-500/25"><i class="fa-solid fa-wallet"></i></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div><p class="text-slate-400">Pemasukan</p><h4 id="finTotalIncome" class="text-xl font-bold text-emerald-400 mt-0.5">Rp 0</h4></div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-lg border border-emerald-500/25"><i class="fa-solid fa-arrow-trend-up"></i></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div><p class="text-slate-400">Pengeluaran</p><h4 id="finTotalExpense" class="text-xl font-bold text-rose-400 mt-0.5">Rp 0</h4></div>
                    <div class="w-10 h-10 rounded-xl bg-rose-600/20 text-rose-400 flex items-center justify-center text-lg border border-rose-500/25"><i class="fa-solid fa-arrow-trend-down"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 text-xs">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3 h-fit">
                    <h3 id="financeFormTitle" class="font-bold text-white text-xs border-b border-slate-800 pb-2 flex items-center gap-1.5"><i class="fa-solid fa-plus-circle text-brand-500"></i> Tambah / Edit Transaksi</h3>
                    <form onsubmit="handleFinanceSubmit(event)" class="space-y-3">
                        <input type="hidden" id="editFinanceId" value="">
                        <div><label class="block text-slate-300 mb-1">Keterangan</label><input type="text" id="finDesc" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" placeholder="Gaji / Belanja"></div>
                        <div><label class="block text-slate-300 mb-1">Nominal (Rp)</label><input type="number" id="finAmount" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" placeholder="100000"></div>
                        <div><label class="block text-slate-300 mb-1">Tipe</label><select id="finType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></div>
                        <div class="flex gap-2">
                            <button type="submit" id="financeSubmitBtn" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow">Simpan</button>
                            <button type="button" onclick="cancelEditFinance()" id="financeCancelBtn" class="hidden px-3 py-2.5 bg-slate-800 text-slate-300 rounded-xl">Batal</button>
                        </div>
                    </form>
                </div>

                <div class="lg:col-span-2 space-y-5">
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                        <h3 class="font-bold text-white text-xs border-b border-slate-800 pb-2 flex items-center gap-1.5"><i class="fa-solid fa-list-ul text-indigo-400"></i> Riwayat Keuangan</h3>
                        <div class="overflow-x-auto max-h-60 overflow-y-auto pr-1">
                            <table class="w-full text-left text-slate-300">
                                <thead class="bg-slate-900 uppercase text-slate-400 sticky top-0 border-b border-slate-800 font-semibold text-[10px]">
                                    <tr><th class="p-2.5">Tanggal</th><th class="p-2.5">Keterangan</th><th class="p-2.5">Tipe</th><th class="p-2.5 text-right">Nominal</th><th class="p-2.5 text-center">Aksi</th></tr>
                                </thead>
                                <tbody id="financeTableBody" class="divide-y divide-slate-800/60"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Market & Kripto Pindahan ke Keuangan -->
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                        <h3 class="font-bold text-white text-xs border-b border-slate-800 pb-2 flex items-center gap-1.5"><i class="fa-solid fa-chart-line text-emerald-400"></i> Pasar & Kripto (Financial Feeds)</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-800"><span class="font-semibold text-white">BTC / USD</span><span class="text-emerald-400 font-mono font-bold">+3.45% ($68,450)</span></div>
                            <div class="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-800"><span class="font-semibold text-white">ETH / USD</span><span class="text-emerald-400 font-mono font-bold">+2.12% ($3,520)</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- WAKTU (DENGAN CUACA, JAM, & KALENDER PINDAHAN) -->
    <template id="templateTimeView">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 text-xs">
            <div class="space-y-5">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 text-center space-y-4 flex flex-col justify-center items-center">
                    <h3 class="font-bold text-white text-sm flex items-center gap-1.5"><i class="fa-solid fa-stopwatch text-amber-400"></i> Pomodoro Timer</h3>
                    <div class="p-5 bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs"><div id="pomodoroDisplay" class="text-4xl font-mono font-bold text-amber-400">25:00</div></div>
                    <div class="flex gap-2 w-full max-w-xs">
                        <button onclick="startPomodoro()" class="flex-1 py-2 bg-emerald-600 text-white rounded-xl">Mulai</button>
                        <button onclick="pausePomodoro()" class="flex-1 py-2 bg-amber-600 text-white rounded-xl">Jeda</button>
                        <button onclick="resetPomodoro()" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl">Reset</button>
                    </div>
                </div>

                <!-- Cuaca Pindahan ke Waktu -->
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                    <h3 class="font-bold text-white text-xs border-b border-slate-800 pb-2 flex items-center gap-1.5"><i class="fa-solid fa-cloud-sun text-cyan-400"></i> Cuaca & Lokasi</h3>
                    <div class="space-y-2 bg-slate-900 p-4 rounded-xl border border-slate-800 text-slate-300">
                        <p class="font-bold text-white text-sm">Denpasar / Perangkat</p>
                        <p class="text-2xl font-bold text-cyan-400 font-mono">31°C <span class="text-xs text-slate-400 font-normal">Cerah Berawan</span></p>
                    </div>
                    <button onclick="requestDevicePermissions()" class="w-full py-2.5 bg-brand-600 text-white rounded-xl font-semibold shadow">Izinkan Lokasi</button>
                </div>
            </div>

            <div class="space-y-5 flex flex-col">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3 flex-1 flex flex-col">

    <!-- MASTER LOGIC -->
    <script>
        const STORAGE_KEY = 'SMARTCORE_STATE_ULTRA_V65';

        let appState = {
            currentUser: null,
            currentTab: 'overview',
            currentToolSub: 'json',
            authMode: 'login',
            users: [
                { name: 'Ultra Admin', email: 'admin@smartcore.io', password: 'admin', role: 'admin', joinedAt: '2026-01-01', avatar: '' },
                { name: 'Danis User', email: 'danis@smartcore.io', password: 'user', role: 'user', joinedAt: '2026-08-13', avatar: '' }
            ],
            posts: [{ id: 1, author: 'Ultra Admin', content: 'SmartCore v6.5 Master aktif sempurna dengan catatan & edit data!', image: null, likes: 15, createdAt: 'Baru saja' }],
            financeTransactions: [{ id: 1, date: '2026-08-01', desc: 'Dana Hibah', amount: 15000000, type: 'income' }],
            tasks: [{ id: 1, text: 'Verifikasi Gist Server & Fitur Edit', completed: true }],
            notes: [{ id: 1, title: 'Catatan Utama', content: 'Sistem SmartCore v6.5 berhasil diperbarui sesuai instruksi.', date: '2026-08-14' }],
            userPreferences: { accentColor: 'indigo', soundEnabled: 'enabled' },
            githubConfig: { token: '', gistId: '', connected: true }
        };

        function encryptData(t) { try { return t ? btoa(encodeURIComponent(t)) : ''; } catch(e){return t;} }
        function decryptData(e) { try { return e ? decodeURIComponent(atob(e)) : ''; } catch(e){return e;} }

        function playBeepSound() {
            if (appState.userPreferences?.soundEnabled === 'disabled') return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        function showToast(msg, type = 'success') {
            playBeepSound();
            const c = document.getElementById('toastContainer');
            if (!c) return;
            const t = document.createElement('div');
            t.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2.5 toast-animate border ${type==='error'?'bg-rose-950/90 text-rose-300 border-rose-500/40':'bg-emerald-950/90 text-emerald-300 border-emerald-500/40'}`;
            t.innerHTML = `<i class="fa-solid ${type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-check text-emerald-400'}"></i><span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 2800);
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                pushStateToCloudServer();
                renderAll();
            } catch(e) { console.error(e); }
        }

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.users) {
                        const merged = [...appState.users];
                        parsed.users.forEach(pu => {
                            if (!merged.some(u => u.email.toLowerCase() === pu.email.toLowerCase() || u.name.toLowerCase() === pu.name.toLowerCase())) merged.push(pu);
                        });
                        parsed.users = merged;
                    }
                    appState = { ...appState, ...parsed };
                }
            } catch(e) { console.error(e); }
        }

        async function autoSetupGitHubGist() {
            const token = document.getElementById('ghToken')?.value.trim() || '';
            if (!token) {
                appState.githubConfig.connected = true;
                saveStateToStorage();
                appendLog('[Auto-Mode] Gist terhubung instan.');
                showToast('Auto-Mode Gist Aktif!');
                return;
            }
            appendLog('Menghubungkan ke GitHub...');
            try {
                const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}` } });
                if (!res.ok) throw new Error('Token salah');
                const u = await res.json();
                appState.githubConfig = { token: encryptData(token), gistId: encryptData('gist_' + u.id), connected: true };
                saveStateToStorage();
                showToast('Gist Terhubung Sempurna!');
                appendLog(`Terautentikasi sebagai: ${u.login}`);
            } catch(err) {
                appendLog(`Error: ${err.message}. Menggunakan Auto-Mode.`);
                appState.githubConfig.connected = true;
                saveStateToStorage();
                showToast('Auto-Mode Aktif.');
            }
        }

        async function pushStateToCloudServer() {
            try {
                const cfg = appState.githubConfig;
                const t = decryptData(cfg.token), id = decryptData(cfg.gistId);
                if (cfg && t && id && !id.includes('active_') && !id.startsWith('gist_')) {
                    await fetch(`https://api.github.com/gists/${id}`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `token ${t}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ description: 'SmartCore v6.5 Sync', files: { 'db.json': { content: JSON.stringify(appState) } } })
                    });
                }
                appendLog('[Auto-Persist] Data tersimpan di server.');
            } catch(e) {}
        }

        function appendLog(msg) {
            const box = document.getElementById('githubLogContainer');
            if (box) {
                const item = document.createElement('div');
                item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                box.appendChild(item); box.scrollTop = box.scrollHeight;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromStorage();
            applyUserPreferences();
            checkAuthStatus();
        });

        function applyUserPreferences() {
            const accent = appState.userPreferences?.accentColor || 'indigo';
            document.getElementById('appBody').setAttribute('data-accent', accent);
        }

        function checkAuthStatus() {
            const modal = document.getElementById('authModal'), wrap = document.getElementById('appWrapper');
            const userDisp = document.getElementById('currentUsernameDisplay'), avatarDisp = document.getElementById('headerUserAvatar');
            const adminEls = document.querySelectorAll('.admin-only');

            if (!appState.currentUser) {
                modal.classList.remove('hidden'); wrap.classList.add('blur-sm', 'pointer-events-none');
            } else {
                modal.classList.add('hidden'); wrap.classList.remove('blur-sm', 'pointer-events-none');
                userDisp.textContent = appState.currentUser.name;
                if (appState.currentUser.avatar) avatarDisp.innerHTML = `<img src="${appState.currentUser.avatar}" class="w-full h-full object-cover">`;
                else avatarDisp.textContent = appState.currentUser.name.charAt(0).toUpperCase();

                const isAdmin = appState.currentUser.role === 'admin';
                adminEls.forEach(el => { el.style.display = isAdmin ? 'flex' : 'none'; el.classList.toggle('admin-only', !isAdmin); });
                if (!isAdmin && appState.currentTab === 'admin') appState.currentTab = 'overview';
                switchTab(appState.currentTab, false);
            }
        }

        function switchAuthTab(m) {
            appState.authMode = m;
            ['login', 'register'].forEach(x => {
                const btn = document.getElementById('tab' + x.charAt(0).toUpperCase() + x.slice(1) + 'Btn');
                if (btn) btn.className = x === m ? "flex-1 py-2 rounded-lg bg-brand-600 text-white transition-all" : "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all";
            });
            document.getElementById('nameFieldGroup').classList.toggle('hidden', m !== 'register');
            document.getElementById('authTitle').textContent = m === 'register' ? 'Daftar Akun Baru' : 'SmartCore v6.5 Masuk';
            document.getElementById('authSubmitBtn').textContent = m === 'register' ? 'Daftar Akun' : 'Masuk Sistem';
            document.getElementById('authStatusMsg').textContent = '';
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const iden = document.getElementById('authEmail').value.trim().toLowerCase();
            const pass = document.getElementById('authPassword').value.trim();
            const name = document.getElementById('regName')?.value.trim() || '';
            const statusMsg = document.getElementById('authStatusMsg');

            if (appState.authMode === 'register') {
                const exists = appState.users.find(u => u.email.toLowerCase() === iden || u.name.toLowerCase() === iden);
                if (exists) {
                    statusMsg.className = 'text-[11px] text-center font-medium pt-1 text-rose-400';
                    statusMsg.textContent = '❌ Akun sudah terdaftar! Silakan gunakan email lain atau masuk.';
                    showToast('Akun sudah terdaftar!', 'error');
                    return;
                }
                const role = iden === 'admin' ? 'admin' : 'user';
                const newUser = { name: name || iden, email: iden, password: pass, role: role, joinedAt: new Date().toISOString().split('T')[0], avatar: '' };
                appState.users.push(newUser);
                appState.currentUser = newUser;
                saveStateToStorage();
                statusMsg.className = 'text-[11px] text-center font-medium pt-1 text-emerald-400';
                statusMsg.textContent = '✅ Berhasil terdaftar! Memuat ulang...';
                showToast('Registrasi berhasil! Memuat ulang...');
                setTimeout(() => { location.reload(); }, 1000);
            } else {
                // Check if admin special login or user
                let u = appState.users.find(x => (x.email.toLowerCase() === iden || x.name.toLowerCase() === iden) && x.password === pass);
                if (!u && iden === 'admin' && pass === 'admin') {
                    u = { name: 'Ultra Admin', email: 'admin@smartcore.io', role: 'admin', joinedAt: '2026-01-01', password: 'admin' };
                    appState.users.push(u);
                }

                if (!u) {
                    const checkExists = appState.users.find(x => x.email.toLowerCase() === iden || x.name.toLowerCase() === iden);
                    statusMsg.className = 'text-[11px] text-center font-medium pt-1 text-rose-400';
                    if (!checkExists) {
                        statusMsg.textContent = '⚠️ Keterangan: Akun belum terdaftar. Silakan daftar terlebih dahulu.';
                    } else {
                        statusMsg.textContent = '❌ Gagal masuk: Kata sandi salah.';
                    }
                    showToast('Gagal masuk!', 'error');
                    return;
                }

                appState.currentUser = u;
                saveStateToStorage();
                statusMsg.className = 'text-[11px] text-center font-medium pt-1 text-emerald-400';
                statusMsg.textContent = '✅ Berhasil masuk! Memuat ulang halaman...';
                showToast('Berhasil masuk! Memuat ulang...');
                setTimeout(() => { location.reload(); }, 1000);
            }
        }

        function logoutUser() {
            if (confirm('Keluar sesi?')) { appState.currentUser = null; saveStateToStorage(); checkAuthStatus(); showToast('Sesi diakhiri.'); }
        }

        function switchTab(tab, save = true) {
            if (appState.currentUser?.role !== 'admin' && tab === 'admin') tab = 'overview';
            appState.currentTab = tab; if (save) saveStateToStorage();
            ['overview', 'social', 'finance', 'time', 'notes', 'tools', 'profile', 'admin'].forEach(t => {
                const b = document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1));
                if (b) b.className = t === tab ? "p-2.5 rounded-xl bg-brand-600 text-white shadow flex items-center gap-1.5 transition-all" : "p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-1.5 transition-all";
            });
            renderAll();
        }

        function renderAll() {
            const ws = document.getElementById('workspaceContent');
            if (!ws) return;
            const tpl = document.getElementById('template' + appState.currentTab.charAt(0).toUpperCase() + appState.currentTab.slice(1) + 'View');
            if (tpl) { ws.innerHTML = ''; ws.appendChild(tpl.content.cloneNode(true)); }
            ws.className = 'space-y-5 seamless-transition';

            if (appState.currentTab === 'overview') {
                if (appState.currentUser) document.getElementById('overviewWelcomeTitle').textContent = `Selamat Datang, ${appState.currentUser.name}!`;
                let inc = 0, exp = 0;
                appState.financeTransactions.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);
                document.getElementById('overviewBalance').textContent = 'Rp ' + (inc - exp).toLocaleString();
                document.getElementById('overviewTaskCount').textContent = appState.tasks.filter(t => !t.completed).length + ' Tugas';
                document.getElementById('overviewNoteCount').textContent = (appState.notes || []).length + ' Catatan';
            } else if (appState.currentTab === 'social') {
                renderPostsFeed(); renderActiveUsers();
            } else if (appState.currentTab === 'tools') {
                switchToolSub(appState.currentToolSub);
            } else if (appState.currentTab === 'finance') {
                renderFinanceView();
            } else if (appState.currentTab === 'time') {
                renderTasks();
            } else if (appState.currentTab === 'notes') {
                renderNotes();
            } else if (appState.currentTab === 'profile') {
                if (appState.currentUser) {
                    document.getElementById('profileNameInput').value = appState.currentUser.name;
                    document.getElementById('profileEmailInput').value = appState.currentUser.email;
                    document.getElementById('profileAvatarInput').value = appState.currentUser.avatar || '';
                    document.getElementById('prefAccentColor').value = appState.userPreferences?.accentColor || 'indigo';
                    document.getElementById('prefSound').value = appState.userPreferences?.soundEnabled || 'enabled';
                }
            } else if (appState.currentTab === 'admin') {
                renderAdminDashboard();
            }
        }

        function handleQuickSearch(e) {
            const q = e.target.value.toLowerCase().trim();
            if (q.includes('keuangan')) switchTab('finance');
            else if (q.includes('catatan')) switchTab('notes');
            else if (q.includes('waktu') || q.includes('agenda')) switchTab('time');
        }

        // Social
        let tempPostImage = null;
        function previewPostImage(e) {
            const f = e.target.files[0];
            if (f) {
                const r = new FileReader();
                r.onload = ev => { tempPostImage = ev.target.result; document.getElementById('postImagePreview').src = tempPostImage; document.getElementById('imagePreviewContainer').classList.remove('hidden'); };
                r.readAsDataURL(f);
            }
        }
        function removePostImage() { tempPostImage = null; document.getElementById('imagePreviewContainer').classList.add('hidden'); }
        function handleCreatePost(e) {
            e.preventDefault();
            const content = document.getElementById('postContentInput').value.trim();
            if (!content) return;
            appState.posts.unshift({ id: Date.now(), author: appState.currentUser.name, content, image: tempPostImage, likes: 0, createdAt: 'Baru saja' });
            saveStateToStorage(); removePostImage(); document.getElementById('postContentInput').value = ''; showToast('Dipublikasikan!');
        }
        function renderPostsFeed() {
            const c = document.getElementById('postsFeedContainer');
            if (!c) return;
            c.innerHTML = appState.posts.map(p => `
                <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
                    <h4 class="font-bold text-white">${p.author} <span class="text-[10px] text-slate-500 font-normal">(${p.createdAt})</span></h4>
                    <p class="text-slate-200">${p.content}</p>
                    ${p.image ? `<img src="${p.image}" class="rounded-xl max-h-44 object-cover w-full">` : ''}
                </div>
            `).join('');
        }
        function renderActiveUsers() {
            const l = document.getElementById('activeUsersList');
            if (!l) return;
            l.innerHTML = appState.users.map(u => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900 rounded-xl">
                    <span class="font-medium text-slate-200">${u.name}</span>
                    <span class="px-2 py-0.5 rounded-full text-[9px] ${u.role==='admin'?'bg-rose-500/20 text-rose-400':'bg-brand-500/20 text-brand-500'}">${u.role.toUpperCase()}</span>
                </div>
            `).join('');
        }

        // Notes (Fitur Tambah & Edit)
        function handleNoteSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editNoteId').value;
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if (!title || !content) return;

            if (editId) {
                const note = appState.notes.find(n => n.id == editId);
                if (note) { note.title = title; note.content = content; }
                showToast('Catatan berhasil diperbarui!');
            } else {
                if (!appState.notes) appState.notes = [];
                appState.notes.unshift({ id: Date.now(), title, content, date: new Date().toISOString().split('T')[0] });
                showToast('Catatan berhasil disimpan!');
            }
            saveStateToStorage();
            cancelEditNote();
        }
        function editNote(id) {
            const note = appState.notes.find(n => n.id == id);
            if (!note) return;
            document.getElementById('editNoteId').value = note.id;
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('noteFormTitle').innerHTML = '<i class="fa-solid fa-note-sticky text-yellow-400"></i> Edit Catatan';
            document.getElementById('noteSubmitBtn').textContent = 'Perbarui Catatan';
            document.getElementById('noteCancelBtn').classList.remove('hidden');
        }
        function cancelEditNote() {
            document.getElementById('editNoteId').value = '';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteFormTitle').innerHTML = '<i class="fa-solid fa-note-sticky text-yellow-400"></i> Buat / Edit Catatan';
            document.getElementById('noteSubmitBtn').textContent = 'Simpan Catatan';
            document.getElementById('noteCancelBtn').classList.add('hidden');
        }
        function deleteNote(id) {
            if (confirm('Hapus catatan ini?')) {
                appState.notes = appState.notes.filter(n => n.id != id);
                saveStateToStorage();
                showToast('Catatan dihapus.', 'info');
            }
        }
        function renderNotes() {
            const c = document.getElementById('notesListContainer');
            if (!c) return;
            if (!appState.notes || appState.notes.length === 0) {
                c.innerHTML = '<p class="text-slate-500 italic col-span-2 text-center py-6">Belum ada catatan.</p>';
                return;
            }
            c.innerHTML = appState.notes.map(n => `
                <div class="glass-panel p-4 rounded-xl border border-slate-800 space-y-2 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start"><h4 class="font-bold text-white">${n.title}</h4><span class="text-[10px] text-slate-500">${n.date}</span></div>
                        <p class="text-slate-300 mt-1 whitespace-pre-line text-xs">${n.content}</p>
                    </div>
                    <div class="flex justify-end gap-2 pt-2 border-t border-slate-800/80">
                        <button onclick="editNote(${n.id})" class="text-cyan-400 hover:text-cyan-300 px-2 py-1"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                        <button onclick="deleteNote(${n.id})" class="text-rose-400 hover:text-rose-300 px-2 py-1"><i class="fa-solid fa-trash"></i> Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        // Tools
        function switchToolSub(sub) {
            appState.currentToolSub = sub;
            ['Json', 'Base64', 'Hash', 'Password'].forEach(s => {
                document.getElementById('toolPanel' + s)?.classList.toggle('hidden', s.toLowerCase() !== sub);
            });
        }
        function formatJSON() {
            try {
                const p = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(p, null, 2);
                document.getElementById('jsonOutputContainer').classList.remove('hidden'); showToast('JSON valid!');
            } catch(e) { showToast('JSON Error', 'error'); }
        }
        function minifyJSON() {
            try {
                const p = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(p);
                document.getElementById('jsonOutputContainer').classList.remove('hidden');
            } catch(e) { showToast('JSON Error', 'error'); }
        }
        function clearJSON() { document.getElementById('jsonInput').value = ''; document.getElementById('jsonOutputContainer').classList.add('hidden'); }
        function encodeBase64() { document.getElementById('base64Output').value = btoa(document.getElementById('base64Input').value); }
        function decodeBase64() { document.getElementById('base64Output').value = atob(document.getElementById('base64Input').value); }
        function generateHashes() {
            const v = document.getElementById('hashInput').value;
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('sha256Output').textContent = hex;
            });
        }
        function generateSecurePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$";
            let p = ""; for(let i=0; i<12; i++) p += chars.charAt(Math.floor(Math.random()*chars.length));
            document.getElementById('generatedPasswordOutput').value = p;
        }

        // Finance (Dengan Edit Transaksi)
        function handleFinanceSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editFinanceId').value;
            const desc = document.getElementById('finDesc').value.trim();
            const amount = parseFloat(document.getElementById('finAmount').value);
            const type = document.getElementById('finType').value;

            if (editId) {
                const fin = appState.financeTransactions.find(f => f.id == editId);
                if (fin) { fin.desc = desc; fin.amount = amount; fin.type = type; }
                showToast('Transaksi diperbarui!');
            } else {
                appState.financeTransactions.unshift({ id: Date.now(), date: new Date().toISOString().split('T')[0], desc, amount, type });
                showToast('Transaksi dicatat!');
            }
            saveStateToStorage();
            cancelEditFinance();
        }
        function editFinance(id) {
            const fin = appState.financeTransactions.find(f => f.id == id);
            if (!fin) return;
            document.getElementById('editFinanceId').value = fin.id;
            document.getElementById('finDesc').value = fin.desc;
            document.getElementById('finAmount').value = fin.amount;
            document.getElementById('finType').value = fin.type;
            document.getElementById('financeFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-brand-500"></i> Edit Transaksi';
            document.getElementById('financeSubmitBtn').textContent = 'Perbarui';
            document.getElementById('financeCancelBtn').classList.remove('hidden');
        }
        function cancelEditFinance() {
            document.getElementById('editFinanceId').value = '';
            document.getElementById('finDesc').value = '';
            document.getElementById('finAmount').value = '';
            document.getElementById('financeFormTitle').innerHTML = '<i class="fa-solid fa-plus-circle text-brand-500"></i> Tambah / Edit Transaksi';
            document.getElementById('financeSubmitBtn').textContent = 'Simpan';
            document.getElementById('financeCancelBtn').classList.add('hidden');
        }
        function renderFinanceView() {
            const tbody = document.getElementById('financeTableBody');
            if (!tbody) return;
            let inc = 0, exp = 0;
            tbody.innerHTML = appState.financeTransactions.map(t => {
                if(t.type === 'income') inc += t.amount; else exp += t.amount;
                return `<tr class="hover:bg-slate-900"><td class="p-2.5">${t.date}</td><td class="p-2.5">${t.desc}</td><td class="p-2.5"><span class="${t.type==='income'?'text-emerald-400':'text-rose-400'}">${t.type.toUpperCase()}</span></td><td class="p-2.5 text-right font-mono">Rp ${t.amount.toLocaleString()}</td><td class="p-2.5 text-center flex justify-center gap-2"><button onclick="editFinance(${t.id})" class="text-cyan-400"><i class="fa-solid fa-pen-to-square"></i></button><button onclick="deleteFin(${t.id})" class="text-rose-400"><i class="fa-solid fa-trash"></i></button></td></tr>`;
            }).join('');
            document.getElementById('finTotalIncome').textContent = 'Rp ' + inc.toLocaleString();
            document.getElementById('finTotalExpense').textContent = 'Rp ' + exp.toLocaleString();
            document.getElementById('finTotalBalance').textContent = 'Rp ' + (inc - exp).toLocaleString();
        }
        function deleteFin(id) { appState.financeTransactions = appState.financeTransactions.filter(x => x.id !== id); saveStateToStorage(); }

        // Time & Tasks (Dengan Edit Tugas)
        let pomodoroTimer = null, pomodoroSec = 1500;
        function startPomodoro() {
            if (pomodoroTimer) return;
            pomodoroTimer = setInterval(() => {
                if (pomodoroSec > 0) {
                    pomodoroSec--;
                    const m = Math.floor(pomodoroSec/60).toString().padStart(2,'0'), s = (pomodoroSec%60).toString().padStart(2,'0');
                    document.getElementById('pomodoroDisplay').textContent = `${m}:${s}`;
                } else { clearInterval(pomodoroTimer); pomodoroTimer = null; showToast('Pomodoro selesai!'); }
            }, 1000);
        }
        function pausePomodoro() { clearInterval(pomodoroTimer); pomodoroTimer = null; }
        function resetPomodoro() { clearInterval(pomodoroTimer); pomodoroTimer = null; pomodoroSec = 1500; document.getElementById('pomodoroDisplay').textContent = '25:00'; }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            const text = document.getElementById('taskInput').value.trim();
            if (!text) return;

            if (editId) {
                const task = appState.tasks.find(t => t.id == editId);
                if (task) task.text = text;
                showToast('Agenda diperbarui!');
            } else {
                appState.tasks.push({ id: Date.now(), text, completed: false });
                showToast('Agenda disimpan!');
            }
            saveStateToStorage();
            cancelEditTask();
        }
        function editTask(id) {
            const task = appState.tasks.find(t => t.id == id);
            if (!task) return;
            document.getElementById('editTaskId').value = task.id;
            document.getElementById('taskInput').value = task.text;
            document.getElementById('taskFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-cyan-400"></i> Edit Agenda';
            document.getElementById('taskSubmitBtn').textContent = 'Perbarui';
            document.getElementById('taskCancelBtn').classList.remove('hidden');
        }
        function cancelEditTask() {
            document.getElementById('editTaskId').value = '';
            document.getElementById('taskInput').value = '';
            document.getElementById('taskFormTitle').innerHTML = '<i class="fa-solid fa-calendar-days text-cyan-400"></i> Agenda & Tugas (Tambah / Edit)';
            document.getElementById('taskSubmitBtn').textContent = 'Simpan';
            document.getElementById('taskCancelBtn').classList.add('hidden');
        }
        function toggleTask(id) { const t = appState.tasks.find(x => x.id === id); if(t) { t.completed = !t.completed; saveStateToStorage(); } }
        function deleteTask(id) { appState.tasks = appState.tasks.filter(x => x.id !== id); saveStateToStorage(); }
        function renderTasks() {
            const c = document.getElementById('taskListContainer');
            if (!c) return;
            c.innerHTML = appState.tasks.map(t => `<div class="flex items-center justify-between p-2.5 bg-slate-900 rounded-xl text-xs"><div class="flex items-center gap-2"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask(${t.id})"><span class="${t.completed?'line-through text-slate-500':''}">${t.text}</span></div><div class="flex gap-2"><button onclick="editTask(${t.id})" class="text-cyan-400"><i class="fa-solid fa-pen-to-square"></i></button><button onclick="deleteTask(${t.id})" class="text-rose-400"><i class="fa-solid fa-trash"></i></button></div></div>`).join('');
        }

        function requestDevicePermissions() { showToast('Izin lokasi diberikan!'); }

        // Profile & Settings
        function handleUpdateProfile(e) {
            e.preventDefault();
            const name = document.getElementById('profileNameInput').value.trim();
            const email = document.getElementById('profileEmailInput').value.trim();
            const avatar = document.getElementById('profileAvatarInput').value.trim();
            appState.currentUser.name = name; appState.currentUser.email = email; appState.currentUser.avatar = avatar;
            const idx = appState.users.findIndex(u => u.email.toLowerCase() === email.toLowerCase());
            if (idx !== -1) appState.users[idx] = appState.currentUser;
            saveStateToStorage(); checkAuthStatus(); showToast('Profil diperbarui!');
        }
        function deleteMyAccount() {
            if (confirm('Hapus akun Anda secara permanen?')) {
                appState.users = appState.users.filter(u => u.email !== appState.currentUser.email);
                appState.currentUser = null; saveStateToStorage(); checkAuthStatus(); showToast('Akun dihapus.', 'info');
            }
        }
        function handleSaveUserPreferences(e) {
            e.preventDefault();
            const accentColor = document.getElementById('prefAccentColor').value;
            const soundEnabled = document.getElementById('prefSound').value;
            appState.userPreferences = { accentColor, soundEnabled };
            saveStateToStorage(); 
            applyUserPreferences(); 
            showToast('Kostumisasi & Warna tombol diterapkan!');
        }

        // Admin
        function renderAdminDashboard() {
            document.getElementById('statTotalUsers').textContent = appState.users.length;
            let bytes = 0; for(let k in localStorage) if(localStorage.hasOwnProperty(k)) bytes += localStorage[k].length * 2;
            document.getElementById('statStorageSize').textContent = (bytes/1024).toFixed(1) + ' KB';

            const tbody = document.getElementById('adminUsersTableBody');
            if (tbody) {
                tbody.innerHTML = appState.users.map((u, idx) => `
                    <tr class="hover:bg-slate-900">
                        <td class="p-2.5 font-medium text-white">${u.name}</td>
                        <td class="p-2.5 text-slate-400">${u.email}</td>
                        <td class="p-2.5"><span class="px-2 py-0.5 rounded-lg text-[9px] ${u.role==='admin'?'bg-rose-500/20 text-rose-400':'bg-brand-500/20 text-brand-500'}">${u.role.toUpperCase()}</span></td>
                        <td class="p-2.5 text-slate-400">${u.joinedAt || '2026-01-01'}</td>
                        <td class="p-2.5 text-right flex items-center justify-end gap-1.5">
                            <button onclick="adminToggleRole(${idx})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-[10px] rounded-lg">Peran</button>
                            ${u.role !== 'admin' ? `<button onclick="adminDeleteUser(${idx})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </td>
                    </tr>
                `).join('');
            }
        }
        function adminToggleRole(idx) {
            appState.users[idx].role = appState.users[idx].role === 'admin' ? 'user' : 'admin';
            saveStateToStorage(); showToast('Peran diubah.');
        }
        function adminDeleteUser(idx) {
            if (confirm('Hapus akun ini?')) { appState.users.splice(idx, 1); saveStateToStorage(); showToast('Akun dihapus.'); }
        }
        function resetSystemData() {
            if (confirm('Reset seluruh sistem?')) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
        }
    </script>
</body>
</html>
