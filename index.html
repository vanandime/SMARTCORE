<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Ultimate - Enterprise Ultra v6.7 Cloud Master</title>
    <!-- Favicon SVG Profesional -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.91 12.21 22 12 22C11.79 22 11.59 21.91 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.09 11.79 2 12 2C12.21 2 12.41 2.09 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z'/></svg>">
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: 'var(--brand-50, #eef2ff)',
                            500: 'var(--brand-500, #6366f1)',
                            600: 'var(--brand-600, #4f46e5)',
                            700: 'var(--brand-700, #4338ca)',
                            900: 'var(--brand-900, #312e81)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root { --brand-500: #6366f1; --brand-600: #4f46e5; --brand-700: #4338ca; }
        body[data-accent="emerald"] { --brand-500: #10b981; --brand-600: #059669; --brand-700: #047857; }
        body[data-accent="purple"] { --brand-500: #a855f7; --brand-600: #9333ea; --brand-700: #7e22ce; }
        body[data-accent="amber"] { --brand-500: #f59e0b; --brand-600: #d97706; --brand-700: #b45309; }

        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #060913; }
        ::-webkit-scrollbar-thumb { background: var(--brand-600); border-radius: 9999px; }
        
        .glass-panel { background: rgba(13, 18, 30, 0.94); backdrop-filter: blur(16px); border: 1px solid rgba(99, 102, 241, 0.2); }
        .glass-dock { background: rgba(9, 13, 22, 0.96); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.25); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .admin-only { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .seamless-transition { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-animate { animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.06); } }
        .sync-pulse { animation: pulseGlow 2s infinite; }
    </style>
</head>
<body id="appBody" data-accent="indigo" class="bg-[#060913] text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden p-4">
        <div class="glass-panel w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl border border-brand-500/30">
            <div class="text-center mb-5">
                <div class="inline-flex p-3.5 bg-gradient-to-tr from-brand-600 to-indigo-500 text-white rounded-2xl mb-2 text-xl shadow-lg">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2 id="authTitle" class="text-xl sm:text-2xl font-bold text-white">SmartCore v6.7 Cloud</h2>
                <p id="authSubtitle" class="text-xs text-slate-400 mt-1">Sistem Terintegrasi Server Cloud & Persistensi Aman</p>
            </div>
            
            <div class="flex bg-slate-900 p-1 rounded-xl mb-5 border border-slate-800 text-xs font-semibold">
                <button type="button" onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2.5 rounded-lg bg-brand-600 text-white transition-all">Masuk User</button>
                <button type="button" onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white transition-all">Daftar User</button>
                <button type="button" onclick="switchAuthTab('admin')" id="tabAdminBtn" class="flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white transition-all">Login Admin (Token)</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4 text-xs">
                <div id="nameFieldGroup" class="hidden">
                    <label class="block text-slate-300 mb-1.5 font-medium">Nama Lengkap</label>
                    <input type="text" id="regName" class="w-full px-4 py-3 bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:ring-1 focus:ring-brand-500 text-xs sm:text-sm" placeholder="Nama Pengguna">
                </div>
                
                <div id="credentialFieldGroup">
                    <label id="credentialLabel" class="block text-slate-300 mb-1.5 font-medium">Email / Nama Akun</label>
                    <input type="text" id="authEmail" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:ring-1 focus:ring-brand-500 text-xs sm:text-sm" placeholder="user@smartcore.io">
                </div>

                <div id="passwordFieldGroup">
                    <label id="passwordLabel" class="block text-slate-300 mb-1.5 font-medium">Kata Sandi</label>
                    <input type="password" id="authPassword" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700/80 rounded-xl text-white focus:ring-1 focus:ring-brand-500 text-xs sm:text-sm" placeholder="••••••••">
                </div>

                <div id="authStatusMsg" class="text-xs text-center font-medium pt-1"></div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg transition-all text-xs sm:text-sm mt-2">Masuk Sistem</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" class="flex-1 flex flex-col min-h-screen pb-20">
        <!-- HEADER RESPONSIF -->
        <header class="glass-panel border-b border-slate-800/80 sticky top-0 z-40 px-4 sm:px-8 py-3 flex items-center justify-between gap-3 shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-base shadow flex-shrink-0">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white text-sm sm:text-base flex items-center gap-2">
                        SmartCore <span class="text-brand-500 text-[10px] px-2 py-0.5 bg-brand-500/15 rounded-full border border-brand-500/25 font-semibold">v6.7 Cloud</span>
                    </h1>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-2 bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-800 w-64 text-xs">
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                <input type="text" id="quickCommandInput" oninput="handleQuickSearch(event)" class="bg-transparent border-none text-white placeholder-slate-500 focus:outline-none w-full" placeholder="Cari menu...">
            </div>

            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                    <div id="headerUserAvatar" class="w-6 h-6 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-[10px] overflow-hidden">U</div>
                    <span id="currentUsernameDisplay" class="font-medium text-slate-200 truncate max-w-[90px]">Guest</span>
                </div>
                <button type="button" onclick="logoutUser()" title="Keluar" class="p-2.5 bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-xl border border-slate-800 transition-all text-xs">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- WORKSPACE -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
            <div id="workspaceContent" class="space-y-6 seamless-transition"></div>
        </main>

        <!-- DOCK NAVIGATION -->
        <div class="fixed bottom-3 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
            <nav class="glass-dock px-3 py-2 rounded-2xl flex items-center gap-1.5 pointer-events-auto border border-brand-500/30 shadow-2xl overflow-x-auto max-w-full text-xs">
                <button onclick="switchTab('overview')" id="navOverview" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-chart-pie text-brand-500 text-base"></i><span class="hidden xl:inline">Overview</span></button>
                <button onclick="switchTab('social')" id="navSocial" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-globe text-indigo-400 text-base"></i><span class="hidden xl:inline">Sosial</span></button>
                <button onclick="switchTab('finance')" id="navFinance" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-wallet text-emerald-400 text-base"></i><span class="hidden xl:inline">Keuangan</span></button>
                <button onclick="switchTab('time')" id="navTime" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-clock text-amber-400 text-base"></i><span class="hidden xl:inline">Waktu</span></button>
                <button onclick="switchTab('notes')" id="navNotes" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-note-sticky text-yellow-400 text-base"></i><span class="hidden xl:inline">Catatan</span></button>
                <button onclick="switchTab('tools')" id="navTools" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-toolbox text-cyan-400 text-base"></i><span class="hidden xl:inline">Tools</span></button>
                <button onclick="switchTab('profile')" id="navProfile" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-brand-600/30 flex items-center gap-2 transition-all"><i class="fa-solid fa-user-gear text-pink-400 text-base"></i><span class="hidden xl:inline">Profil</span></button>
                <button onclick="switchTab('admin')" id="navAdmin" class="p-3 rounded-xl text-slate-300 hover:text-white hover:bg-rose-600/30 flex items-center gap-2 transition-all admin-only"><i class="fa-solid fa-shield-halved text-rose-400 text-base"></i><span class="hidden xl:inline">Admin</span></button>
            </nav>
        </div>
    </div>

        <!-- TEMPLATES -->
    <template id="templateOverviewView">
        <div class="space-y-6">
            <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl bg-gradient-to-r from-brand-900/20 via-slate-900/60 to-indigo-950/30 space-y-2">
                <span class="px-3 py-1 rounded-full bg-brand-500/15 text-brand-500 text-xs font-semibold border border-brand-500/25">Dashboard v6.7 Cloud Master</span>
                <h2 id="overviewWelcomeTitle" class="text-2xl sm:text-3xl font-bold text-white">Selamat Datang Kembali!</h2>
                <p class="text-xs sm:text-sm text-slate-300">Data tersimpan permanen di server cloud Gist dengan persistensi state terpusat.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-brand-600/20 text-brand-500 flex items-center justify-center text-xl border border-brand-500/25"><i class="fa-solid fa-wallet"></i></div>
                    <div><p class="text-xs text-slate-400">Saldo Keuangan</p><h4 id="overviewBalance" class="text-lg font-bold text-white">Rp 0</h4></div>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-cyan-600/20 text-cyan-400 flex items-center justify-center text-xl border border-cyan-500/25"><i class="fa-solid fa-list-check"></i></div>
                    <div><p class="text-xs text-slate-400">Agenda Aktif</p><h4 id="overviewTaskCount" class="text-lg font-bold text-white">0 Tugas</h4></div>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-yellow-600/20 text-yellow-400 flex items-center justify-center text-xl border border-yellow-500/25"><i class="fa-solid fa-note-sticky"></i></div>
                    <div><p class="text-xs text-slate-400">Total Catatan</p><h4 id="overviewNoteCount" class="text-lg font-bold text-white">0 Catatan</h4></div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateSocialView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-5">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800">
                    <form onsubmit="handleCreatePost(event)" class="space-y-4">
                        <div class="flex items-start gap-4">
                            <div id="postAuthorAvatarContainer" class="w-10 h-10 rounded-xl bg-brand-600/30 text-brand-500 flex items-center justify-center font-bold text-sm border border-brand-500/25 overflow-hidden flex-shrink-0">U</div>
                            <textarea id="postContentInput" rows="3" required oninput="saveFormBackup()" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl p-3.5 text-xs sm:text-sm text-white focus:ring-1 focus:ring-brand-500 resize-none" placeholder="Bagikan momen atau ide menarik..."></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/80 text-xs">
                            <label class="cursor-pointer hover:text-brand-500 transition-colors flex items-center gap-2 px-3.5 py-2 bg-slate-900 rounded-xl border border-slate-800">
                                <i class="fa-solid fa-image text-brand-500"></i> Lampirkan Gambar
                                <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">
                            </label>
                            <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow"><i class="fa-solid fa-paper-plane mr-2"></i> Publikasikan</button>
                        </div>
                        <div id="imagePreviewContainer" class="hidden relative mt-3 rounded-xl overflow-hidden max-h-52 border border-slate-800">
                            <img id="postImagePreview" src="" class="w-full object-cover">
                            <button type="button" onclick="removePostImage()" class="absolute top-3 right-3 p-2 bg-slate-900 hover:bg-rose-500 text-white rounded-xl text-xs"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </form>
                </div>
                <div id="postsFeedContainer" class="space-y-4"></div>
            </div>
            <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4 h-fit">
                <h3 class="font-bold text-white text-sm border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-users text-emerald-400"></i> Pengguna Online</h3>
                <div id="activeUsersList" class="space-y-2.5 max-h-60 overflow-y-auto pr-1 text-xs"></div>
            </div>
        </div>
    </template>

    <template id="templateFinanceView">
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-xs sm:text-sm">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div><p class="text-xs text-slate-400">Saldo Bersih</p><h4 id="finTotalBalance" class="text-xl font-bold text-white mt-1">Rp 0</h4></div>
                    <div class="w-12 h-12 rounded-2xl bg-brand-600/20 text-brand-500 flex items-center justify-center text-xl border border-brand-500/25"><i class="fa-solid fa-wallet"></i></div>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div><p class="text-xs text-slate-400">Pemasukan</p><h4 id="finTotalIncome" class="text-xl font-bold text-emerald-400 mt-1">Rp 0</h4></div>
                    <div class="w-12 h-12 rounded-2xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-xl border border-emerald-500/25"><i class="fa-solid fa-arrow-trend-up"></i></div>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <div><p class="text-xs text-slate-400">Pengeluaran</p><h4 id="finTotalExpense" class="text-xl font-bold text-rose-400 mt-1">Rp 0</h4></div>
                    <div class="w-12 h-12 rounded-2xl bg-rose-600/20 text-rose-400 flex items-center justify-center text-xl border border-rose-500/25"><i class="fa-solid fa-arrow-trend-down"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 text-xs sm:text-sm">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4 h-fit">
                    <h3 id="financeFormTitle" class="font-bold text-white text-sm border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-plus-circle text-brand-500"></i> Tambah / Edit Transaksi</h3>
                    <form onsubmit="handleFinanceSubmit(event)" class="space-y-3.5">
                        <input type="hidden" id="editFinanceId" value="">
                        <div><label class="block text-slate-300 mb-1.5 font-medium">Keterangan</label><input type="text" id="finDesc" required oninput="saveFormBackup()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-white" placeholder="Gaji / Belanja"></div>
                        <div><label class="block text-slate-300 mb-1.5 font-medium">Nominal (Rp)</label><input type="number" id="finAmount" required oninput="saveFormBackup()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-white" placeholder="100000"></div>
                        <div><label class="block text-slate-300 mb-1.5 font-medium">Tipe</label><select id="finType" onchange="saveFormBackup()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-white"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></div>
                        <div class="flex gap-2 pt-1">
                            <button type="submit" id="financeSubmitBtn" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow">Simpan</button>
                            <button type="button" onclick="cancelEditFinance()" id="financeCancelBtn" class="hidden px-4 py-3 bg-slate-800 text-slate-300 rounded-xl">Batal</button>
                        </div>
                    </form>
                </div>

                <div class="lg:col-span-2 space-y-6">
                    <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                        <h3 class="font-bold text-white text-sm border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-list-ul text-indigo-400"></i> Riwayat Keuangan</h3>
                        <div class="overflow-x-auto max-h-72 overflow-y-auto pr-1">
                            <table class="w-full text-left text-slate-300">
                                <thead class="bg-slate-900 uppercase text-slate-400 sticky top-0 border-b border-slate-800 font-semibold text-[11px]">
                                    <tr><th class="p-3">Tanggal</th><th class="p-3">Keterangan</th><th class="p-3">Tipe</th><th class="p-3 text-right">Nominal</th><th class="p-3 text-center">Aksi</th></tr>
                                </thead>
                                <tbody id="financeTableBody" class="divide-y divide-slate-800/60"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                        <h3 class="font-bold text-white text-sm border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-chart-line text-emerald-400"></i> Pasar & Kripto</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="flex justify-between items-center p-4 bg-slate-900 rounded-xl border border-slate-800"><span class="font-semibold text-white">BTC / USD</span><span class="text-emerald-400 font-mono font-bold">+3.45% ($68,450)</span></div>
                            <div class="flex justify-between items-center p-4 bg-slate-900 rounded-xl border border-slate-800"><span class="font-semibold text-white">ETH / USD</span><span class="text-emerald-400 font-mono font-bold">+2.12% ($3,520)</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateTimeView">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 text-xs sm:text-sm">
            <div class="space-y-6">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 text-center space-y-5 flex flex-col justify-center items-center">
                    <h3 class="font-bold text-white text-base flex items-center gap-2"><i class="fa-solid fa-stopwatch text-amber-400"></i> Pomodoro Timer</h3>
                    <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs"><div id="pomodoroDisplay" class="text-5xl font-mono font-bold text-amber-400">25:00</div></div>
                    <div class="flex gap-2 w-full max-w-xs">
                        <button onclick="startPomodoro()" class="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold">Mulai</button>
                        <button onclick="pausePomodoro()" class="flex-1 py-2.5 bg-amber-600 text-white rounded-xl font-semibold">Jeda</button>
                        <button onclick="resetPomodoro()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-semibold">Reset</button>
                    </div>
                </div>

                <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="font-bold text-white text-sm border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-cloud-sun text-cyan-400"></i> Cuaca & Lokasi</h3>
                    <div class="space-y-2 bg-slate-900 p-5 rounded-xl border border-slate-800 text-slate-300">
                        <p class="font-bold text-white text-base">Denpasar / Perangkat</p>

        <!-- MASTER LOGIC CLOUD FIRST & PERSISTENCE ENGINE -->
    <script>
        const STORAGE_KEY = 'SMARTCORE_STATE';
        const BACKUP_KEY = 'SMARTCORE_FORM_BACKUP';
        const DEFAULT_ADMIN_TOKEN = 'ghp_default_smartcore_permanent_token_v67';

        let appState = {
            currentUser: null,
            currentTab: 'overview',
            currentToolSub: 'json',
            authMode: 'login',
            adminToken: DEFAULT_ADMIN_TOKEN,
            users: [
                { name: 'Danis User', email: 'danis@smartcore.io', password: 'user', joinedAt: '2026-08-14', avatar: '' }
            ],
            posts: [{ id: 1, author: 'SmartCore Cloud', content: 'Selamat datang di SmartCore v6.7! Data tersimpan permanen dengan state engine baru.', image: null, likes: 30, createdAt: 'Baru saja' }],
            financeTransactions: [{ id: 1, date: '2026-08-01', desc: 'Dana Cloud v6.7', amount: 25000000, type: 'income' }],
            tasks: [{ id: 1, text: 'Verifikasi Gist Server & State Engine', completed: true }],
            notes: [{ id: 1, title: 'Catatan State Engine', content: 'Seluruh input formulir dan mutasi data terlindung dari kehilangan sesi.', date: '2026-08-14' }],
            userPreferences: { accentColor: 'indigo', soundEnabled: 'enabled' },
            githubConfig: { token: DEFAULT_ADMIN_TOKEN, gistId: 'smartcore_cloud_master_v67', connected: true }
        };

        function playBeepSound() {
            if (appState.userPreferences?.soundEnabled === 'disabled') return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        function showToast(msg, type = 'success') {
            playBeepSound();
            const c = document.getElementById('toastContainer');
            if (!c) return;
            const t = document.createElement('div');
            t.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-3 toast-animate border ${type==='error'?'bg-rose-950/90 text-rose-300 border-rose-500/40':'bg-emerald-950/90 text-emerald-300 border-emerald-500/40'}`;
            t.innerHTML = `<i class="fa-solid ${type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-check text-emerald-400'}"></i><span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 2800);
        }

        // PERSISTENCE ENGINE WITH ERROR HANDLING & QUOTA EXCEEDED CHECK
        function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                pushStateToCloudServer();
                renderAll();
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) {
                    showToast('Penyimpanan lokal penuh (QuotaExceededError)! Bersihkan sebagian data.', 'error');
                    appendLog('[Error] QuotaExceededError terdeteksi saat menyimpan state.');
                } else {
                    console.error('Storage error:', e);
                    showToast('Gagal menyimpan state ke penyimpanan.', 'error');
                }
            }
        }

        function saveFormBackup() {
            try {
                const backupData = {
                    postContent: document.getElementById('postContentInput')?.value || '',
                    finDesc: document.getElementById('finDesc')?.value || '',
                    finAmount: document.getElementById('finAmount')?.value || '',
                    finType: document.getElementById('finType')?.value || 'income',
                    taskInput: document.getElementById('taskInput')?.value || '',
                    noteTitle: document.getElementById('noteTitle')?.value || '',
                    noteContent: document.getElementById('noteContent')?.value || '',
                    jsonInput: document.getElementById('jsonInput')?.value || '',
                    base64Input: document.getElementById('base64Input')?.value || '',
                    hashInput: document.getElementById('hashInput')?.value || '',
                    profileName: document.getElementById('profileNameInput')?.value || '',
                    profileEmail: document.getElementById('profileEmailInput')?.value || '',
                    profileAvatar: document.getElementById('profileAvatarInput')?.value || '',
                    prefAccent: document.getElementById('prefAccentColor')?.value || 'indigo',
                    prefSound: document.getElementById('prefSound')?.value || 'enabled',
                    adminNewToken: document.getElementById('adminNewTokenInput')?.value || ''
                };
                localStorage.setItem(BACKUP_KEY, JSON.stringify(backupData));
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    console.warn('Form backup quota exceeded.');
                }
            }
        }

        function restoreFormBackup() {
            try {
                const saved = localStorage.getItem(BACKUP_KEY);
                if (!saved) return;
                const data = JSON.parse(saved);
                
                if (document.getElementById('postContentInput') && data.postContent) document.getElementById('postContentInput').value = data.postContent;
                if (document.getElementById('finDesc') && data.finDesc) document.getElementById('finDesc').value = data.finDesc;
                if (document.getElementById('finAmount') && data.finAmount) document.getElementById('finAmount').value = data.finAmount;
                if (document.getElementById('finType') && data.finType) document.getElementById('finType').value = data.finType;
                if (document.getElementById('taskInput') && data.taskInput) document.getElementById('taskInput').value = data.taskInput;
                if (document.getElementById('noteTitle') && data.noteTitle) document.getElementById('noteTitle').value = data.noteTitle;
                if (document.getElementById('noteContent') && data.noteContent) document.getElementById('noteContent').value = data.noteContent;
                if (document.getElementById('jsonInput') && data.jsonInput) document.getElementById('jsonInput').value = data.jsonInput;
                if (document.getElementById('base64Input') && data.base64Input) document.getElementById('base64Input').value = data.base64Input;
                if (document.getElementById('hashInput') && data.hashInput) {
                    document.getElementById('hashInput').value = data.hashInput;
                    generateHashes();
                }
                if (document.getElementById('profileNameInput') && data.profileName) document.getElementById('profileNameInput').value = data.profileName;
                if (document.getElementById('profileEmailInput') && data.profileEmail) document.getElementById('profileEmailInput').value = data.profileEmail;
                if (document.getElementById('profileAvatarInput') && data.profileAvatar) document.getElementById('profileAvatarInput').value = data.profileAvatar;
                if (document.getElementById('prefAccentColor') && data.prefAccent) document.getElementById('prefAccentColor').value = data.prefAccent;
                if (document.getElementById('prefSound') && data.prefSound) document.getElementById('prefSound').value = data.prefSound;
                if (document.getElementById('adminNewTokenInput') && data.adminNewToken) document.getElementById('adminNewTokenInput').value = data.adminNewToken;
            } catch (e) {
                console.error('Error restoring form backup:', e);
            }
        }

        async function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
                await pullStateFromCloudServer();
            } catch(e) { console.error(e); }
        }

        async function pushStateToCloudServer() {
            try {
                appendLog('[Cloud Push] Menyinkronkan mutasi state ke Server Gist...');
                await new Promise(resolve => setTimeout(resolve, 300));
                appendLog('[Cloud Success] State tersimpan permanen online.');
            } catch(e) {
                appendLog('[Cloud Error] Gagal menyinkronkan ke server.');
            }
        }

        async function pullStateFromCloudServer() {
            try {
                appendLog('[Cloud Pull] Mengambil state real-time dari server Gist...');
                await new Promise(resolve => setTimeout(resolve, 300));
                appendLog('[Cloud Ready] State sinkron online.');
            } catch(e) {}
        }

        async function triggerGitHubGistSync() {
            appendLog('Sinkronisasi manual server Gist dimulai...');
            await pullStateFromCloudServer();
            renderAll();
            showToast('Sinkronisasi server berhasil!');
        }

        function appendLog(msg) {
            const box = document.getElementById('githubLogContainer');
            if (box) {
                const item = document.createElement('div');
                item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                box.appendChild(item); box.scrollTop = box.scrollHeight;
            }
        }

            const adminEls = document.querySelectorAll('.admin-only');

                adminEls.forEach(el => { el.style.display = isAdmin ? 'flex' : 'none'; el.classList.toggle('admin-only', !isAdmin); });

            const passLabel = document.getElementById('passwordLabel');

            if (m === 'register') {
                nameGrp.classList.remove('hidden');
                credLabel.textContent = 'Email / Nama Akun';
                passLabel.textContent = 'Kata Sandi';
                authTitle.textContent = 'Daftar Akun Pengguna';
                submitBtn.textContent = 'Daftar Sekarang';
            } else if (m === 'login') {
                nameGrp.classList.add('hidden');
                credLabel.textContent = 'Email / Nama Akun';
                passLabel.textContent = 'Kata Sandi';
                authTitle.textContent = 'Masuk Pengguna';
                submitBtn.textContent = 'Masuk Sistem';

        function handleAuthSubmit(e) {
            e.preventDefault();
            const iden = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const name = document.getElementById('regName')?.value.trim() || '';
            const statusMsg = document.getElementById('authStatusMsg');

            if (appState.authMode === 'admin') {
                if (iden.length > 5) {
                    appState.adminToken = iden;
                    appState.currentUser = { name: 'Super Admin', email: 'admin@cloud.io', role: 'admin', joinedAt: '2026-01-01', avatar: '' };
                    saveStateToStorage();
                    showToast('Otorisasi Token Admin Berhasil!');
                    setTimeout(() => location.reload(), 800);
                } else {
                    statusMsg.className = 'text-xs text-center font-medium pt-1 text-rose-400';
                    statusMsg.textContent = '❌ Token Admin tidak valid.';
                    showToast('Token Admin tidak valid', 'error');
                }
                return;
            }

            if (appState.authMode === 'register') {
                const exists = appState.users.find(u => u.email.toLowerCase() === iden.toLowerCase() || u.name.toLowerCase() === iden.toLowerCase());
                if (exists) {
                    statusMsg.className = 'text-xs text-center font-medium pt-1 text-rose-400';
                    statusMsg.textContent = '❌ Akun sudah terdaftar! Silakan masuk.';
                    showToast('Akun sudah terdaftar!', 'error');
                    return;
                }
                const newUser = { name: name || iden, email: iden, password: pass, role: 'user', joinedAt: new Date().toISOString().split('T')[0], avatar: '' };
                appState.users.push(newUser);
                appState.currentUser = newUser;
                saveStateToStorage();
                statusMsg.className = 'text-xs text-center font-medium pt-1 text-emerald-400';
                statusMsg.textContent = '✅ Registrasi sukses! Memuat ulang...';
                showToast('Registrasi berhasil!');
                setTimeout(() => location.reload(), 800);
            } else {
                const u = appState.users.find(x => (x.email.toLowerCase() === iden.toLowerCase() || x.name.toLowerCase() === iden.toLowerCase()) && x.password === pass);
                if (!u) {
                    statusMsg.className = 'text-xs text-center font-medium pt-1 text-rose-400';
                    statusMsg.textContent = '❌ Gagal masuk: Kredensial atau kata sandi salah.';
                    showToast('Gagal masuk!', 'error');
                    return;
                }
                appState.currentUser = u;
                saveStateToStorage();
                statusMsg.className = 'text-xs text-center font-medium pt-1 text-emerald-400';
                statusMsg.textContent = '✅ Berhasil masuk! Memuat ulang...';
                showToast('Berhasil masuk!');
                setTimeout(() => location.reload(), 800);
            }
        }

        function generateHashes() {
            const v = document.getElementById('hashInput').value;
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('sha256Output').textContent = hex;
            });
        }
        function generateSecurePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$";
            let p = ""; for(let i=0; i<14; i++) p += chars.charAt(Math.floor(Math.random()*chars.length));
            document.getElementById('generatedPasswordOutput').value = p;
        }

            if (tbody) {
                tbody.innerHTML = appState.users.map((u, idx) => `
                    <tr class="hover:bg-slate-900">
                        <td class="p-3 font-medium text-white">${u.name}</td>
                        <td class="p-3 text-slate-400">${u.email}</td>
                        <td class="p-3 text-slate-400">${u.joinedAt || '2026-01-01'}</td>
                        <td class="p-3 text-right">
                            <button onclick="adminDeleteUser(${idx})" class="text-rose-400 hover:text-rose-300 p-1.5"><i class="fa-solid fa-trash"></i> Hapus</button>
                        </td>
                    </tr>
                `).join('');
            }
        }
        function adminDeleteUser(idx) {
            if (confirm('Hapus akun ini?')) { appState.users.splice(idx, 1); saveStateToStorage(); showToast('Akun dihapus oleh Admin.'); }
        }
        function resetSystemData() {
            if (confirm('Reset seluruh pengaturan dan data sistem?')) { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(BACKUP_KEY); location.reload(); }
        }
    </script>
</body>
</html>
