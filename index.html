<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Ultimate - All-in-One Platform & AI Workspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e1b4b; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        .glass-panel {
            background: rgba(30, 27, 75, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- AUTH & ONBOARDING MODAL OVERLAY -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl relative border border-brand-500/30">
            <div class="text-center mb-6">
                <div class="inline-flex p-3 bg-brand-600/20 text-brand-400 rounded-2xl mb-3 text-2xl">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-tight text-white">SmartCore Access</h2>
                <p id="authSubtitle" class="text-sm text-slate-400 mt-1">Masuk sebagai Admin atau Daftar Akun Baru</p>
            </div>

            <!-- Tab Switcher Auth -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl mb-6 border border-slate-800">
                <button type="button" onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md">Masuk</button>
                <button type="button" onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">Registrasi</button>
                <button type="button" onclick="switchAuthTab('admin')" id="tabAdminBtn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">Admin</button>
            </div>

            <!-- Auth Forms Container -->
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="nameFieldGroup" class="hidden">
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Nama Lengkap / Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="regName" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="John Doe">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Email / Identitas</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" id="authEmail" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="user@smartcore.io">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Kata Sandi / API Token</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="authPassword" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" class="flex-1 flex flex-col min-h-screen">
        <!-- TOP NAVIGATION BAR -->
        <header class="glass-panel border-b border-slate-800 sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white tracking-wide text-base">SmartCore <span class="text-brand-400 text-xs px-2 py-0.5 bg-brand-500/20 rounded-full border border-brand-500/30">v1.5 All-in-One</span></h1>
                        <p class="text-xs text-slate-400">Social • Tools • GitHub • Gemini AI</p>
                    </div>
                </div>
            </div>

            <!-- Nav Tabs -->
            <nav class="hidden md:flex items-center gap-1 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800">
                <button type="button" onclick="switchTab('social')" id="navSocial" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-globe text-brand-400"></i> Media Sosial
                </button>
                <button type="button" onclick="switchTab('tools')" id="navTools" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-toolbox text-indigo-400"></i> Alat Serbaguna
                </button>
                <button type="button" onclick="switchTab('github')" id="navGithub" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-brands fa-github text-emerald-400"></i> Server GitHub
                </button>
                <button type="button" onclick="switchTab('gemini')" id="navGemini" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-brain text-purple-400"></i> Gemini AI
                </button>
                <button type="button" onclick="switchTab('admin')" id="navAdmin" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2 hidden">
                    <i class="fa-solid fa-shield-halved text-rose-400"></i> Panel Admin
                </button>
            </nav>

            <!-- User Profile & Logout -->
            <div class="flex items-center gap-3">
                <div id="userBadge" class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="currentUsernameDisplay" class="font-medium text-slate-200">Guest</span>
                </div>
                <button type="button" onclick="logoutUser()" title="Keluar / Ganti Akun" class="p-2.5 bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-xl border border-slate-800 transition-all">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- MAIN WORKSPACE CONTAINER -->
        <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
            <div id="workspaceContent" class="space-y-6"></div>
        </main>
    </div>

    <!-- TEMPLATES FOR VIEWS -->
    <template id="templateSocialView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-800">
                    <form onsubmit="handleCreatePost(event)" class="space-y-4">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm border border-brand-500/30">
                                <span id="postAuthorInitial">U</span>
                            </div>
                            <textarea id="postContentInput" rows="3" required class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-brand-500 resize-none" placeholder="Apa yang sedang Anda pikirkan atau bagikan hari ini?"></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
                            <div class="flex items-center gap-2 text-slate-400 text-xs">
                                <label class="cursor-pointer hover:text-brand-400 transition-colors flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 rounded-lg border border-slate-800">
                                    <i class="fa-solid fa-image text-brand-400"></i> Lampirkan Gambar
                                    <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">
                                </label>
                                <span id="imageFileName" class="text-slate-500 italic truncate max-w-xs"></span>
                            </div>
                            <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow-md transition-all flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> Publikasikan
                            </button>
                        </div>
                        <div id="imagePreviewContainer" class="hidden relative mt-2 rounded-xl overflow-hidden max-h-48 border border-slate-800">
                            <img id="postImagePreview" src="" alt="Preview" class="w-full object-cover">
                            <button type="button" onclick="removePostImage()" class="absolute top-2 right-2 p-1.5 bg-slate-900/80 hover:bg-rose-500 text-white rounded-lg transition-colors"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </form>
                </div>
                <div id="postsFeedContainer" class="space-y-4"></div>
            </div>
            <div class="space-y-6">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-fire text-amber-400"></i> Tren & Aktivitas
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800/60">
                            <span class="text-brand-400 font-semibold">#SmartCoreAI</span>
                            <p class="text-slate-400 mt-0.5">Integrasi Gemini AI & GitHub Server aktif!</p>
                        </div>
                    </div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-users text-emerald-400"></i> Komunitas Aktif
                    </h3>
                    <div id="activeUsersList" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateToolsView">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-2">
                <h3 class="font-bold text-white text-sm px-3 py-2 border-b border-slate-800 mb-2">Pilih Alat Serbaguna</h3>
                <button type="button" onclick="switchToolSub('json')" id="toolSubJson" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold bg-brand-600 text-white flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-code w-5"></i> JSON Formatter & Validator
                </button>
                <button type="button" onclick="switchToolSub('base64')" id="toolSubBase64" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-binary w-5"></i> Base64 Encoder / Decoder
                </button>
                <button type="button" onclick="switchToolSub('hash')" id="toolSubHash" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-fingerprint w-5"></i> Generator Hash MD5/SHA
                </button>
                <button type="button" onclick="switchToolSub('markdown')" id="toolSubMarkdown" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900 flex items-center gap-2 transition-all">
                    <i class="fa-brands fa-markdown w-5"></i> Markdown Live Previewer
                </button>
            </div>
            <div class="md:col-span-2 glass-panel p-6 rounded-2xl border border-slate-800">
                <div id="toolPanelJson" class="space-y-4">
                    <h3 class="font-bold text-white text-base">JSON Formatter & Validator</h3>
                    <textarea id="jsonInput" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-white resize-none" placeholder='{"nama": "SmartCore"}'></textarea>
                    <div class="flex gap-2">
                        <button type="button" onclick="formatJSON()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl">Format</button>
                        <button type="button" onclick="minifyJSON()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl">Minify</button>
                        <button type="button" onclick="clearJSON()" class="px-4 py-2 bg-rose-500/20 text-rose-400 text-xs font-semibold rounded-xl ml-auto">Bersihkan</button>
                    </div>
                    <div id="jsonOutputContainer" class="mt-4 hidden">
                        <pre id="jsonOutput" class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-mono text-emerald-400 overflow-x-auto max-h-48"></pre>
                    </div>
                </div>
                <div id="toolPanelBase64" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Base64 Encoder / Decoder</h3>
                    <textarea id="base64Input" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-white resize-none" placeholder="Masukkan teks..."></textarea>
                    <div class="flex gap-2">
                        <button type="button" onclick="encodeBase64()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl">Encode</button>
                        <button type="button" onclick="decodeBase64()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">Decode</button>
                    </div>
                    <textarea id="base64Output" rows="4" readonly class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-xs font-mono text-emerald-400 resize-none" placeholder="Hasil..."></textarea>
                </div>
                <div id="toolPanelHash" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Hash Generator (SHA-256)</h3>
                    <input type="text" id="hashInput" oninput="generateHashes()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white" placeholder="Ketik teks...">
                    <div class="space-y-3 pt-2">
                        <div>
                            <span class="text-xs text-slate-400">SHA-256 Hash:</span>
                            <div id="sha256Output" class="p-2.5 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-mono text-brand-400 break-all">-</div>
                        </div>
                    </div>
                </div>
                <div id="toolPanelMarkdown" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Markdown Previewer</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <textarea id="markdownInput" oninput="renderMarkdownPreview()" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-white resize-none" placeholder="# Judul"></textarea>
                        <div id="markdownPreview" class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl text-xs text-slate-200 overflow-y-auto max-h-52"></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateGithubView">
        <div class="space-y-6">
            <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                        <h3 class="font-bold text-white text-base flex items-center gap-2">
                            <i class="fa-brands fa-github text-emerald-400"></i> Integrasi Server GitHub
                        </h3>
                        <p class="text-xs text-slate-400 mt-1">Kelola repositori dan sinkronisasi berkas index.html.</p>
                    </div>
                    <span id="githubStatusBadge" class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-xs font-semibold">Belum Terhubung</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">GitHub Token (PAT)</label>
                        <input type="password" id="ghToken" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="ghp_...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Owner / Username</label>
                        <input type="text" id="ghOwner" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="username">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Nama Repositori</label>
                        <input type="text" id="ghRepo" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="repo-name">
                    </div>
                </div>
                <div class="flex items-center gap-3 pt-2">
                    <button type="button" onclick="connectGitHub()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition-all flex items-center gap-2">
                        <i class="fa-solid fa-link"></i> Hubungkan
                    </button>
                    <button type="button" onclick="syncToGitHub()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl transition-all flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Push State
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                    <h4 class="font-bold text-white text-sm border-b border-slate-800 pb-2"><i class="fa-solid fa-folder-open text-brand-400"></i> Berkas Repositori</h4>
                    <div id="githubFileList" class="space-y-2 text-xs text-slate-400"><p class="italic">Belum terhubung.</p></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                    <h4 class="font-bold text-white text-sm border-b border-slate-800 pb-2"><i class="fa-solid fa-terminal text-indigo-400"></i> Log Aktivitas</h4>
                    <div id="githubLogContainer" class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl text-xs font-mono text-emerald-400 h-40 overflow-y-auto space-y-1">
                        <div>[System] Menunggu koneksi...</div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="templateGeminiView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="font-bold text-white text-sm border-b border-slate-800 pb-3"><i class="fa-solid fa-brain text-purple-400"></i> Konfigurasi Gemini API</h3>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-slate-300 mb-1">Gemini API Key</label>
                        <div class="flex gap-2">
                            <input type="password" id="geminiApiKey" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="AIzaSy...">
                            <button type="button" onclick="saveGeminiKey()" class="px-3 py-2 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl">Simpan</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1">Model AI</label>
                        <select id="geminiModel" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2 glass-panel p-6 rounded-2xl border border-slate-800 flex flex-col h-[550px]">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <h3 class="font-bold text-white text-base flex items-center gap-2"><i class="fa-solid fa-comments text-purple-400"></i> Gemini AI Workspace</h3>
                    <button type="button" onclick="clearGeminiChat()" class="text-xs text-slate-400 hover:text-rose-400 flex items-center gap-1"><i class="fa-solid fa-trash-can"></i> Bersihkan</button>
                </div>
                <div id="geminiChatMessages" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-purple-600/30 text-purple-400 flex items-center justify-center font-bold text-xs border border-purple-500/30 flex-shrink-0"><i class="fa-solid fa-brain"></i></div>
                        <div class="p-3.5 bg-slate-900 border border-slate-800 rounded-2xl text-xs text-slate-200 max-w-[85%]">Halo! Asisten Gemini AI siap membantu Anda.</div>
                    </div>
                </div>
                <form onsubmit="sendGeminiPrompt(event)" class="flex gap-2 pt-2 border-t border-slate-800">
                    <input type="text" id="geminiPromptInput" required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-600" placeholder="Ketik perintah...">
                    <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-semibold rounded-xl transition-all flex items-center gap-2"><i class="fa-solid fa-paper-plane"></i> Kirim</button>
                </form>
            </div>
        </div>
    </template>

    <template id="templateAdminView">
        <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-brand-600/20 text-brand-400 flex items-center justify-center text-xl"><i class="fa-solid fa-users"></i></div>
                    <div><p class="text-xs text-slate-400">Total Pengguna</p><h4 id="statTotalUsers" class="text-xl font-bold text-white">0</h4></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl"><i class="fa-solid fa-newspaper"></i></div>
                    <div><p class="text-xs text-slate-400">Total Postingan</p><h4 id="statTotalPosts" class="text-xl font-bold text-white">0</h4></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-xl"><i class="fa-solid fa-database"></i></div>
                    <div><p class="text-xs text-slate-400">Penyimpanan</p><h4 id="statStorageSize" class="text-xl font-bold text-white">0 KB</h4></div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-rose-600/20 text-rose-400 flex items-center justify-center text-xl"><i class="fa-solid fa-shield-halved"></i></div>
                    <div><p class="text-xs text-slate-400">Sistem</p><h4 class="text-xl font-bold text-emerald-400">Optimal</h4></div>
                </div>
            </div>
            <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <h3 class="font-bold text-white text-base flex items-center gap-2"><i class="fa-solid fa-user-gear text-rose-400"></i> Manajemen Pengguna</h3>
                    <button type="button" onclick="resetSystemData()" class="px-4 py-2 bg-rose-500/20 text-rose-400 text-xs font-semibold rounded-xl border border-rose-500/30 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Reset Data</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-900 uppercase text-slate-400 font-semibold border-b border-slate-800">
                            <tr><th class="p-3">Nama</th><th class="p-3">Email</th><th class="p-3">Role</th><th class="p-3">Bergabung</th><th class="p-3 text-right">Aksi</th></tr>
                        </thead>
                        <tbody id="adminUsersTableBody" class="divide-y divide-slate-800/60"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- JAVASCRIPT LOGIC ENGINE -->
    <script>
        const STORAGE_KEY = 'SMARTCORE_STATE_V15';
        let appState = {
            currentUser: null,
            currentTab: 'social',
            currentToolSub: 'json',
            authMode: 'login',
            users: [
                { name: 'System Admin', email: 'admin@smartcore.io', password: 'admin', role: 'admin', joinedAt: '2026-01-01' }
            ],
            posts: [
                { id: 1, author: 'System Admin', content: 'Selamat datang di SmartCore All-in-One v1.5!', image: null, likes: 3, comments: [], createdAt: '10:00' }
            ],
            githubConfig: { token: '', owner: '', repo: '', connected: false },
            geminiConfig: { apiKey: '', model: 'gemini-2.5-flash' },
            geminiChat: [{ role: 'model', text: 'Halo! Ada yang bisa saya bantu?' }]
        };

        function saveStateToStorage() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) { console.error(e); }
        }

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) appState = { ...appState, ...JSON.parse(saved) };
            } catch (e) { console.error(e); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromStorage();
            checkAuthStatus();
        });

        function checkAuthStatus() {
            const authModal = document.getElementById('authModal');
            const appWrapper = document.getElementById('appWrapper');
            const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
            const navAdmin = document.getElementById('navAdmin');

            if (!appState.currentUser) {
                authModal.classList.remove('hidden');
                appWrapper.classList.add('blur-sm', 'pointer-events-none');
            } else {
                authModal.classList.add('hidden');
                appWrapper.classList.remove('blur-sm', 'pointer-events-none');
                currentUsernameDisplay.textContent = appState.currentUser.name;
                if (appState.currentUser.role === 'admin') navAdmin.classList.remove('hidden');
                else navAdmin.classList.add('hidden');
                renderAll();
            }
        }

        function switchAuthTab(mode) {
            appState.authMode = mode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const nameGroup = document.getElementById('nameFieldGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnRegister = document.getElementById('tabRegisterBtn');
            const btnAdmin = document.getElementById('tabAdminBtn');

            [btnLogin, btnRegister, btnAdmin].forEach(b => { if(b) b.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all"; });

            if (mode === 'login') {
                if(btnLogin) btnLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white shadow-md";
                title.textContent = "SmartCore Masuk";
                subtitle.textContent = "Masuk menggunakan akun Anda";
                nameGroup.classList.add('hidden');
                document.getElementById('regName').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
            } else if (mode === 'register') {
                if(btnRegister) btnRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white shadow-md";
                title.textContent = "Registrasi Akun";
                subtitle.textContent = "Daftar akun baru";
                nameGroup.classList.remove('hidden');
                document.getElementById('regName').required = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Daftar Akun';
            } else if (mode === 'admin') {
                if(btnAdmin) btnAdmin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-rose-600 text-white shadow-md";
                title.textContent = "Panel Admin";
                subtitle.textContent = "Masuk dengan kredensial Administrator";
                nameGroup.classList.add('hidden');
                document.getElementById('regName').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Masuk Admin';
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const nameEl = document.getElementById('regName');
            const name = nameEl ? nameEl.value.trim() : '';

            if (appState.authMode === 'register') {
                if (appState.users.find(u => u.email === email)) {
                    alert('Email sudah terdaftar!');
                    return;
                }
                const newUser = { name: name || 'Pengguna', email, password, role: 'user', joinedAt: new Date().toISOString().split('T')[0] };
                appState.users.push(newUser);
                appState.currentUser = newUser;
            } else if (appState.authMode === 'login') {
                const user = appState.users.find(u => u.email === email && u.password === password);
                if (!user) { alert('Email atau sandi salah!'); return; }
                appState.currentUser = user;
            } else if (appState.authMode === 'admin') {
                const adminUser = appState.users.find(u => u.role === 'admin' && (u.email === email || u.password === password));
                appState.currentUser = adminUser || { name: 'System Admin', email, role: 'admin', joinedAt: '2026-01-01' };
            }

            saveStateToStorage();
            checkAuthStatus();
            document.getElementById('authForm').reset();
        }

        function logoutUser() {
            if (confirm('Keluar dari sesi?')) {
                appState.currentUser = null;
                saveStateToStorage();
                checkAuthStatus();
            }
        }

        function switchTab(tabName) {
            appState.currentTab = tabName;
            ['Social', 'Tools', 'Github', 'Gemini', 'Admin'].forEach(t => {
                const btn = document.getElementById('nav' + t);
                if (btn) btn.className = "px-4 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/65 transition-all flex items-center gap-2";
            });
            const activeBtn = document.getElementById('nav' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
            if (activeBtn) activeBtn.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-brand-600 text-white transition-all flex items-center gap-2 shadow-md";
            renderAll();
        }

        function renderAll() {
            const workspace = document.getElementById('workspaceContent');
            const template = document.getElementById('template' + appState.currentTab.charAt(0).toUpperCase() + appState.currentTab.slice(1) + 'View');
            if (template && workspace) {
                workspace.innerHTML = '';
                workspace.appendChild(template.content.cloneNode(true));
            }
            if (appState.currentTab === 'social') { renderPostsFeed(); renderActiveUsers(); }
            else if (appState.currentTab === 'tools') { switchToolSub(appState.currentToolSub); }
            else if (appState.currentTab === 'github') {
                if(document.getElementById('ghToken')) document.getElementById('ghToken').value = appState.githubConfig.token;
                if(document.getElementById('ghOwner')) document.getElementById('ghOwner').value = appState.githubConfig.owner;
                if(document.getElementById('ghRepo')) document.getElementById('ghRepo').value = appState.githubConfig.repo;
            } else if (appState.currentTab === 'gemini') {
                if(document.getElementById('geminiApiKey')) document.getElementById('geminiApiKey').value = appState.geminiConfig.apiKey;
                renderGeminiChat();
            } else if (appState.currentTab === 'admin') { renderAdminDashboard(); }
        }

        // Social Logic
        let tempPostImage = null;
        function previewPostImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    tempPostImage = ev.target.result;
                    document.getElementById('postImagePreview').src = tempPostImage;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('imageFileName').textContent = file.name;
                };
                reader.readAsDataURL(file);
            }
        }
        function removePostImage() {
            tempPostImage = null;
            document.getElementById('postImageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageFileName').textContent = '';
        }
        function handleCreatePost(e) {
            e.preventDefault();
            const content = document.getElementById('postContentInput').value.trim();
            if (!content) return;
            appState.posts.unshift({
                id: Date.now(),
                author: appState.currentUser ? appState.currentUser.name : 'Guest',
                content, image: tempPostImage, likes: 0, comments: [],
                createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            saveStateToStorage();
            removePostImage();
            document.getElementById('postContentInput').value = '';
            renderPostsFeed();
        }
        function renderPostsFeed() {
            const container = document.getElementById('postsFeedContainer');
            if (!container) return;
            if (appState.posts.length === 0) {
                container.innerHTML = `<div class="glass-panel p-6 rounded-2xl text-center text-slate-400 text-sm">Belum ada postingan.</div>`;
                return;
            }
            container.innerHTML = appState.posts.map(p => `
                <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm">${p.author.charAt(0).toUpperCase()}</div>
                            <div><h4 class="font-bold text-white text-sm">${p.author}</h4><span class="text-xs text-slate-500">${p.createdAt}</span></div>
                        </div>
                        ${appState.currentUser && (appState.currentUser.role === 'admin' || appState.currentUser.name === p.author) ? `<button onclick="deletePost(${p.id})" class="text-slate-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div>
                    <p class="text-xs text-slate-200 whitespace-pre-wrap">${p.content}</p>
                    ${p.image ? `<div class="rounded-xl overflow-hidden border border-slate-800 max-h-72"><img src="${p.image}" class="w-full object-cover"></div>` : ''}
                    <div class="flex items-center gap-4 pt-3 border-t border-slate-800 text-xs text-slate-400">
                        <button onclick="likePost(${p.id})" class="flex items-center gap-1.5 hover:text-brand-400"><i class="fa-solid fa-heart text-rose-500"></i> ${p.likes} Suka</button>
                    </div>
                </div>
            `).join('');
        }
        function likePost(id) {
            const p = appState.posts.find(x => x.id === id);
            if (p) { p.likes++; saveStateToStorage(); renderPostsFeed(); }
        }
        function deletePost(id) {
            if (confirm('Hapus postingan?')) {
                appState.posts = appState.posts.filter(x => x.id !== id);
                saveStateToStorage();
                renderPostsFeed();
            }
        }
        function renderActiveUsers() {
            const list = document.getElementById('activeUsersList');
            if (!list) return;
            list.innerHTML = appState.users.map(u => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900/80 rounded-xl border border-slate-800">
                    <span class="text-slate-200 text-xs">${u.name} (${u.role})</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                </div>
            `).join('');
        }

        // Tools Logic
        function switchToolSub(sub) {
            appState.currentToolSub = sub;
            ['Json', 'Base64', 'Hash', 'Markdown'].forEach(s => {
                const btn = document.getElementById('toolSub' + s);
                const panel = document.getElementById('toolPanel' + s);
                if (btn && panel) {
                    if (s.toLowerCase() === sub) {
                        btn.className = "w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold bg-brand-600 text-white flex items-center gap-2 shadow-md";
                        panel.classList.remove('hidden');
                    } else {
                        btn.className = "w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-900 flex items-center gap-2";
                        panel.classList.add('hidden');
                    }
                }
            });
        }
        function formatJSON() {
            try {
                const res = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(res, null, 2);
                document.getElementById('jsonOutputContainer').classList.remove('hidden');
            } catch (e) { alert('JSON Invalid: ' + e.message); }
        }
        function minifyJSON() {
            try {
                const res = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(res);
                document.getElementById('jsonOutputContainer').classList.remove('hidden');
            } catch (e) { alert('JSON Invalid: ' + e.message); }
        }
        function clearJSON() { document.getElementById('jsonInput').value = ''; document.getElementById('jsonOutputContainer').classList.add('hidden'); }
        function encodeBase64() { try { document.getElementById('base64Output').value = btoa(document.getElementById('base64Input').value); } catch(e){} }
        function decodeBase64() { try { document.getElementById('base64Output').value = atob(document.getElementById('base64Input').value); } catch(e){} }
        function generateHashes() {
            const val = document.getElementById('hashInput').value;
            if(!val) { document.getElementById('sha256Output').textContent = '-'; return; }
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('sha256Output').textContent = hex;
            });
        }
        function renderMarkdownPreview() {
            const val = document.getElementById('markdownInput').value;
            document.getElementById('markdownPreview').innerHTML = val.replace(/^# (.*$)/gim, '<h1 class="text-sm font-bold text-white">$1</h1>').replace(/\n/g, '<br>');
        }

        // GitHub Logic
        function appendGithubLog(msg) {
            const c = document.getElementById('githubLogContainer');
            if(c) { c.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`; c.scrollTop = c.scrollHeight; }
        }
        async function connectGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            if(!token || !owner || !repo) { alert('Lengkapi kolom GitHub!'); return; }
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: { 'Authorization': `token ${token}` } });
                if(!res.ok) throw new Error('Repo tidak ditemukan.');
                appState.githubConfig = { token, owner, repo, connected: true };
                saveStateToStorage();
                document.getElementById('githubStatusBadge').className = "px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-xs font-semibold";
                document.getElementById('githubStatusBadge').textContent = "Terhubung";
                appendGithubLog('Koneksi berhasil.');
            } catch(e) { alert(e.message); appendGithubLog('Error: ' + e.message); }
        }
        function syncToGitHub() { alert('Sinkronisasi simulasi siap dijalankan.'); }

        // Gemini AI Logic
        function saveGeminiKey() {
            const key = document.getElementById('geminiApiKey').value.trim();
            if(!key) { alert('API Key kosong!'); return; }
            appState.geminiConfig.apiKey = key;
            saveStateToStorage();
            alert('API Key tersimpan!');
        }
        function clearGeminiChat() {
            appState.geminiChat = [{ role: 'model', text: 'Chat dibersihkan.' }];
            saveStateToStorage();
            renderGeminiChat();
        }
        function renderGeminiChat() {
            const c = document.getElementById('geminiChatMessages');
            if(!c) return;
            c.innerHTML = appState.geminiChat.map(m => `
                <div class="flex items-start ${m.role === 'user' ? 'justify-end' : ''} gap-3">
                    <div class="p-3.5 ${m.role === 'user' ? 'bg-brand-600/30' : 'bg-slate-900'} border border-slate-800 rounded-2xl text-xs text-slate-200 max-w-[85%]">${m.text}</div>
                </div>
            `).join('');
            c.scrollTop = c.scrollHeight;
        }
        async function sendGeminiPrompt(e) {
            e.preventDefault();
            const input = document.getElementById('geminiPromptInput');
            const txt = input.value.trim();
            if(!txt || !appState.geminiConfig.apiKey) { alert('Masukkan API Key dan prompt.'); return; }
            appState.geminiChat.push({ role: 'user', text: txt });
            input.value = '';
            renderGeminiChat();
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${appState.geminiConfig.model}:generateContent?key=${appState.geminiConfig.apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: txt }] }] })
                });
                const data = await res.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Gagal memproses respons.';
                appState.geminiChat.push({ role: 'model', text: reply });
            } catch(err) {
                appState.geminiChat.push({ role: 'model', text: 'Error jaringan: ' + err.message });
            }
            saveStateToStorage();
            renderGeminiChat();
        }

        // Admin Dashboard
        function renderAdminDashboard() {
            document.getElementById('statTotalUsers').textContent = appState.users.length;
            document.getElementById('statTotalPosts').textContent = appState.posts.length;
            let bytes = 0; for(let k in localStorage) bytes += localStorage[k].length * 2;
            document.getElementById('statStorageSize').textContent = (bytes / 1024).toFixed(1) + ' KB';
            const tbody = document.getElementById('adminUsersTableBody');
            if(tbody) {
                tbody.innerHTML = appState.users.map((u, i) => `
                    <tr class="hover:bg-slate-900/50">
                        <td class="p-3">${u.name}</td>
                        <td class="p-3 text-slate-400">${u.email}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] bg-brand-500/20 text-brand-400">${u.role}</span></td>
                        <td class="p-3 text-slate-400">${u.joinedAt || '-'}</td>
                        <td class="p-3 text-right">${u.role !== 'admin' ? `<button onclick="deleteUser(${i})" class="text-rose-400"><i class="fa-solid fa-trash"></i></button>` : '-'}</td>
                    </tr>
                `).join('');
            }
        }
        function deleteUser(i) {
            if(confirm('Hapus pengguna?')) { appState.users.splice(i, 1); saveStateToStorage(); renderAdminDashboard(); }
        }
        function resetSystemData() {
            if(confirm('Reset semua data aplikasi?')) { localStorage.clear(); location.reload(); }
        }
    </script>
</body>
</html>
