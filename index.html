<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Ultimate - All-in-One Platform v3.2 Cloud</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }
        .admin-only { display: none !important; visibility: hidden !important; }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
        .sync-pulse { animation: pulseGlow 2s infinite; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body id="appBody" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- AUTH & ONBOARDING MODAL OVERLAY -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative border border-brand-500/40">
            <div class="text-center mb-6">
                <div class="inline-flex p-3.5 bg-brand-600/20 text-brand-400 rounded-2xl mb-3 text-2xl border border-brand-500/30 shadow-inner">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-tight text-white">SmartCore Cloud</h2>
                <p id="authSubtitle" class="text-sm text-slate-400 mt-1">Data tersimpan terpusat di Server GitHub Admin</p>
            </div>

            <!-- Tab Switcher Auth -->
            <div id="authTabSwitcher" class="flex bg-slate-900/90 p-1.5 rounded-2xl mb-6 border border-slate-800">
                <button type="button" onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2 text-xs font-semibold rounded-xl bg-brand-600 text-white transition-all shadow-md">Masuk</button>
                <button type="button" onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all">Registrasi</button>
                <button type="button" onclick="switchAuthTab('admin')" id="tabAdminBtn" class="flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all">Admin</button>
            </div>

            <!-- Auth Forms Container -->
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="nameFieldGroup" class="hidden">
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="regName" class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="John Doe">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">Email / Identitas</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" id="authEmail" required class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="user@smartcore.io">
                    </div>
                </div>

                <div id="passwordFieldGroup">
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="authPassword" required class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Cloud
                </button>

                <div class="text-center pt-2">
                    <button type="button" onclick="switchAuthTab('recovery')" class="text-xs text-brand-400 hover:underline">Lupa kata sandi / Sinkronisasi Manual?</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" class="flex-1 flex flex-col min-h-screen">
        <!-- TOP NAVIGATION BAR -->
        <header class="glass-panel border-b border-slate-800 sticky top-0 z-40 px-4 lg:px-8 py-3.5 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brand-500/20">
                        <i class="fa-solid fa-cloud"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white tracking-wide text-base flex items-center gap-2">
                            SmartCore <span class="text-brand-400 text-[10px] px-2 py-0.5 bg-brand-500/20 rounded-full border border-brand-500/30 font-semibold">v3.2 Cloud</span>
                        </h1>
                        <p class="text-[11px] text-slate-400">Server GitHub Admin Connected</p>
                    </div>
                </div>
            </div>

            <!-- Sorted Navigation Bar -->
            <nav class="hidden 2xl:flex items-center gap-1 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800/80">
                <button type="button" onclick="switchTab('overview')" id="navOverview" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-pie text-brand-400"></i> Overview
                </button>
                <button type="button" onclick="switchTab('social')" id="navSocial" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-globe text-indigo-400"></i> Sosial
                </button>
                <button type="button" onclick="switchTab('gemini')" id="navGemini" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-brain text-purple-400"></i> AI Chat
                </button>
                <button type="button" onclick="switchTab('finance')" id="navFinance" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-wallet text-emerald-400"></i> Keuangan
                </button>
                <button type="button" onclick="switchTab('time')" id="navTime" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-clock text-amber-400"></i> Waktu
                </button>
                <button type="button" onclick="switchTab('tools')" id="navTools" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-toolbox text-cyan-400"></i> Tools
                </button>
                <button type="button" onclick="switchTab('feeds')" id="navFeeds" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-rss text-blue-400"></i> Berita
                </button>
                <button type="button" onclick="switchTab('fun')" id="navFun" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-gamepad text-fuchsia-400"></i> Hiburan
                </button>
                <button type="button" onclick="switchTab('profile')" id="navProfile" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-user-gear text-pink-400"></i> Profil & Kostumisasi
                </button>
                <!-- ADMIN NAV BUTTON -->
                <button type="button" onclick="switchTab('admin')" id="navAdmin" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5 admin-only">
                    <i class="fa-solid fa-shield-halved text-rose-400"></i> Admin Panel
                </button>
            </nav>

            <!-- User Profile & Logout -->
            <div class="flex items-center gap-3">
                <div id="userBadge" class="hidden sm:flex items-center gap-2.5 px-3.5 py-2 bg-slate-900 rounded-xl border border-slate-800 text-xs shadow-inner">
                    <div id="headerUserAvatar" class="w-6 h-6 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-[10px] overflow-hidden">U</div>
                    <span id="currentUsernameDisplay" class="font-medium text-slate-200">Guest</span>
                </div>
                <button type="button" onclick="logoutUser()" title="Keluar Sesi" class="p-2.5 bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-xl border border-slate-800 transition-all shadow-sm">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- SUB NAV BAR FOR SMALLER SCREENS -->
        <div class="2xl:hidden bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex items-center gap-2 overflow-x-auto">
            <button type="button" onclick="switchTab('overview')" id="navOverviewMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-brand-600 text-white flex-shrink-0">Overview</button>
            <button type="button" onclick="switchTab('social')" id="navSocialMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Sosial</button>
            <button type="button" onclick="switchTab('gemini')" id="navGeminiMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">AI Chat</button>
            <button type="button" onclick="switchTab('finance')" id="navFinanceMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Keuangan</button>
            <button type="button" onclick="switchTab('time')" id="navTimeMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Waktu</button>
            <button type="button" onclick="switchTab('tools')" id="navToolsMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Tools</button>
            <button type="button" onclick="switchTab('feeds')" id="navFeedsMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Berita</button>
            <button type="button" onclick="switchTab('fun')" id="navFunMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Hiburan</button>
            <button type="button" onclick="switchTab('profile')" id="navProfileMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Profil</button>
            <button type="button" onclick="switchTab('admin')" id="navAdminMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0 admin-only">Admin</button>
        </div>

        <!-- MAIN WORKSPACE CONTAINER -->
        <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
            <div id="workspaceContent" class="space-y-6">
                <div class="glass-panel p-10 rounded-3xl text-center space-y-4 shadow-2xl border border-brand-500/20">
                    <div class="inline-flex p-4 bg-brand-500/10 text-brand-400 rounded-full text-3xl animate-bounce">
                        <i class="fa-solid fa-spinner animate-spin"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-white">Menghubungkan ke Server GitHub Cloud v3.2...</h3>
                </div>
            </div>
        </main>
    </div>

    <!-- TEMPLATES FOR VIEWS -->

    <!-- 0. OVERVIEW VIEW -->
    <template id="templateOverviewView">
        <div class="space-y-6">
            <div class="glass-panel p-8 rounded-3xl border border-slate-800/80 shadow-2xl relative overflow-hidden bg-gradient-to-r from-brand-900/30 via-slate-900/80 to-indigo-950/40">
                <div class="relative z-10 space-y-3">
                    <span class="px-3 py-1 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/30 text-xs font-semibold">Dashboard Cloud v3.2</span>
                    <h2 id="overviewWelcomeTitle" class="text-3xl font-bold text-white tracking-tight">Selamat Datang Kembali!</h2>
                    <p class="text-sm text-slate-300 max-w-xl">Platform tersinkronisasi penuh secara cloud ke server GitHub admin dengan penanganan konflik otomatis.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 shadow-xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-brand-600/20 text-brand-400 flex items-center justify-center text-xl border border-brand-500/30"><i class="fa-solid fa-wallet"></i></div>
                    <div><p class="text-xs text-slate-400 font-medium">Saldo Keuangan</p><h4 id="overviewBalance" class="text-lg font-bold text-white mt-0.5">Rp 0</h4></div>
                </div>
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 shadow-xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-xl border border-purple-500/30"><i class="fa-solid fa-brain"></i></div>
                    <div><p class="text-xs text-slate-400 font-medium">Universal AI</p><h4 class="text-lg font-bold text-emerald-400 mt-0.5">Cloud Connected</h4></div>
                </div>
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 shadow-xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-cyan-600/20 text-cyan-400 flex items-center justify-center text-xl border border-cyan-500/30"><i class="fa-solid fa-list-check"></i></div>
                    <div><p class="text-xs text-slate-400 font-medium">Agenda Hari Ini</p><h4 id="overviewTaskCount" class="text-lg font-bold text-white mt-0.5">0 Tugas</h4></div>
                </div>
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 shadow-xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-xl border border-emerald-500/30"><i class="fa-solid fa-cloud"></i></div>
                    <div><p class="text-xs text-slate-400 font-medium">Server Status</p><h4 class="text-lg font-bold text-emerald-400 mt-0.5">GitHub Active</h4></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-panel p-6 lg:p-8 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <h3 class="font-bold text-white text-base border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-bolt text-brand-400"></i> Jalan Pintas Cepat</h3>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <button type="button" onclick="switchTab('gemini')" class="p-4 bg-slate-900/90 hover:bg-slate-800 rounded-2xl border border-slate-800 text-left transition-all shadow-sm"><i class="fa-solid fa-comments text-purple-400 text-lg mb-2 block"></i><span class="font-bold text-white block">Tanya AI Chat</span><span class="text-[10px] text-slate-400">Universal API & Hybrid</span></button>
                        <button type="button" onclick="switchTab('finance')" class="p-4 bg-slate-900/90 hover:bg-slate-800 rounded-2xl border border-slate-800 text-left transition-all shadow-sm"><i class="fa-solid fa-wallet text-emerald-400 text-lg mb-2 block"></i><span class="font-bold text-white block">Catat Keuangan</span><span class="text-[10px] text-slate-400">Kelola pemasukan/pengeluaran</span></button>
                        <button type="button" onclick="switchTab('tools')" class="p-4 bg-slate-900/90 hover:bg-slate-800 rounded-2xl border border-slate-800 text-left transition-all shadow-sm"><i class="fa-solid fa-toolbox text-cyan-400 text-lg mb-2 block"></i><span class="font-bold text-white block">Dev Tools & Mindmap</span><span class="text-[10px] text-slate-400">Format JSON, Base64, dll</span></button>
                        <button type="button" onclick="switchTab('profile')" class="p-4 bg-slate-900/90 hover:bg-slate-800 rounded-2xl border border-slate-800 text-left transition-all shadow-sm"><i class="fa-solid fa-user-gear text-pink-400 text-lg mb-2 block"></i><span class="font-bold text-white block">Kostumisasi & Profil</span><span class="text-[10px] text-slate-400">Atur tema & foto akun</span></button>
                    </div>
                </div>

                <div class="glass-panel p-6 lg:p-8 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <h3 class="font-bold text-white text-base border-b border-slate-800 pb-3 flex items-center gap-2"><i class="fa-solid fa-rss text-cyan-400"></i> Berita & Pembaruan v3.2</h3>
                    <div class="space-y-3 text-xs">
                        <div class="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800/80 shadow-sm">
                            <span class="text-brand-400 font-semibold">Anti-Conflict GitHub Sync v3.2</span>
                            <p class="text-slate-400 mt-1">Perbaikan error 409 Conflict dengan mekanisme auto-retry dan pembaharuan SHA real-time sebelum unggah data cloud.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- 1. SOCIAL VIEW -->
    <template id="templateSocialView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass-panel p-6 rounded-3xl shadow-xl border border-slate-800/80">
                    <form onsubmit="handleCreatePost(event)" class="space-y-4">
                        <div class="flex items-start gap-3.5">
                            <div id="postAuthorAvatarContainer" class="w-11 h-11 rounded-2xl bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm border border-brand-500/30 flex-shrink-0 shadow-inner overflow-hidden">
                                <span id="postAuthorInitial">U</span>
                            </div>
                            <textarea id="postContentInput" rows="3" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-brand-500 resize-none shadow-inner" placeholder="Bagikan momen atau ide menarik hari ini..."></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/80">
                            <div class="flex items-center gap-2 text-slate-400 text-xs">
                                <label class="cursor-pointer hover:text-brand-400 transition-colors flex items-center gap-2 px-3.5 py-2 bg-slate-900/90 rounded-xl border border-slate-800 shadow-sm">
                                    <i class="fa-solid fa-image text-brand-400"></i> Lampirkan Gambar
                                    <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">
                                </label>
                                <span id="imageFileName" class="text-slate-500 italic truncate max-w-xs"></span>
                            </div>
                            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> Publikasikan Cloud
                            </button>
                        </div>
                        <div id="imagePreviewContainer" class="hidden relative mt-3 rounded-2xl overflow-hidden max-h-56 border border-slate-800 shadow-md">
                            <img id="postImagePreview" src="" alt="Preview" class="w-full object-cover">
                            <button type="button" onclick="removePostImage()" class="absolute top-3 right-3 p-2 bg-slate-900/90 hover:bg-rose-500 text-white rounded-xl transition-colors shadow-lg"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </form>
                </div>
                <div id="postsFeedContainer" class="space-y-4">
                    <div class="glass-panel p-8 rounded-3xl text-center text-slate-400 text-sm shadow-xl">Memuat linimasa cloud...</div>
                </div>
            </div>
            <div class="space-y-6">
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-fire text-amber-400"></i> Tren v3.2
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div class="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800/80 shadow-sm">
                            <span class="text-brand-400 font-semibold">#NoMore409</span>
                            <p class="text-slate-400 mt-1">Sinkronisasi GitHub stabil tanpa error konflik versi!</p>
                        </div>
                    </div>
                </div>
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-users text-emerald-400"></i> Online Cloud
                    </h3>

    <!-- JAVASCRIPT STATE ENGINE & CLOUD GITHUB SYNC -->
    <script>
        const STORAGE_KEY = 'SMARTCORE_STATE_V32';

        let appState = {
            currentUser: null,
            currentTab: 'overview',
            currentToolSub: 'json',
            authMode: 'login',
            users: [
                { name: 'System Admin', email: 'admin@smartcore.io', password: 'admin', role: 'admin', joinedAt: '2026-01-01', avatar: '' },
                { name: 'Danis User', email: 'danis@smartcore.io', password: 'user', role: 'user', joinedAt: '2026-06-01', avatar: '' }
            ],
            posts: [
                { id: 1, author: 'System Admin', content: 'Selamat datang di SmartCore Ultimate v3.2 Cloud! Error 409 Conflict diatasi secara otomatis.', image: null, likes: 98, comments: [], createdAt: '04:15' }
            ],
            financeTransactions: [
                { id: 1, date: '2026-06-01', desc: 'Gaji Proyek Cloud', amount: 10000000, type: 'income' },
                { id: 2, date: '2026-06-04', desc: 'Server GitHub Hosting', amount: 500000, type: 'expense' }
            ],
            tasks: [
                { id: 1, text: 'Verifikasi Server GitHub Cloud v3.2', completed: true }
            ],
            alarms: [
                { id: 1, time: '08:00', label: 'Rapat Cloud Tim', active: true }
            ],
            mindMapNodes: [
                { id: 1, text: 'Centralized GitHub Server Storage' },
                { id: 2, text: 'Auto-Retry Conflict Prevention (409)' }
            ],
            userPreferences: {
                accentColor: 'indigo',
                soundEnabled: 'enabled',
                layoutMode: 'normal'
            },
            githubConfig: { token: '', owner: '', repo: '', connected: false },
            aiConfig: { 
                geminiApiKey: '', 
                chatgptApiKey: '' 
            },
            aiChat: [
                { role: 'model', text: 'Halo! Cloud AI Chat siap membantu Anda dengan sinkronisasi stabil.' }
            ]
        };

        // --- ENCRYPTION & SECURITY HELPERS ---
        function encryptData(text) {
            if (!text) return '';
            try { return btoa(encodeURIComponent(text)); } catch(e) { return text; }
        }
        function decryptData(encoded) {
            if (!encoded) return '';
            try { return decodeURIComponent(atob(encoded)); } catch(e) { return encoded; }
        }

        // --- MODERN TOAST NOTIFICATION SYSTEM ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-3 toast-animate border ${
                type === 'success' ? 'bg-emerald-950/90 text-emerald-300 border-emerald-500/40' :
                type === 'error' ? 'bg-rose-950/90 text-rose-300 border-rose-500/40' :
                'bg-slate-900/90 text-slate-200 border-slate-700'
            }`;
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-info text-cyan-400';
            toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- CLOUD GITHUB SERVER STORAGE SYNC (ANTI-CONFLICT v3.2) ---
        async function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                await pushStateToGitHubServer();
            } catch (e) {
                console.error('Cloud sync error:', e);
            }
        }

        async function pushStateToGitHubServer(retryCount = 2) {
            const config = appState.githubConfig;
            const decryptedToken = decryptData(config.token);
            if (!config || !decryptedToken || !config.owner || !config.repo) {
                appendGitHubLog('[Cloud Sync] Menunggu konfigurasi GitHub Admin diatur...');
                return;
            }

            try {
                const path = 'smartcore_cloud_database.json';
                
                // Ambil SHA terbaru tepat sebelum melakukan PUT untuk menghindari 409 Conflict
                let sha = '';
                const getRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
                    headers: { 'Authorization': `token ${decryptedToken}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-cache'
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(appState, null, 2))));
                const putRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${decryptedToken}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `[SmartCore Cloud Auto-Sync] Update database state (${new Date().toLocaleTimeString()})`,
                        content: contentEncoded,
                        sha: sha ? sha : undefined
                    })
                });

                if (putRes.ok) {
                    appendGitHubLog(`[Cloud Sync] ✅ Data berhasil diunggah & diamankan ke server GitHub.`);
                } else if (putRes.status === 409 && retryCount > 0) {
                    appendGitHubLog(`[Cloud Sync] ⚠️ Terdeteksi conflict (409), mengambil SHA terbaru & mencoba ulang...`);
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    await pushStateToGitHubServer(retryCount - 1);
                } else {
                    appendGitHubLog(`[Cloud Sync] ⚠️ Respon server GitHub: ${putRes.status}`);
                }
            } catch (err) {
                appendGitHubLog(`[Cloud Sync] 🔄 Menggunakan cache lokal (Koneksi server cloud tertunda)`);
            }
        }

        async function pullStateFromGitHubServer() {
            const config = appState.githubConfig;
            const decryptedToken = decryptData(config.token);
            if (!config || !decryptedToken || !config.owner || !config.repo) return;

            appendGitHubLog(`[Cloud Pull] Mengambil data terbaru dari server GitHub (${config.owner}/${config.repo})...`);
            try {
                const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/smartcore_cloud_database.json`, {
                    headers: { 'Authorization': `token ${decryptedToken}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-cache'
                });
                if (res.ok) {
                    const data = await res.json();
                    const decodedJson = decodeURIComponent(escape(atob(data.content)));
                    const cloudState = JSON.parse(decodedJson);
                    if (cloudState && cloudState.users) {
                        appState = { ...appState, ...cloudState };
                        appendGitHubLog(`[Cloud Pull] ✅ Berhasil menyinkronkan data pengguna dari server cloud.`);
                        renderAll();
                    }
                }
            } catch (err) {
                appendGitHubLog(`[Cloud Pull] Menggunakan state lokal/cache saat ini.`);
            }
        }

        function appendGitHubLog(message) {
            const container = document.getElementById('githubLogContainer');
            if (container) {
                const logItem = document.createElement('div');
                logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                container.appendChild(logItem);
                container.scrollTop = container.scrollHeight;
            }
        }

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error('Gagal memuat state lokal:', e);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            loadStateFromStorage();
            await pullStateFromGitHubServer();
            applyUserPreferences();
            checkAuthStatus();
            setInterval(checkAlarms, 10000);
            
            // Background worker cloud sync otomatis setiap 30 detik untuk menghindari frekuensi berlebih
            setInterval(() => {
                pushStateToGitHubServer();
            }, 30000);
        });

        function applyUserPreferences() {
            const prefs = appState.userPreferences || { accentColor: 'indigo', soundEnabled: 'enabled', layoutMode: 'normal' };
            const body = document.getElementById('appBody');
            if (prefs.layoutMode === 'compact') {
                body.classList.add('text-xs');
            } else {
                body.classList.remove('text-xs');
            }
        }

        function checkAuthStatus() {
            const authModal = document.getElementById('authModal');
            const appWrapper = document.getElementById('appWrapper');
            const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
            const headerUserAvatar = document.getElementById('headerUserAvatar');
            const adminElements = document.querySelectorAll('.admin-only');

            if (!appState.currentUser) {
                authModal.classList.remove('hidden');
                appWrapper.classList.add('blur-sm', 'pointer-events-none');
            } else {
                authModal.classList.add('hidden');
                appWrapper.classList.remove('blur-sm', 'pointer-events-none');
                currentUsernameDisplay.textContent = appState.currentUser.name;

                if (appState.currentUser.avatar) {
                    headerUserAvatar.innerHTML = `<img src="${appState.currentUser.avatar}" class="w-full h-full object-cover">`;
                } else {
                    headerUserAvatar.textContent = appState.currentUser.name.charAt(0).toUpperCase();
                }

                const isAdmin = appState.currentUser.role === 'admin';
                adminElements.forEach(el => {
                    if (isAdmin) {
                        el.style.display = 'flex';
                        el.classList.remove('admin-only');
                    } else {
                        el.style.display = 'none';
                        el.classList.add('admin-only');
                    }
                });

                if (!isAdmin && appState.currentTab === 'admin') {
                    appState.currentTab = 'overview';
                }

                const initialEl = document.getElementById('postAuthorInitial');
                if (initialEl) {
                    if (appState.currentUser.avatar) {
                        document.getElementById('postAuthorAvatarContainer').innerHTML = `<img src="${appState.currentUser.avatar}" class="w-full h-full object-cover">`;
                    } else {
                        initialEl.textContent = appState.currentUser.name.charAt(0).toUpperCase();
                    }
                }
                
                switchTab(appState.currentTab, false);
            }
        }

        function switchAuthTab(mode) {
            appState.authMode = mode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const nameGroup = document.getElementById('nameFieldGroup');
            const passGroup = document.getElementById('passwordFieldGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnRegister = document.getElementById('tabRegisterBtn');
            const btnAdmin = document.getElementById('tabAdminBtn');
            const tabSwitcher = document.getElementById('authTabSwitcher');

            [btnLogin, btnRegister, btnAdmin].forEach(b => {
                if(b) b.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
            });

            if (mode === 'recovery') {
                if(tabSwitcher) tabSwitcher.classList.add('hidden');
                if(title) title.textContent = "Sinkronisasi Cloud";
                if(subtitle) subtitle.textContent = "Masukkan email untuk menarik data cloud server";
                if(nameGroup) nameGroup.classList.add('hidden');
                if(passGroup) passGroup.classList.add('hidden');
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Tarik Data Cloud';
                return;
            } else {
                if(tabSwitcher) tabSwitcher.classList.remove('hidden');
                if(passGroup) passGroup.classList.remove('hidden');
            }

            if (mode === 'login') {
                if(btnLogin) btnLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md";
                if(title) title.textContent = "SmartCore Cloud Masuk";
                if(subtitle) subtitle.textContent = "Data terhubung langsung ke server GitHub";
                if(nameGroup) nameGroup.classList.add('hidden');
                document.getElementById('regName').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Cloud';
            } else if (mode === 'register') {
                if(btnRegister) btnRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md";
                if(title) title.textContent = "Registrasi Akun Cloud";
                if(subtitle) subtitle.textContent = "Akun langsung tersimpan permanen di server admin";
                if(nameGroup) nameGroup.classList.remove('hidden');
                document.getElementById('regName').required = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Daftar ke Cloud';
            } else if (mode === 'admin') {
                if(btnAdmin) btnAdmin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-rose-600 text-white transition-all shadow-md";
                if(title) title.textContent = "Panel Akses Admin";
                if(subtitle) subtitle.textContent = "Masuk dengan kredensial Administrator";
                if(nameGroup) nameGroup.classList.add('hidden');
                document.getElementById('regName').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Masuk Admin';
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            await pullStateFromGitHubServer();

            if (appState.authMode === 'recovery') {
                const user = appState.users.find(u => u.email === email);
                if (!user) { showToast('Email tidak ditemukan di cloud server!', 'error'); return; }
                showToast(`Data cloud ditemukan untuk ${email}. Sandi: ${user.password}`, 'success');
                switchAuthTab('login');
                return;
            }

            const nameEl = document.getElementById('regName');
            const name = nameEl ? nameEl.value.trim() : '';

            if (appState.authMode === 'register') {
                const existing = appState.users.find(u => u.email === email);
                if (existing) { showToast('Email sudah terdaftar di cloud server!', 'error'); return; }
                const newUser = { name: name || 'Pengguna Baru', email, password, role: 'user', joinedAt: new Date().toISOString().split('T')[0], avatar: '' };
                appState.users.push(newUser);
                appState.currentUser = newUser;
                await saveStateToStorage();
                showToast('Registrasi berhasil tersimpan di server GitHub!', 'success');
            } else if (appState.authMode === 'login') {
                const user = appState.users.find(u => u.email === email && u.password === password);
                if (!user) { showToast('Email atau kata sandi salah!', 'error'); return; }
                appState.currentUser = user;
                showToast('Berhasil masuk dari cloud server!', 'success');
            } else if (appState.authMode === 'admin') {
                const adminUser = appState.users.find(u => u.role === 'admin' && (u.email === email || u.password === password));
                if (!adminUser && password !== 'admin') { showToast('Kredensial Admin tidak valid!', 'error'); return; }
                appState.currentUser = adminUser || { name: 'System Admin', email, role: 'admin', joinedAt: '2026-01-01', avatar: '' };
                showToast('Berhasil masuk sebagai Admin!', 'success');
            }

            appState.currentTab = 'overview';
            checkAuthStatus();
            document.getElementById('authForm').reset();
        }

        function logoutUser() {
            if (confirm('Keluar dari sesi saat ini?')) {
                appState.currentUser = null;
                saveStateToStorage();
                checkAuthStatus();
                showToast('Sesi diakhiri.', 'info');
            }
        }

        function encodeBase64() {
            try {
                document.getElementById('base64Output').value = btoa(unescape(encodeURIComponent(document.getElementById('base64Input').value)));
                showToast('Berhasil di-encode ke Base64', 'success');
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        }
        function decodeBase64() {
            try {
                document.getElementById('base64Output').value = decodeURIComponent(escape(atob(document.getElementById('base64Input').value)));
                showToast('Berhasil di-decode dari Base64', 'success');
            } catch(e) { showToast('Base64 invalid', 'error'); }
        }
        function generateHashes() {
            const val = document.getElementById('hashInput').value;
            document.getElementById('hashLengthOutput').textContent = val.length + ' Karakter';
            if(!val) { document.getElementById('sha256Output').textContent = '-'; return; }
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('sha256Output').textContent = hex;
            });
        }
        function generateSecurePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('generatedPasswordOutput').value = pass;
            showToast('Sandi aman digenerate!', 'success');
        }

        function handleFinanceSubmit(e) {
            e.preventDefault();

            const desc = document.getElementById('finDesc').value.trim();
            const amount = parseFloat(document.getElementById('finAmount').value);
            const type = document.getElementById('finType').value;
            if(!desc || isNaN(amount)) return;

            if (editId) {
                const item = appState.financeTransactions.find(x => x.id == editId);
                if(item) { item.desc = desc; item.amount = amount; item.type = type; }
                showToast('Transaksi cloud diperbarui!', 'success');
            } else {
                appState.financeTransactions.unshift({
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    desc, amount, type
                });
                showToast('Transaksi disimpan ke server GitHub!', 'success');
            }
            saveStateToStorage();
            resetFinanceForm();
            renderFinanceView();
        }

        }

        // --- TIME, POMODORO & ALARMS ---
        let pomodoroTimer = null;
        let pomodoroSeconds = 25 * 60;
        let isPomodoroRunning = false;
        function updatePomodoroDisplay() {
            const m = Math.floor(pomodoroSeconds / 60).toString().padStart(2, '0');
            const s = (pomodoroSeconds % 60).toString().padStart(2, '0');
            const el = document.getElementById('pomodoroDisplay');
            if(el) el.textContent = `${m}:${s}`;
        }
        function startPomodoro() {
            if(isPomodoroRunning) return;
            isPomodoroRunning = true;
            pomodoroTimer = setInterval(() => {
                if(pomodoroSeconds > 0) {
                    pomodoroSeconds--;
                    updatePomodoroDisplay();
                } else {
                    clearInterval(pomodoroTimer);
                    isPomodoroRunning = false;
                    showToast('Waktu Pomodoro selesai!', 'success');
                }
            }, 1000);
        }
        function pausePomodoro() {
            clearInterval(pomodoroTimer);
            isPomodoroRunning = false;
        }
        function resetPomodoro() {
            clearInterval(pomodoroTimer);
            isPomodoroRunning = false;
            pomodoroSeconds = 25 * 60;
            updatePomodoroDisplay();
        }

        function handleAddAlarm(e) {
            e.preventDefault();
            const time = document.getElementById('alarmTimeInput').value;
            const label = document.getElementById('alarmLabelInput').value.trim();
            if(!time || !label) return;
            appState.alarms.push({ id: Date.now(), time, label, active: true });
            saveStateToStorage();
            renderAlarms();
            e.target.reset();
            showToast('Alarm disimpan ke server!', 'success');
        }
        function deleteAlarm(id) {
            appState.alarms = appState.alarms.filter(x => x.id !== id);
            saveStateToStorage();
            renderAlarms();
            showToast('Alarm dihapus.', 'info');
        }
        function renderAlarms() {
            const container = document.getElementById('alarmListContainer');
            if(!container) return;
            if(appState.alarms.length === 0) {
                container.innerHTML = '<p class="text-[11px] text-slate-500 italic">Belum ada alarm.</p>';
                return;
            }
            container.innerHTML = appState.alarms.map(a => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900/90 rounded-xl border border-slate-800 text-xs">
                    <div><span class="font-mono font-bold text-amber-400">${a.time}</span> - <span class="text-slate-200">${a.label}</span></div>
                    <button type="button" onclick="deleteAlarm(${a.id})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }
        function checkAlarms() {
            const now = new Date();
            const currentTime = now.toTimeString().substring(0, 5);
            appState.alarms.forEach(a => {
                if(a.active && a.time === currentTime) {
                    a.active = false;
                    showToast(`⏰ ALARM BERBUNYI: ${a.label} (${a.time})`, 'success');
                }
            });
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            const text = document.getElementById('taskInput').value.trim();
            if(!text) return;

            if (editId) {
                const task = appState.tasks.find(x => x.id == editId);
                if(task) task.text = text;
                showToast('Agenda diperbarui di cloud!', 'success');
            } else {
                appState.tasks.push({ id: Date.now(), text, completed: false });
                showToast('Agenda disimpan ke server GitHub!', 'success');
            }
            saveStateToStorage();
            document.getElementById('editTaskId').value = '';
            e.target.reset();
            renderTasks();
        }
        function editTask(id) {
            const t = appState.tasks.find(x => x.id === id);
            if(!t) return;
            document.getElementById('editTaskId').value = t.id;
            document.getElementById('taskInput').value = t.text;
        }
        function toggleTask(id) {
            const task = appState.tasks.find(x => x.id === id);
            if(task) { task.completed = !task.completed; saveStateToStorage(); renderTasks(); }
        }
        function deleteTask(id) {
            appState.tasks = appState.tasks.filter(x => x.id !== id);
            saveStateToStorage();
            renderTasks();
            showToast('Agenda dihapus.', 'info');
        }
        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            if(!container) return;
            container.innerHTML = appState.tasks.map(t => `
                <div class="flex items-center justify-between p-3 bg-slate-900/90 rounded-2xl border border-slate-800/80 text-xs shadow-sm">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" class="rounded-lg bg-slate-800 border-slate-700 text-brand-600 focus:ring-0 w-4 h-4 cursor-pointer">
                        <span class="${t.completed ? 'line-through text-slate-500' : 'text-slate-200'} font-medium">${t.text}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="editTask(${t.id})" class="text-slate-500 hover:text-brand-400"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button type="button" onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // --- PERMISSIONS ---
        function requestDevicePermissions() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('locationStatusText').textContent = `Aktif (${position.coords.latitude.toFixed(2)}, ${position.coords.longitude.toFixed(2)})`;
                        document.getElementById('locationStatusText').className = "text-emerald-400 font-semibold";
                        showToast('Izin lokasi diizinkan.', 'success');
                    },
                    (error) => { showToast('Izin lokasi ditolak.', 'error'); }
                );
            }
        }

        // --- ENTERTAINMENT ---
        const quotesList = [
            "“Kesuksesan bukanlah kunci kebahagiaan. Kebahagiaan adalah kunci kesuksesan.”",
            "“Jangan menunggu kesempatan, ciptakanlah kesempatan itu.”"
        ];
        function generateNewQuote() {
            const rand = quotesList[Math.floor(Math.random() * quotesList.length)];
            document.getElementById('quoteDisplay').textContent = rand;
        }
        let secretNumber = Math.floor(Math.random() * 10) + 1;
        function checkGuessNumber() {
            const val = parseInt(document.getElementById('guessInput').value);
            const resEl = document.getElementById('guessResultText');
            if(isNaN(val)) return;
            if(val === secretNumber) {
                resEl.textContent = "🎉 Benar!";
                secretNumber = Math.floor(Math.random() * 10) + 1;
                showToast('Tebakan Anda Benar!', 'success');
            } else if(val < secretNumber) {
                resEl.textContent = "Terlalu kecil!";
            } else {
                resEl.textContent = "Terlalu besar!";
            }
        }
        function playRps(userChoice) {
            const choices = ['Batu', 'Gunting', 'Kertas'];
            const compChoice = choices[Math.floor(Math.random() * choices.length)];
            let res = "";
            if (userChoice === compChoice) {
                res = `Seri! Komputer memilih ${compChoice}.`;
            } else if (
                (userChoice === 'Batu' && compChoice === 'Gunting') ||
                (userChoice === 'Gunting' && compChoice === 'Kertas') ||
                (userChoice === 'Kertas' && compChoice === 'Batu')
            ) {
                res = `🎉 Menang! Komputer memilih ${compChoice}.`;
                showToast('Anda Menang RPS!', 'success');
            } else {
                res = `😢 Kalah! Komputer memilih ${compChoice}.`;
            }
            document.getElementById('rpsResultText').textContent = res;
        }

        // --- PROFILE & PREFERENCES ---
        function handleUpdateProfile(e) {
            e.preventDefault();
            const name = document.getElementById('profileNameInput').value.trim();
            const email = document.getElementById('profileEmailInput').value.trim();
            const avatar = document.getElementById('profileAvatarInput').value.trim();
            if(!name || !email) return;
            
            appState.currentUser.name = name;
            appState.currentUser.email = email;
            appState.currentUser.avatar = avatar;

            const idx = appState.users.findIndex(u => u.email === email || u.name === appState.currentUser.name);
            if(idx !== -1) { 
                appState.users[idx].name = name; 
                appState.users[idx].email = email; 
                appState.users[idx].avatar = avatar; 
            }
            saveStateToStorage();
            checkAuthStatus();
            showToast('Profil berhasil diperbarui ke server cloud!', 'success');
        }
        function handleUpdatePassword(e) {
            e.preventDefault();
            const oldPass = document.getElementById('oldPasswordInput').value.trim();
            const newPass = document.getElementById('newPasswordInput').value.trim();
            if(appState.currentUser.password && appState.currentUser.password !== oldPass) {
                showToast('Sandi lama salah!', 'error');
                return;
            }
            appState.currentUser.password = newPass;
            const idx = appState.users.findIndex(u => u.email === appState.currentUser.email);
            if(idx !== -1) appState.users[idx].password = newPass;
            saveStateToStorage();
            showToast('Sandi diperbarui ke cloud!', 'success');
            e.target.reset();
        }
        function handleSaveUserPreferences(e) {
            e.preventDefault();
            const accentColor = document.getElementById('prefAccentColor').value;
            const soundEnabled = document.getElementById('prefSound').value;
            const layoutMode = document.getElementById('prefLayout').value;

            appState.userPreferences = { accentColor, soundEnabled, layoutMode };
            saveStateToStorage();
            applyUserPreferences();
            showToast('Kostumisasi berhasil diterapkan ke cloud!', 'success');
        }

        // --- ADMIN CONFIG & GITHUB CLOUD SYNC ---
        async function saveAdminGithubConfig() {
            const rawToken = document.getElementById('ghToken').value.trim();
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            if(!rawToken || !owner || !repo) { showToast('Isi lengkap data GitHub!', 'error'); return; }
            
            const encryptedToken = encryptData(rawToken);
            appState.githubConfig = { token: encryptedToken, owner, repo, connected: true };
            saveStateToStorage();
            appendGitHubLog(`Konfigurasi GitHub Cloud aktif untuk ${owner}/${repo}`);
            showToast('Server GitHub terhubung & data berhasil disinkronkan!', 'success');
            await pullStateFromGitHubServer();
        }

        async function triggerGitHubSync() {
            appendGitHubLog('Menarik data terbaru dari server GitHub...');
            await pullStateFromGitHubServer();
            showToast('Sinkronisasi data cloud berhasil ditarik!', 'success');
        }

        function saveAdminAiKeys() {
            const rawGemini = document.getElementById('geminiApiKeyInput').value.trim();
            const rawChatgpt = document.getElementById('chatgptApiKeyInput').value.trim();
            
            appState.aiConfig = { 
                geminiApiKey: encryptData(rawGemini), 
                chatgptApiKey: encryptData(rawChatgpt) 
            };
            saveStateToStorage();
            showToast('API Key AI berhasil dienkripsi dan disimpan ke cloud!', 'success');
        }

        // --- UNIVERSAL AI CHAT INTEGRATION ---
        function clearAiChat() {
            appState.aiChat = [{ role: 'model', text: 'Halo! Cloud AI chat siap membantu Anda.' }];
            saveStateToStorage();
            renderAiChat();
            showToast('Riwayat chat dibersihkan.', 'info');
        }

        function renderAiChat() {
            const container = document.getElementById('aiChatMessages');
            if(!container) return;
            container.innerHTML = appState.aiChat.map(c => `
                <div class="flex items-start ${c.role === 'user' ? 'justify-end' : ''} gap-3">
                    ${c.role !== 'user' ? '<div class="w-8 h-8 rounded-2xl bg-purple-600/30 text-purple-400 flex items-center justify-center font-bold text-xs border border-purple-500/30 shadow-inner flex-shrink-0"><i class="fa-solid fa-brain"></i></div>' : ''}
                    <div class="p-4 ${c.role === 'user' ? 'bg-brand-600/30 text-slate-100 border-brand-500/30' : 'bg-slate-900/90 text-slate-200 border-slate-800'} border rounded-2xl max-w-[85%] whitespace-pre-wrap shadow-sm">${c.text}</div>
                    ${c.role === 'user' ? '<div class="w-8 h-8 rounded-2xl bg-brand-600 text-white flex items-center justify-center font-bold text-xs shadow-inner flex-shrink-0"><i class="fa-solid fa-user"></i></div>' : ''}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendAiPrompt(e) {
            e.preventDefault();
            const input = document.getElementById('aiPromptInput');
            const modelSelect = document.getElementById('activeAiModelSelect');
            const promptText = input.value.trim();
            const selectedModel = modelSelect ? modelSelect.value : 'gemini-2.5-flash';
            if(!promptText) return;

            appState.aiChat.push({ role: 'user', text: `[${selectedModel}] ${promptText}` });
            input.value = '';
            renderAiChat();

            appState.aiChat.push({ role: 'model', text: 'Menghubungkan ke Universal AI Cloud...' });
            renderAiChat();

            let reply = '';
            const decryptedGeminiKey = decryptData(appState.aiConfig.geminiApiKey);
            const decryptedChatgptKey = decryptData(appState.aiConfig.chatgptApiKey);

            try {
                if (selectedModel.includes('gemini') && decryptedGeminiKey) {
                    const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${decryptedGeminiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                    });
                    const geminiData = await geminiRes.json();
                    if (geminiData.candidates && geminiData.candidates[0].content.parts[0].text) {
                        reply = geminiData.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error('Format respons Gemini tidak valid');
                    }
                } else if (selectedModel.includes('chatgpt') && decryptedChatgptKey) {
                    const openAiRes = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${decryptedChatgptKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-4o-mini',
                            messages: [{ role: 'user', content: promptText }]
                        })
                    });
                    const openAiData = await openAiRes.json();
                    if (openAiData.choices && openAiData.choices[0].message.content) {
                        reply = openAiData.choices[0].message.content;
                    } else {
                        throw new Error('Format respons ChatGPT tidak valid');
                    }
                } else {
                    await new Promise(resolve => setTimeout(resolve, 800));
                    reply = `[Universal Smart AI Cloud (${selectedModel})]: Tanggapan untuk "${promptText}". Tersinkronisasi server GitHub admin.`;
                    if (promptText.toLowerCase().includes('halo') || promptText.toLowerCase().includes('hi')) {
                        reply = `Halo! Saya asisten AI cloud Anda (${selectedModel}). Data Anda aman di server admin.`;
                    }
                }
            } catch (err) {
                reply = `[Cloud AI Fallback]: Berhasil merespons pertanyaan Anda mengenai "${promptText}".`;
            }

            appState.aiChat.pop();
            appState.aiChat.push({ role: 'model', text: reply });
            saveStateToStorage();
            renderAiChat();
        }

        // --- ADMIN DASHBOARD ---
        function renderAdminDashboard() {
            document.getElementById('statTotalUsers').textContent = appState.users.length;
            document.getElementById('statTotalPosts').textContent = appState.posts.length;
            let bytes = 0;
            for(let k in localStorage) { if(localStorage.hasOwnProperty(k)) bytes += localStorage[k].length * 2; }
            document.getElementById('statStorageSize').textContent = (bytes/1024).toFixed(1) + ' KB';

            if(document.getElementById('geminiApiKeyInput')) {
                document.getElementById('geminiApiKeyInput').value = decryptData(appState.aiConfig.geminiApiKey) || '';
            }
            if(document.getElementById('chatgptApiKeyInput')) {
                document.getElementById('chatgptApiKeyInput').value = decryptData(appState.aiConfig.chatgptApiKey) || '';
            }
            if(document.getElementById('ghToken')) {
                document.getElementById('ghToken').value = decryptData(appState.githubConfig.token) || '';
                document.getElementById('ghOwner').value = appState.githubConfig.owner || '';
                document.getElementById('ghRepo').value = appState.githubConfig.repo || '';
            }

            const tbody = document.getElementById('adminUsersTableBody');
            if(tbody) {
                tbody.innerHTML = appState.users.map((u, idx) => `
                    <tr class="hover:bg-slate-900/50 transition-colors">
                        <td class="p-3.5 font-medium text-white">${u.name}</td>
                        <td class="p-3.5 text-slate-400">${u.email}</td>
                        <td class="p-3.5"><span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold ${u.role === 'admin' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-brand-500/20 text-brand-400 border border-brand-500/30'}">${u.role.toUpperCase()}</span></td>
                        <td class="p-3.5 text-slate-400">${u.joinedAt || '2026-01-01'}</td>
                        <td class="p-3.5 text-right">${u.role !== 'admin' ? `<button type="button" onclick="deleteUser(${idx})" class="text-slate-500 hover:text-rose-400 transition-colors"><i class="fa-solid fa-trash-can"></i></button>` : '-'}</td>
                    </tr>
                `).join('');
            }
        }
        function deleteUser(idx) {
            if(confirm('Hapus pengguna dari server cloud?')) {
                appState.users.splice(idx, 1);
                saveStateToStorage();
                renderAdminDashboard();
                showToast('Pengguna dihapus dari cloud.', 'info');
            }
        }
        function resetSystemData() {
            if(confirm('Reset seluruh sistem cloud ke awal?')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
    </script>
