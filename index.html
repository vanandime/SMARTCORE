<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Keuangan Harian</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">
  <div class="max-w-3xl mx-auto">
    <!-- Header & Filter -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
      <div>
        <h1 class="text-2xl font-bold">Laporan Keuangan</h1>
        <p class="text-sm text-slate-500">Tersimpan di browser & terintegrasi real-time</p>
      </div>
      
      <!-- Filter Tanggal Sinkron -->
      <div class="flex items-center gap-2 bg-white p-1.5 border rounded-lg shadow-sm">
        <select id="filterMode" class="text-sm border-none bg-transparent focus:ring-0 cursor-pointer font-medium text-slate-700">
          <option value="date">Per Tanggal:</option>
          <option value="all">Semua Tanggal</option>
        </select>
        <input type="date" id="filterDate" class="border p-1.5 rounded text-sm bg-slate-50">
      </div>
    </header>

    <!-- Ringkasan -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-white p-3 rounded-lg border text-center shadow-sm">
        <p class="text-xs text-slate-500">Pemasukan</p>
        <p id="totalIncome" class="text-lg font-bold text-emerald-600">Rp 0</p>
      </div>
      <div class="bg-white p-3 rounded-lg border text-center shadow-sm">
        <p class="text-xs text-slate-500">Pengeluaran</p>
        <p id="totalExpense" class="text-lg font-bold text-rose-600">Rp 0</p>
      </div>
      <div class="bg-white p-3 rounded-lg border text-center shadow-sm">
        <p class="text-xs text-slate-500">Saldo Bersih</p>
        <p id="netBalance" class="text-lg font-bold text-blue-600">Rp 0</p>
      </div>
    </div>

    <!-- Form Input Transaksi -->
    <form id="txForm" class="bg-white p-4 rounded-lg border mb-6 flex flex-wrap gap-2 shadow-sm">
      <input type="date" id="txDate" required class="border p-2 rounded text-sm flex-1">
      <select id="txType" class="border p-2 rounded text-sm">
        <option value="income">Pemasukan (+)</option>
        <option value="expense">Pengeluaran (-)</option>
      </select>
      <input type="number" id="txAmount" placeholder="Jumlah (Rp)" required class="border p-2 rounded text-sm flex-1">
      <input type="text" id="txDesc" placeholder="Keterangan" required class="border p-2 rounded text-sm flex-1">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700 transition">Tambah</button>
    </form>

    <!-- Panel Manajemen File -->
    <div class="bg-white p-3 rounded-lg border mb-6 flex flex-wrap gap-2 items-center justify-between shadow-sm">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Manajemen File:</span>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportJSON()" class="bg-slate-700 text-white text-xs px-3 py-1.5 rounded hover:bg-slate-800">
          📥 Backup (JSON)
        </button>
        <label class="bg-slate-100 border text-slate-700 text-xs px-3 py-1.5 rounded cursor-pointer hover:bg-slate-200">
          📤 Restore (JSON)
          <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="hidden">
        </label>
        <button onclick="exportCSV()" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded hover:bg-emerald-700">
          📊 Ekspor (Excel)
        </button>
      </div>
    </div>

    <!-- Tabel Transaksi -->
    <div class="bg-white rounded-lg border overflow-hidden shadow-sm">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-100 text-slate-600">
          <tr>
            <th class="p-3">Tanggal</th>
            <th class="p-3">Keterangan</th>
            <th class="p-3">Tipe</th>
            <th class="p-3 text-right">Nominal</th>
            <th class="p-3 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="txList" class="divide-y"></tbody>
      </table>
    </div>
  </div>

  <script>
    const today = new Date().toISOString().split('T')[0];
    const filterDateInput = document.getElementById('filterDate');
    const txDateInput = document.getElementById('txDate');
    const filterModeSelect = document.getElementById('filterMode');

    filterDateInput.value = today;
    txDateInput.value = today;

    let data = JSON.parse(localStorage.getItem('my_finance_data')) || [];

    // Sinkronisasi input tanggal form dengan filter tanggal utama
    filterDateInput.addEventListener('change', () => {
      txDateInput.value = filterDateInput.value;
      render();
    });

    filterModeSelect.addEventListener('change', () => {
      filterDateInput.style.display = filterModeSelect.value === 'all' ? 'none' : 'inline-block';
      render();
    });

    function render() {
      const mode = filterModeSelect.value;
      const selectedDate = filterDateInput.value;
      const list = document.getElementById('txList');

      // Filter data sesuai opsi
      const filtered = data.filter(item => {
        if (mode === 'all') return true;
        return item.date === selectedDate;
      });

      let inc = 0, exp = 0;
      let htmlRows = '';

      filtered.forEach(item => {
        const amt = Number(item.amount) || 0;
        if (item.type === 'income') inc += amt;
        else exp += amt;

        htmlRows += `
          <tr>
            <td class="p-3 text-xs text-slate-500">${item.date}</td>
            <td class="p-3 font-medium">${item.desc}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 text-xs rounded font-medium ${item.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                ${item.type === 'income' ? 'Masuk' : 'Keluar'}
              </span>
            </td>
            <td class="p-3 text-right font-semibold ${item.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
              Rp ${amt.toLocaleString('id-ID')}
            </td>
            <td class="p-3 text-center">
              <button onclick="del('${item.id}')" class="text-rose-600 text-xs hover:underline">Hapus</button>
            </td>
          </tr>`;
      });

      if (filtered.length === 0) {
        htmlRows = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Tidak ada transaksi pada periode ini.</td></tr>`;
      }

      list.innerHTML = htmlRows;

      // Update Card Ringkasan
      document.getElementById('totalIncome').textContent = 'Rp ' + inc.toLocaleString('id-ID');
      document.getElementById('totalExpense').textContent = 'Rp ' + exp.toLocaleString('id-ID');
      
      const net = inc - exp;
      const netEl = document.getElementById('netBalance');
      netEl.textContent = 'Rp ' + net.toLocaleString('id-ID');
      netEl.className = `text-lg font-bold ${net >= 0 ? 'text-blue-600' : 'text-rose-600'}`;
    }

    // Tambah Transaksi
    document.getElementById('txForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newTxDate = txDateInput.value;
      
      data.push({
        id: Date.now().toString(),
        date: newTxDate,
        type: document.getElementById('txType').value,
        amount: document.getElementById('txAmount').value,
        desc: document.getElementById('txDesc').value
      });

      localStorage.setItem('my_finance_data', JSON.stringify(data));

      // Otomatis arahkan filter ke tanggal transaksi baru agar langsung kelihatan real-time
      filterModeSelect.value = 'date';
      filterDateInput.style.display = 'inline-block';
      filterDateInput.value = newTxDate;

      document.getElementById('txAmount').value = '';
      document.getElementById('txDesc').value = '';
      render();
    });

    // Hapus Transaksi
    function del(id) {
      data = data.filter(d => d.id !== id);
      localStorage.setItem('my_finance_data', JSON.stringify(data));
      render();
    }

    // Backup & Export File
    function exportJSON() {
      if (data.length === 0) return alert('Belum ada data!');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `keuangan_backup_${today}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            if (confirm('Import file ini akan menimpa data yang ada. Lanjutkan?')) {
              data = imported;
              localStorage.setItem('my_finance_data', JSON.stringify(data));
              render();
              alert('Data berhasil dipulihkan!');
            }
          } else {
            alert('Format file JSON tidak valid!');
          }
        } catch (err) {
          alert('Gagal membaca file JSON.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportCSV() {
      if (data.length === 0) return alert('Belum ada data!');
      let csv = "\uFEFFTanggal,Tipe,Nominal,Keterangan\n";
      data.forEach(item => {
        const type = item.type === 'income' ? 'Pemasukan' : 'Pengeluaran';
        const desc = `"${item.desc.replace(/"/g, '""')}"`;
        csv += `${item.date},${type},${item.amount},${desc}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `laporan_keuangan_${today}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    render();
  </script>
</body>
</html>
