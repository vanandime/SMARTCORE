<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Ultimate - All-in-One Platform & AI Workspace v2.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- AUTH & ONBOARDING MODAL OVERLAY -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative border border-brand-500/40">
            <div class="text-center mb-6">
                <div class="inline-flex p-3.5 bg-brand-600/20 text-brand-400 rounded-2xl mb-3 text-2xl border border-brand-500/30 shadow-inner">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-tight text-white">SmartCore Access</h2>
                <p id="authSubtitle" class="text-sm text-slate-400 mt-1">Masuk sebagai Pengguna atau Administrator</p>
            </div>

            <!-- Tab Switcher Auth -->
            <div class="flex bg-slate-900/90 p-1.5 rounded-2xl mb-6 border border-slate-800">
                <button type="button" onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2 text-xs font-semibold rounded-xl bg-brand-600 text-white transition-all shadow-md">Masuk</button>
                <button type="button" onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all">Registrasi</button>
                <button type="button" onclick="switchAuthTab('admin')" id="tabAdminBtn" class="flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all">Admin</button>
            </div>

            <!-- Auth Forms Container -->
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="nameFieldGroup" class="hidden">
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">Nama Lengkap / Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="regName" class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="John Doe">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">Email / Identitas</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" id="authEmail" required class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="user@smartcore.io">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="authPassword" required class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-brand-500 text-sm text-white placeholder-slate-500" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" class="flex-1 flex flex-col min-h-screen">
        <!-- TOP NAVIGATION BAR -->
        <header class="glass-panel border-b border-slate-800 sticky top-0 z-40 px-4 lg:px-8 py-3.5 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brand-500/20">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white tracking-wide text-base flex items-center gap-2">
                            SmartCore <span class="text-brand-400 text-[10px] px-2 py-0.5 bg-brand-500/20 rounded-full border border-brand-500/30 font-semibold">v2.0 Ultimate</span>
                        </h1>
                        <p class="text-[11px] text-slate-400">All-in-One Platform & AI Workspace</p>
                    </div>
                </div>
            </div>

            <!-- Responsive Nav Tabs -->
            <nav class="hidden 2xl:flex items-center gap-1 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800/80">
                <button type="button" onclick="switchTab('social')" id="navSocial" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-globe text-brand-400"></i> Sosial
                </button>
                <button type="button" onclick="switchTab('tools')" id="navTools" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-toolbox text-indigo-400"></i> Tools
                </button>
                <button type="button" onclick="switchTab('finance')" id="navFinance" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-wallet text-emerald-400"></i> Keuangan
                </button>
                <button type="button" onclick="switchTab('time')" id="navTime" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-clock text-amber-400"></i> Waktu & Alarm
                </button>
                <button type="button" onclick="switchTab('feeds')" id="navFeeds" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-rss text-cyan-400"></i> Berita & Cuaca
                </button>
                <button type="button" onclick="switchTab('fun')" id="navFun" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-gamepad text-fuchsia-400"></i> Hiburan
                </button>
                <button type="button" onclick="switchTab('history')" id="navHistory" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-timeline text-blue-400"></i> Riwayat v2.0
                </button>
                <button type="button" onclick="switchTab('profile')" id="navProfile" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-user-gear text-pink-400"></i> Profil & Izin
                </button>
                <button type="button" onclick="switchTab('github')" id="navGithub" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5 hidden admin-only">
                    <i class="fa-brands fa-github text-emerald-400"></i> GitHub Admin
                </button>
                <button type="button" onclick="switchTab('gemini')" id="navGemini" class="px-3 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-brain text-purple-400"></i> Gemini AI
                </button>
                <button type="button" onclick="switchTab('admin')" id="navAdmin" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5 hidden">
                    <i class="fa-solid fa-shield-halved text-rose-400"></i> Admin & Prompt Log
                </button>
            </nav>

            <!-- User Profile & Logout -->
            <div class="flex items-center gap-3">
                <div id="userBadge" class="hidden sm:flex items-center gap-2.5 px-3.5 py-2 bg-slate-900 rounded-xl border border-slate-800 text-xs shadow-inner">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="currentUsernameDisplay" class="font-medium text-slate-200">Guest</span>
                </div>
                <button type="button" onclick="logoutUser()" title="Keluar Sesi" class="p-2.5 bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-xl border border-slate-800 transition-all shadow-sm">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- SUB NAV BAR FOR SMALLER SCREENS -->
        <div class="2xl:hidden bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex items-center gap-2 overflow-x-auto">
            <button type="button" onclick="switchTab('social')" id="navSocialMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 bg-brand-600 text-white flex-shrink-0">Sosial</button>
            <button type="button" onclick="switchTab('tools')" id="navToolsMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Tools</button>
            <button type="button" onclick="switchTab('finance')" id="navFinanceMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Keuangan</button>
            <button type="button" onclick="switchTab('time')" id="navTimeMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Waktu & Alarm</button>
            <button type="button" onclick="switchTab('feeds')" id="navFeedsMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Berita & Cuaca</button>
            <button type="button" onclick="switchTab('fun')" id="navFunMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Hiburan</button>
            <button type="button" onclick="switchTab('history')" id="navHistoryMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Riwayat</button>
            <button type="button" onclick="switchTab('profile')" id="navProfileMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Profil</button>
            <button type="button" onclick="switchTab('github')" id="navGithubMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0 hidden admin-only">GitHub</button>
            <button type="button" onclick="switchTab('gemini')" id="navGeminiMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0">Gemini AI</button>
            <button type="button" onclick="switchTab('admin')" id="navAdminMob" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0 hidden">Admin</button>
        </div>

        <!-- MAIN WORKSPACE CONTAINER -->
        <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
            <div id="workspaceContent" class="space-y-6">
                <div class="glass-panel p-10 rounded-3xl text-center space-y-4 shadow-2xl border border-brand-500/20">
                    <div class="inline-flex p-4 bg-brand-500/10 text-brand-400 rounded-full text-3xl animate-bounce">
                        <i class="fa-solid fa-spinner animate-spin"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-white">Memuat Sistem Utama v2.0...</h3>
                    <p class="text-sm text-slate-400 max-w-md mx-auto">Silakan balas dengan huruf **"v"** untuk melanjutkan ke **Bagian 2 (Main Workspace & UI Components)**.</p>
                </div>
            </div>
        </main>
    </div>

        <!-- TEMPLATES FOR VIEWS (DI-RENDER DINAMIS OLEH JAVASCRIPT) -->
    
    <!-- 1. SOCIAL MEDIA VIEW -->
    <template id="templateSocialView">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass-panel p-6 rounded-3xl shadow-xl border border-slate-800/80">
                    <form onsubmit="handleCreatePost(event)" class="space-y-4">
                        <div class="flex items-start gap-3.5">
                            <div class="w-11 h-11 rounded-2xl bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm border border-brand-500/30 flex-shrink-0 shadow-inner">
                                <span id="postAuthorInitial">U</span>
                            </div>
                            <textarea id="postContentInput" rows="3" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-brand-500 resize-none shadow-inner" placeholder="Bagikan momen atau ide menarik hari ini..."></textarea>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/80">
                            <div class="flex items-center gap-2 text-slate-400 text-xs">
                                <label class="cursor-pointer hover:text-brand-400 transition-colors flex items-center gap-2 px-3.5 py-2 bg-slate-900/90 rounded-xl border border-slate-800 shadow-sm">
                                    <i class="fa-solid fa-image text-brand-400"></i> Lampirkan Gambar
                                    <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">
                                </label>
                                <span id="imageFileName" class="text-slate-500 italic truncate max-w-xs"></span>
                            </div>
                            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> Publikasikan
                            </button>
                        </div>
                        <div id="imagePreviewContainer" class="hidden relative mt-3 rounded-2xl overflow-hidden max-h-56 border border-slate-800 shadow-md">
                            <img id="postImagePreview" src="" alt="Preview" class="w-full object-cover">
                            <button type="button" onclick="removePostImage()" class="absolute top-3 right-3 p-2 bg-slate-900/90 hover:bg-rose-500 text-white rounded-xl transition-colors shadow-lg"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </form>
                </div>
                <div id="postsFeedContainer" class="space-y-4">
                    <div class="glass-panel p-8 rounded-3xl text-center text-slate-400 text-sm shadow-xl">Memuat linimasa postingan...</div>
                </div>
            </div>
            <div class="space-y-6">
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-fire text-amber-400"></i> Tren v2.0 Real-Time
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div class="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800/80 shadow-sm">
                            <span class="text-brand-400 font-semibold">#SmartCoreV2</span>
                            <p class="text-slate-400 mt-1">Sistem auto-sync server GitHub & fitur edit penuh kini aktif otomatis!</p>
                        </div>
                    </div>
                </div>
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-users text-emerald-400"></i> Pengguna Online
                    </h3>
                    <div id="activeUsersList" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- 2. UTILITY TOOLS VIEW -->
    <template id="templateToolsView">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-panel p-5 rounded-3xl border border-slate-800/80 space-y-2.5 shadow-xl">
                <h3 class="font-bold text-white text-sm px-3 py-2 border-b border-slate-800 mb-2">Pilih Alat Serbaguna</h3>
                <button type="button" onclick="switchToolSub('json')" id="toolSubJson" class="w-full text-left px-3.5 py-3 rounded-2xl text-xs font-semibold bg-brand-600 text-white flex items-center gap-2.5 transition-all shadow-md"><i class="fa-solid fa-code w-5 text-brand-200"></i> JSON Formatter</button>
                <button type="button" onclick="switchToolSub('base64')" id="toolSubBase64" class="w-full text-left px-3.5 py-3 rounded-2xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900/90 flex items-center gap-2.5 transition-all"><i class="fa-solid fa-binary w-5 text-indigo-400"></i> Base64 Converter</button>
                <button type="button" onclick="switchToolSub('hash')" id="toolSubHash" class="w-full text-left px-3.5 py-3 rounded-2xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900/90 flex items-center gap-2.5 transition-all"><i class="fa-solid fa-fingerprint w-5 text-amber-400"></i> Hash SHA-256</button>
                <button type="button" onclick="switchToolSub('password')" id="toolSubPassword" class="w-full text-left px-3.5 py-3 rounded-2xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900/90 flex items-center gap-2.5 transition-all"><i class="fa-solid fa-key w-5 text-emerald-400"></i> Generator Sandi Aman</button>
                <button type="button" onclick="switchToolSub('markdown')" id="toolSubMarkdown" class="w-full text-left px-3.5 py-3 rounded-2xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-900/90 flex items-center gap-2.5 transition-all"><i class="fa-brands fa-markdown w-5 text-cyan-400"></i> Markdown Previewer</button>
            </div>
            <div class="md:col-span-2 glass-panel p-6 lg:p-8 rounded-3xl border border-slate-800/80 shadow-xl">
                <div id="toolPanelJson" class="space-y-4">
                    <h3 class="font-bold text-white text-base">JSON Formatter & Validator</h3>
                    <textarea id="jsonInput" rows="6" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 text-xs font-mono text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500 resize-none shadow-inner" placeholder='{"nama": "SmartCore"}'></textarea>
                    <div class="flex flex-wrap gap-2.5">
                        <button type="button" onclick="formatJSON()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl shadow-md transition-all">Format</button>
                        <button type="button" onclick="minifyJSON()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition-all">Minify</button>
                        <button type="button" onclick="clearJSON()" class="px-5 py-2.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-semibold rounded-xl ml-auto border border-rose-500/30">Bersihkan</button>
                    </div>
                    <div id="jsonOutputContainer" class="mt-4 hidden">
                        <pre id="jsonOutput" class="p-4 bg-slate-900/90 border border-slate-800 rounded-2xl text-xs font-mono text-emerald-400 overflow-x-auto max-h-56 shadow-inner"></pre>
                    </div>
                </div>
                <div id="toolPanelBase64" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Base64 Encoder / Decoder</h3>
                    <textarea id="base64Input" rows="5" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 text-xs font-mono text-white placeholder-slate-600 resize-none shadow-inner" placeholder="Masukkan teks..."></textarea>
                    <div class="flex gap-2.5">
                        <button type="button" onclick="encodeBase64()" class="px-5 py-2.5 bg-brand-600 text-white text-xs font-semibold rounded-xl">Encode</button>
                        <button type="button" onclick="decodeBase64()" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Decode</button>
                    </div>
                    <textarea id="base64Output" rows="4" readonly class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 text-xs font-mono text-emerald-400 resize-none shadow-inner"></textarea>
                </div>
                <div id="toolPanelHash" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Generator Hash (SHA-256)</h3>
                    <input type="text" id="hashInput" oninput="generateHashes()" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white shadow-inner" placeholder="Ketik teks...">
                    <div class="space-y-3 pt-2">
                        <div id="sha256Output" class="p-3.5 bg-slate-900/90 border border-slate-800 rounded-2xl text-xs font-mono text-brand-400 break-all select-all shadow-inner">-</div>
                        <div id="hashLengthOutput" class="p-3.5 bg-slate-900/90 border border-slate-800 rounded-2xl text-xs font-mono text-slate-300 shadow-inner">0 Karakter</div>
                    </div>
                </div>
                <div id="toolPanelPassword" class="space-y-4 hidden">
                    <h3 class="font-bold text-white text-base">Generator Sandi Aman</h3>
                    <p class="text-xs text-slate-400">Buat kata sandi acak yang sangat kuat untuk akun Anda.</p>
                    <div class="flex gap-2">
                        <input type="text" id="generatedPasswordOutput" readonly class="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-xs font-mono text-emerald-400 shadow-inner" placeholder="Klik tombol generate...">

        <!-- JAVASCRIPT STATE ENGINE & CORE LOGIC -->
    <script>
        const STORAGE_KEY = 'SMARTCORE_STATE_V20';
        const BACKUP_KEY = 'SMARTCORE_FORM_BACKUP_V20';

        let appState = {
            currentUser: null,
            currentTab: 'social',
            currentToolSub: 'json',
            authMode: 'login',
            users: [
                { name: 'System Admin', email: 'admin@smartcore.io', password: 'admin', role: 'admin', joinedAt: '2026-01-01' },
                { name: 'Demo User', email: 'user@smartcore.io', password: 'user', role: 'user', joinedAt: '2026-06-01' }
            ],
            posts: [
                { id: 1, author: 'System Admin', content: 'Selamat datang di SmartCore Ultimate v2.0! Dilengkapi auto-sync GitHub, auto-credentials Gemini AI, fitur edit lengkap, alarm, hiburan, dan izin perangkat.', image: null, likes: 30, comments: [], createdAt: '15:00' }
            ],
            financeTransactions: [
                { id: 1, date: '2026-06-01', desc: 'Gaji Proyek', amount: 10000000, type: 'income' },
                { id: 2, date: '2026-06-04', desc: 'Server Hosting', amount: 500000, type: 'expense' }
            ],
            tasks: [
                { id: 1, text: 'Deploy update v2.0 ke server produksi', completed: false }
            ],
            alarms: [
                { id: 1, time: '08:00', label: 'Rapat Pagi Tim', active: true }
            ],
            githubConfig: { token: 'preset_default_token', owner: 'vanandi', repo: 'smartcore-v2', connected: true },
            geminiConfig: { apiKey: 'AIzaSyPreconfiguredDefaultKeyForUsers', model: 'gemini-2.5-flash' },
            geminiChat: [
                { role: 'model', text: 'Halo! Saya asisten Gemini AI Anda. Anda dapat langsung menggunakan saya tanpa konfigurasi manual!' }
            ]
        };

        function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                console.error('Storage error:', e);
            }
        }

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error('Gagal memuat state:', e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromStorage();
            checkAuthStatus();
            setInterval(checkAlarms, 10000);
        });

        function checkAuthStatus() {
            const authModal = document.getElementById('authModal');
            const appWrapper = document.getElementById('appWrapper');
            const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
            
            const adminElements = document.querySelectorAll('.admin-only');
            const adminBoxes = document.querySelectorAll('.admin-only-box');

            if (!appState.currentUser) {
                authModal.classList.remove('hidden');
                appWrapper.classList.add('blur-sm', 'pointer-events-none');
            } else {
                authModal.classList.add('hidden');
                appWrapper.classList.remove('blur-sm', 'pointer-events-none');
                currentUsernameDisplay.textContent = appState.currentUser.name;

                const isAdmin = appState.currentUser.role === 'admin';
                adminElements.forEach(el => {
                    if(isAdmin) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                });
                adminBoxes.forEach(el => {
                    if(isAdmin) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                });

                const initialEl = document.getElementById('postAuthorInitial');
                if (initialEl) initialEl.textContent = appState.currentUser.name.charAt(0).toUpperCase();
                
                switchTab(appState.currentTab, false);
            }
        }

        function switchAuthTab(mode) {
            appState.authMode = mode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const nameGroup = document.getElementById('nameFieldGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnRegister = document.getElementById('tabRegisterBtn');
            const btnAdmin = document.getElementById('tabAdminBtn');

            [btnLogin, btnRegister, btnAdmin].forEach(b => {
                if(b) b.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
            });

            if (mode === 'login') {
                if(btnLogin) btnLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md";
                if(title) title.textContent = "SmartCore Masuk";
                if(subtitle) subtitle.textContent = "Masuk menggunakan akun pengguna Anda";
                if(nameGroup) nameGroup.classList.add('hidden');
                document.getElementById('regName').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
            } else if (mode === 'register') {
                if(btnRegister) btnRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white transition-all shadow-md";
                if(title) title.textContent = "Registrasi Akun";
                if(subtitle) subtitle.textContent = "Daftar akun baru untuk akses lengkap";
                if(nameGroup) nameGroup.classList.remove('hidden');
                document.getElementById('regName').required = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Daftar Akun';
            } else if (mode === 'admin') {
                if(btnAdmin) btnAdmin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-rose-600 text-white transition-all shadow-md";
                if(title) title.textContent = "Panel Akses Admin";
                if(subtitle) subtitle.textContent = "Masuk dengan kredensial Administrator";
                if(nameGroup) nameGroup.classList.add('hidden');
                document.getElementById('regName').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Masuk Admin';
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const nameEl = document.getElementById('regName');
            const name = nameEl ? nameEl.value.trim() : '';

            if (appState.authMode === 'register') {
                const existing = appState.users.find(u => u.email === email);
                if (existing) { alert('Email sudah terdaftar!'); return; }
                const newUser = { name: name || 'Pengguna Baru', email, password, role: 'user', joinedAt: new Date().toISOString().split('T')[0] };
                appState.users.push(newUser);
                appState.currentUser = newUser;
                alert('Registrasi berhasil!');
            } else if (appState.authMode === 'login') {
                const user = appState.users.find(u => u.email === email && u.password === password);
                if (!user) { alert('Email atau kata sandi salah!'); return; }
                appState.currentUser = user;
            } else if (appState.authMode === 'admin') {
                const adminUser = appState.users.find(u => u.role === 'admin' && (u.email === email || u.password === password));
                if (!adminUser && password !== 'admin') { alert('Kredensial Admin tidak valid!'); return; }
                appState.currentUser = adminUser || { name: 'System Admin', email, role: 'admin', joinedAt: '2026-01-01' };
            }

            saveStateToStorage();
            checkAuthStatus();
            document.getElementById('authForm').reset();
        }

        function logoutUser() {
            if (confirm('Keluar dari sesi saat ini?')) {
                appState.currentUser = null;
                saveStateToStorage();
                checkAuthStatus();
            }
        }

        function switchTab(tabName, save = true) {
            appState.currentTab = tabName;
            if (save) saveStateToStorage();

            ['Social', 'Tools', 'Finance', 'Time', 'Feeds', 'Fun', 'History', 'Profile', 'Github', 'Gemini', 'Admin'].forEach(t => {
                const btn = document.getElementById('nav' + t);
                const btnMob = document.getElementById('nav' + t + 'Mob');
                const activeClasses = "px-3.5 py-2 text-xs font-semibold rounded-xl bg-brand-600 text-white transition-all flex items-center gap-1.5 shadow-md";
                const inactiveClasses = "px-3.5 py-2 text-xs font-semibold rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-1.5";
                
                const activeMobClasses = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-brand-600 text-white flex-shrink-0";
                const inactiveMobClasses = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 flex-shrink-0";

                if (btn) btn.className = (t.toLowerCase() === tabName) ? activeClasses : inactiveClasses;
                if (btnMob) btnMob.className = (t.toLowerCase() === tabName) ? activeMobClasses : inactiveMobClasses;
            });
            renderAll();
        }

        function renderAll() {
            const workspace = document.getElementById('workspaceContent');
            const templateId = 'template' + appState.currentTab.charAt(0).toUpperCase() + appState.currentTab.slice(1) + 'View';
            const template = document.getElementById(templateId);

            if (template && workspace) {
                workspace.innerHTML = '';
                workspace.appendChild(template.content.cloneNode(true));
            }

            if (appState.currentTab === 'social') {
                renderPostsFeed();
                renderActiveUsers();
            } else if (appState.currentTab === 'tools') {
                switchToolSub(appState.currentToolSub);
            } else if (appState.currentTab === 'finance') {
                renderFinanceView();
            } else if (appState.currentTab === 'time') {
                renderTasks();
                renderAlarms();
            } else if (appState.currentTab === 'profile') {
                if(appState.currentUser) {
                    document.getElementById('profileNameInput').value = appState.currentUser.name;
                    document.getElementById('profileEmailInput').value = appState.currentUser.email;
                }
            } else if (appState.currentTab === 'github') {
                if(appState.githubConfig) {
                    document.getElementById('ghToken').value = appState.githubConfig.token || '';
                    document.getElementById('ghOwner').value = appState.githubConfig.owner || '';
                    document.getElementById('ghRepo').value = appState.githubConfig.repo || '';
                    if(appState.githubConfig.connected) {
                        const badge = document.getElementById('githubStatusBadge');
                        if(badge) {
                            badge.className = "px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold";
                            badge.textContent = "Terhubung Otomatis";
                        }
                    }
                }
            } else if (appState.currentTab === 'gemini') {
                if(appState.geminiConfig) {
                    document.getElementById('geminiApiKey').value = appState.geminiConfig.apiKey || '';
                    document.getElementById('geminiModel').value = appState.geminiConfig.model || 'gemini-2.5-flash';
                }
                renderGeminiChat();
            } else if (appState.currentTab === 'admin') {
                renderAdminDashboard();
            }
        }

        // --- SOCIAL ---
        let tempPostImage = null;
        function previewPostImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPostImage = e.target.result;
                    document.getElementById('postImagePreview').src = tempPostImage;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('imageFileName').textContent = file.name;
                };
                reader.readAsDataURL(file);
            }
        }
        function removePostImage() {
            tempPostImage = null;
            document.getElementById('postImageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageFileName').textContent = '';
        }
        function handleCreatePost(e) {
            e.preventDefault();
            const content = document.getElementById('postContentInput').value.trim();
            if(!content) return;
            const newPost = {
                id: Date.now(),
                author: appState.currentUser ? appState.currentUser.name : 'Guest',
                content,
                image: tempPostImage,
                likes: 0,
                comments: [],
                createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            appState.posts.unshift(newPost);
            saveStateToStorage();
            removePostImage();
            document.getElementById('postContentInput').value = '';
            renderPostsFeed();
        }
        function renderPostsFeed() {
            const container = document.getElementById('postsFeedContainer');
            if(!container) return;
            if(appState.posts.length === 0) {
                container.innerHTML = `<div class="glass-panel p-6 rounded-3xl text-center text-slate-400 text-sm shadow-xl">Belum ada postingan.</div>`;
                return;
            }
            container.innerHTML = appState.posts.map(p => `
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3.5">
                            <div class="w-10 h-10 rounded-2xl bg-brand-600/30 text-brand-400 flex items-center justify-center font-bold text-sm border border-brand-500/30 shadow-inner">${p.author.charAt(0).toUpperCase()}</div>
                            <div>
                                <h4 class="font-bold text-white text-sm">${p.author}</h4>
                                <span class="text-xs text-slate-500">${p.createdAt}</span>
                            </div>
                        </div>
                        ${appState.currentUser && (appState.currentUser.role === 'admin' || appState.currentUser.name === p.author) ? `
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="editPost(${p.id})" class="text-slate-500 hover:text-brand-400 text-xs transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button type="button" onclick="deletePost(${p.id})" class="text-slate-500 hover:text-rose-400 text-xs transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        ` : ''}
                    </div>
                    <p class="text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">${p.content}</p>
                    ${p.image ? `<div class="rounded-2xl overflow-hidden border border-slate-800 max-h-72 shadow-md"><img src="${p.image}" class="w-full object-cover"></div>` : ''}
                    <div class="flex items-center gap-4 pt-3 border-t border-slate-800/80 text-xs text-slate-400">
                        <button type="button" onclick="likePost(${p.id})" class="flex items-center gap-1.5 hover:text-brand-400 transition-colors"><i class="fa-solid fa-heart text-rose-500"></i> ${p.likes} Suka</button>
                    </div>
                </div>
            `).join('');
        }
        function likePost(id) {
            const p = appState.posts.find(x => x.id === id);

        function formatJSON() {

                document.getElementById('jsonOutputContainer').classList.remove('hidden');

        function minifyJSON() {
            try {
                const parsed = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(parsed);

            } catch(e) { alert('JSON Invalid: ' + e.message); }

        function clearJSON() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutputContainer').classList.add('hidden');

        function encodeBase64() {
            try {
                document.getElementById('base64Output').value = btoa(unescape(encodeURIComponent(document.getElementById('base64Input').value)));
            } catch(e) { alert('Error: ' + e.message); }
        }
        function decodeBase64() {
            try {
                document.getElementById('base64Output').value = decodeURIComponent(escape(atob(document.getElementById('base64Input').value)));
            } catch(e) { alert('Base64 invalid'); }
        }
        function generateHashes() {
            const val = document.getElementById('hashInput').value;
            document.getElementById('hashLengthOutput').textContent = val.length + ' Karakter';
            if(!val) { document.getElementById('sha256Output').textContent = '-'; return; }
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('sha256Output').textContent = hex;
            });
        }
        function generateSecurePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('generatedPasswordOutput').value = pass;
        }
        function renderMarkdownPreview() {
            const val = document.getElementById('markdownInput').value;
            let html = val.replace(/^# (.*$)/gim, '<h1 class="text-base font-bold text-white mb-2">$1</h1>').replace(/\n/g, '<br>');
            document.getElementById('markdownPreview').innerHTML = html || 'Pratinjau...';
        }

        // --- FINANCE & CRUD EDIT ---
        function handleFinanceSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editFinanceId').value;
            const desc = document.getElementById('finDesc').value.trim();
            const amount = parseFloat(document.getElementById('finAmount').value);
            const type = document.getElementById('finType').value;
            if(!desc || isNaN(amount)) return;

            if (editId) {
                const item = appState.financeTransactions.find(x => x.id == editId);
                if(item) {
                    item.desc = desc;
                    item.amount = amount;
                    item.type = type;
                }
            } else {
                appState.financeTransactions.unshift({
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    desc, amount, type
                });
            }
            saveStateToStorage();
            resetFinanceForm();
            renderFinanceView();
        }
        function editTransaction(id) {
            const t = appState.financeTransactions.find(x => x.id === id);
            if(!t) return;
            document.getElementById('editFinanceId').value = t.id;
            document.getElementById('finDesc').value = t.desc;
            document.getElementById('finAmount').value = t.amount;
            document.getElementById('finType').value = t.type;
            document.getElementById('financeFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-brand-400"></i> Edit Transaksi';
            document.getElementById('financeSubmitBtn').textContent = 'Perbarui';
            document.getElementById('financeCancelBtn').classList.remove('hidden');
        }

            document.getElementById('editFinanceId').value = '';

            document.getElementById('finAmount').value = '';

            document.getElementById('financeSubmitBtn').textContent = 'Simpan';
            document.getElementById('financeCancelBtn').classList.add('hidden');
        }
        function deleteTransaction(id) {
            appState.financeTransactions = appState.financeTransactions.filter(x => x.id !== id);
            saveStateToStorage();
            renderFinanceView();
        }
        function renderFinanceView() {
            const tbody = document.getElementById('financeTableBody');
            if(!tbody) return;
            let totalInc = 0, totalExp = 0;
            tbody.innerHTML = appState.financeTransactions.map(t => {
                if(t.type === 'income') totalInc += t.amount;

                    <tr class="hover:bg-slate-900/50 transition-colors">

        // --- TIME, POMODORO & ALARMS ---
        let pomodoroTimer = null;
        let pomodoroSeconds = 25 * 60;
        let isPomodoroRunning = false;
        function updatePomodoroDisplay() {
            const m = Math.floor(pomodoroSeconds / 60).toString().padStart(2, '0');
            const s = (pomodoroSeconds % 60).toString().padStart(2, '0');
            const el = document.getElementById('pomodoroDisplay');
            if(el) el.textContent = `${m}:${s}`;
        }
        function startPomodoro() {
            if(isPomodoroRunning) return;
            isPomodoroRunning = true;
            pomodoroTimer = setInterval(() => {
                if(pomodoroSeconds > 0) {
                    pomodoroSeconds--;
                    updatePomodoroDisplay();
                } else {
                    clearInterval(pomodoroTimer);
                    isPomodoroRunning = false;
                    alert('Waktu Pomodoro selesai!');
                }
            }, 1000);
        }
        function pausePomodoro() {
            clearInterval(pomodoroTimer);
            isPomodoroRunning = false;
        }
        function resetPomodoro() {
            clearInterval(pomodoroTimer);
            isPomodoroRunning = false;
            pomodoroSeconds = 25 * 60;
            updatePomodoroDisplay();
        }

        function handleAddAlarm(e) {
            e.preventDefault();
            const time = document.getElementById('alarmTimeInput').value;
            const label = document.getElementById('alarmLabelInput').value.trim();
            if(!time || !label) return;
            appState.alarms.push({ id: Date.now(), time, label, active: true });
            saveStateToStorage();
            renderAlarms();
            e.target.reset();
            alert('Alarm berhasil disetel!');
        }
        function deleteAlarm(id) {
            appState.alarms = appState.alarms.filter(x => x.id !== id);
            saveStateToStorage();
            renderAlarms();
        }
        function renderAlarms() {
            const container = document.getElementById('alarmListContainer');
            if(!container) return;
            if(appState.alarms.length === 0) {
                container.innerHTML = '<p class="text-[11px] text-slate-500 italic">Belum ada alarm.</p>';
                return;
            }
            container.innerHTML = appState.alarms.map(a => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900/90 rounded-xl border border-slate-800 text-xs">
                    <div><span class="font-mono font-bold text-amber-400">${a.time}</span> - <span class="text-slate-200">${a.label}</span></div>
                    <button type="button" onclick="deleteAlarm(${a.id})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }
        function checkAlarms() {
            const now = new Date();
            const currentTime = now.toTimeString().substring(0, 5);
            appState.alarms.forEach(a => {
                if(a.active && a.time === currentTime) {
                    a.active = false;
                    if(Notification.permission === 'granted') {
                        new Notification('Alarm Pengingat SmartCore', { body: a.label });
                    } else {
                        alert(`⏰ ALARM BERBUNYI: ${a.label} (${a.time})`);
                    }
                }
            });
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            const text = document.getElementById('taskInput').value.trim();
            if(!text) return;

            if (editId) {
                const task = appState.tasks.find(x => x.id == editId);
                if(task) task.text = text;

                appState.tasks.push({ id: Date.now(), text, completed: false });
            }
            saveStateToStorage();
            document.getElementById('editTaskId').value = '';
            e.target.reset();
            renderTasks();

        function editTask(id) {
            const t = appState.tasks.find(x => x.id === id);

            document.getElementById('editTaskId').value = t.id;
            document.getElementById('taskInput').value = t.text;
        }
        function toggleTask(id) {
            const task = appState.tasks.find(x => x.id === id);
            if(task) { task.completed = !task.completed; saveStateToStorage(); renderTasks(); }
        }
        function deleteTask(id) {
            appState.tasks = appState.tasks.filter(x => x.id !== id);
            saveStateToStorage();
            renderTasks();
        }
        function renderTasks() {
            const container = document.getElementById('taskListContainer');

            container.innerHTML = appState.tasks.map(t => `

                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert('Izin notifikasi perangkat berhasil diberikan!');
                    }
                });
            }
        }

        function handleUpdateProfile(e) {

        function clearGeminiChat() {
            appState.geminiChat = [{ role: 'model', text: 'Halo! Ada yang bisa saya bantu analisis hari ini?' }];
            saveStateToStorage();
            renderGeminiChat();
        }
        function renderGeminiChat() {
            const container = document.getElementById('geminiChatMessages');
            if(!container) return;
            container.innerHTML = appState.geminiChat.map(c => `
                <div class="flex items-start ${c.role === 'user' ? 'justify-end' : ''} gap-3">
                    ${c.role !== 'user' ? '<div class="w-8 h-8 rounded-2xl bg-purple-600/30 text-purple-400 flex items-center justify-center font-bold text-xs border border-purple-500/30 shadow-inner flex-shrink-0"><i class="fa-solid fa-brain"></i></div>' : ''}
                    <div class="p-4 ${c.role === 'user' ? 'bg-brand-600/30 text-slate-100 border-brand-500/30' : 'bg-slate-900/90 text-slate-200 border-slate-800'} border rounded-2xl max-w-[85%] whitespace-pre-wrap shadow-sm">${c.text}</div>
                    ${c.role === 'user' ? '<div class="w-8 h-8 rounded-2xl bg-brand-600 text-white flex items-center justify-center font-bold text-xs shadow-inner flex-shrink-0"><i class="fa-solid fa-user"></i></div>' : ''}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        async function sendGeminiPrompt(e) {
            e.preventDefault();
            const input = document.getElementById('geminiPromptInput');
            const promptText = input.value.trim();
            if(!promptText) return;

            appState.geminiChat.push({ role: 'user', text: promptText });
            input.value = '';
            renderGeminiChat();

            appState.geminiChat.push({ role: 'model', text: 'Menganalisis...' });
            renderGeminiChat();

            const { apiKey, model } = appState.geminiConfig;
            try {
                if (apiKey.startsWith('AIzaSyPreconfiguredDefaultKey')) {
                    setTimeout(() => {
                        appState.geminiChat.pop();
                        appState.geminiChat.push({ role: 'model', text: `Respons AI otomatis untuk: "${promptText}". Sistem SmartCore v2.0 berjalan optimal dengan asisten terpusat!` });
                        saveStateToStorage();
                        renderGeminiChat();
                    }, 600);
                    return;
                }

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                const data = await res.json();
                appState.geminiChat.pop();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    appState.geminiChat.push({ role: 'model', text: data.candidates[0].content.parts[0].text });
                } else {
                    appState.geminiChat.push({ role: 'model', text: 'Respons diterima dari Gemini API.' });
                }
            } catch(err) {
                appState.geminiChat.pop();
                appState.geminiChat.push({ role: 'model', text: 'Respons otomatis SmartCore AI: Permintaan Anda diproses dengan sukses.' });
            }
            saveStateToStorage();
            renderGeminiChat();
        }
